function openPart(id,type,onSave){
  const src=id?byId('parts',id):null;
  const p=src?Object.assign(JSON.parse(JSON.stringify(Object.assign({},src,{img:null}))),{img:src.img||null}):{id:uid(),type,name:'',tags:'',subject:type==='chara'?'girl':'',weight:type==='lora'?0.7:'',loraName:'',neg:'',memo:'',text:''};
  const T=PT[p.type];const used=src?partUsage(src.id):0;
  openSheet(`<h2>${src?T.label+'を直す':'新しい'+T.label}</h2>
  <label class="f"><span>名前（アプリの中での呼び名）</span><input id="pName" value="${esc(p.name)}" placeholder="${esc(T.namePh)}"></label>
  <div class="f"><span>見本の画像${IMG_TYPES.includes(p.type)?'（シーンで選ぶとき、画像を並べて選べます）':'（なくてもよい）'}</span><div class="pimg"><div class="ph" id="pImgPh">画像なし</div>
    <div class="row" style="margin:0;flex-direction:column;align-items:flex-start;gap:6px"><label class="btn ghost sm">画像を選ぶ<input type="file" accept="image/*" hidden id="pImgIn"></label><button type="button" class="btn ghost sm" id="pImgDel" hidden>外す</button></div></div>
    <span class="hint">PixAI で作った絵など、どんな感じかがわかる画像を入れておくと選びやすくなります。</span></div>
  ${p.type==='chara'?`<label class="f"><span>呼び方（プロンプトの先頭の言葉）</span><input id="pSubj" list="subjList" value="${esc(p.subject)}" placeholder="girl"><datalist id="subjList"><option value="girl"><option value="boy"><option value="woman"><option value="man"><option value="1girl"><option value="1boy"></datalist><span class="hint">girl・boy などで書くと、人数のタグ（1girl・2girls・1boy）が自動で付きます</span></label>`:''}
  ${p.type==='lora'?`<label class="f"><span>LoRA の正式な名前（PixAI で探すときの名前）</span><input id="pLname" value="${esc(p.loraName)}" placeholder="名前と同じなら空のまま"></label>
  <label class="f"><span>標準の重み</span><input id="pW" type="number" step="0.05" inputmode="decimal" value="${esc(p.weight)}"></label>`:''}
  <label class="f"><span>${p.type==='lora'?'トリガーワード（プロンプトに足すタグ）':'タグ（カンマ区切り）'}</span><textarea id="pTags" rows="3" placeholder="${esc(T.ph)}">${esc(p.tags)}</textarea><span class="hint">${esc(T.hint)}</span></label>
  ${p.type!=='lora'?`<label class="f"><span>文章で書くとき（Tsubaki 系・英語・なくてもよい）</span><textarea id="pText" rows="2" placeholder="${esc(TEXT_PH[p.type]||'')}">${esc(p.text||'')}</textarea><span class="hint">プロンプトの形が「文章」のときだけ、タグの代わりにこの文を使います。空のままならタグから文を作ります。</span></label>`:''}
  ${p.type==='style'?`<label class="f"><span>ネガティブプロンプト</span><textarea id="pNegT" rows="3" placeholder="lowres, blurry, jpeg artifacts, text, watermark">${esc(p.neg)}</textarea></label>${negHelp()}`:''}
  <label class="f"><span>メモ</span><textarea id="pMemo" rows="2" placeholder="${p.type==='lora'?'PixAI のURL・合う重みなど':''}">${esc(p.memo)}</textarea></label>
  ${used?`<div class="banner info">この部品は ${used} 件のシーンで使っています。直すと、そのすべてのシーンのプロンプトが変わります。</div>`:''}
  <div class="row"><button class="btn" id="pSave">保存</button>${src?'<button class="btn ghost" id="pDup">複製</button><button class="btn danger" id="pDel">削除</button>':''}<button class="btn ghost" id="pCancel">やめる</button></div>`);
  setTimeout(()=>{if(!src)$('#pName')&&$('#pName').focus();},50);
  let tmpUrl='';
  const showImg=()=>{const ph=$('#pImgPh');if(tmpUrl){URL.revokeObjectURL(tmpUrl);tmpUrl='';}
    if(p.img){tmpUrl=URL.createObjectURL(p.img);ph.style.backgroundImage=`url(${tmpUrl})`;ph.textContent='';}else{ph.style.backgroundImage='';ph.textContent='画像なし';}
    $('#pImgDel').hidden=!p.img;};
  showImg();
  $('#pImgIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;p.img=await makeThumb(f,512);showImg();};
  $('#pImgDel').onclick=()=>{p.img=null;showImg();};
  const read=o=>{o.name=$('#pName').value.trim();o.tags=$('#pTags').value.trim();if($('#pSubj'))o.subject=$('#pSubj').value.trim()||'girl';if($('#pLname'))o.loraName=$('#pLname').value.trim();if($('#pW'))o.weight=$('#pW').value;if($('#pNegT'))o.neg=$('#pNegT').value.trim();if($('#pText'))o.text=$('#pText').value.trim();o.memo=$('#pMemo').value;if(!o.name)o.name=(o.tags.slice(0,18)||'名前なし');return o;};
  $('#pCancel').onclick=closeSheet;
  $('#pSave').onclick=async()=>{read(p);const i=S.parts.findIndex(x=>x.id===p.id);if(i>=0)S.parts[i]=p;else S.parts.push(p);await saveNow('parts',p);closeSheet();onSave&&onSave(p);toast('保存しました');};
  const dp=$('#pDup');if(dp)dp.onclick=async()=>{const n=read(Object.assign(JSON.parse(JSON.stringify(Object.assign({},p,{img:null}))),{img:p.img||null}));n.id=uid();n.name+='（コピー）';S.parts.push(n);await saveNow('parts',n);closeSheet();setTimeout(()=>openPart(n.id,null,onSave),30);};
  const dl=$('#pDel');if(dl)dl.onclick=async()=>{if(!confirm(used?`この部品は ${used} 件のシーンで使っています。削除すると、そのシーンからも外れます。削除しますか？`:'この部品を削除しますか？'))return;
    for(const s of S.scenes){let ch=false;for(const c of s.chars||[]){for(const f of['chara','outfit','action','face'])if(c[f]===p.id){c[f]='';ch=true;}
        for(const f of['body','phys'])if((c[f]||[]).includes(p.id)){c[f]=c[f].filter(x=>x!==p.id);ch=true;}}
      for(const f of['bg','style','camera','light'])if(s[f]===p.id){s[f]='';ch=true;}
      for(const f of['inter','angle'])if((s[f]||[]).includes(p.id)){s[f]=s[f].filter(x=>x!==p.id);ch=true;}
      if((s.loras||[]).some(l=>l.id===p.id)){s.loras=s.loras.filter(l=>l.id!==p.id);ch=true;}
      if(ch)await saveNow('scenes',s);}
    S.parts=S.parts.filter(x=>x.id!==p.id);await dbDel('parts',p.id);closeSheet();onSave&&onSave(null);};
}

/* 字体の入れ方の説明（Pixel 7a・Chrome の場合）。文を直すときは、この中の文章を書き換える */
function openFontHelp(){
  const step=(n,t,body)=>`<div class="hstep"><div class="hnum">${n}</div><div class="hbody"><b>${t}</b>${body}</div></div>`;
  openSheet(`<h2>字体の入れ方（Pixel 7a の場合）</h2>
  <p class="hint" style="margin:-6px 0 14px">全体の流れ：<b>① 字体をダウンロード → ② zip を展開 → ③ アプリに取り込む → ④ 基本の字体を決める</b>。字体の取り込みは、1つの字体につき1回だけです。</p>

  <div class="hsec"><h3>1. しっぽりアンチックをダウンロードする</h3>
  ${step(1,'Chrome で Google Fonts を開く','<p>アドレスの欄に <code>fonts.google.com</code> と入れて開きます。</p>')}

  </dl></div>

  <div class="row"><button class="btn wide" id="fhClose">閉じる</button></div>`);
  $('#fhClose').onclick=closeSheet;

const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob);});
const unb64=d=>fetch(d).then(r=>r.blob());
async function exportAll(){
  flush();toast('書き出しています…');
  try{
    const images=[];for(const r of await dbAll('images'))images.push({id:r.id,name:r.name,type:r.type,data:await b64(r.blob),thumb:r.thumb?await b64(r.thumb):null});
    const fonts=[];for(const f of await dbAll('fonts'))fonts.push({id:f.id,name:f.name,file:f.file,size:f.size,created:f.created,data:await b64(f.blob)});
    const stamps=[];for(const r of await dbAll('stamps'))stamps.push({id:r.id,name:r.name,w:r.w,h:r.h,created:r.created,data:await b64(r.blob)});
    const data={app:'4koma-kobo',version:1,exported:new Date().toISOString(),meta:S.meta,parts:await Promise.all(S.parts.map(async p=>p.img?Object.assign({},p,{img:await b64(p.img)}):p)),scenes:S.scenes,works:S.works,images,fonts,stamps};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`4koma-backup-${ymd()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},10000);
    S.meta.lastBackup=Date.now();await dbPut('meta',S.meta);toast('書き出しました（ダウンロードのフォルダ）');render(true);
  }catch(e){toast('書き出せませんでした');}
}
async function importAll(file,replace){
  let data;try{data=JSON.parse(await file.text());}catch(e){return toast('読み込めないファイルです');}
  if(!data||data.app!=='4koma-kobo')return toast('このアプリのバックアップではありません');
  if(replace&&!confirm('今のデータをすべて消して、バックアップの内容に置き換えます。よろしいですか？'))return;
  toast('読み込んでいます…');
  try{
    flush();
    if(replace)for(const s of['parts','scenes','works','images','fonts','stamps'])await tx(s,'readwrite',st=>st.clear());
    for(const r of data.images||[])await dbPut('images',{id:r.id,name:r.name,type:r.type,blob:await unb64(r.data),thumb:r.thumb?await unb64(r.thumb):null});
    for(const r of data.stamps||[])await dbPut('stamps',{id:r.id,name:r.name,w:r.w,h:r.h,created:r.created,blob:await unb64(r.data)});
    for(const r of data.fonts||[])await dbPut('fonts',{id:r.id,name:r.name,file:r.file,size:r.size,created:r.created,blob:await unb64(r.data)});
    if(data.meta&&Array.isArray(data.meta.bsets)){const have=new Set((S.meta.bsets||[]).map(s=>s.id));S.meta.bsets=replace?data.meta.bsets:[...(S.meta.bsets||[]),...data.meta.bsets.filter(s=>!have.has(s.id))];}
    if(data.meta){for(const k of['jpFont','expSize','expType','fmt','loraInPrompt'])if(data.meta[k]!==undefined&&(replace||S.meta[k]===undefined))S.meta[k]=data.meta[k];await dbPut('meta',S.meta);}
    for(const k of['parts','scenes','works'])for(const o of data[k]||[]){if(k==='parts'&&typeof o.img==='string')o.img=await unb64(o.img);await dbPut(k,o);}
    for(const k in urlCache){URL.revokeObjectURL(urlCache[k]);delete urlCache[k];}
    await loadAll();for(const k in imgCache)delete imgCache[k];for(const k in stampImg)delete stampImg[k];for(const k in stampCv)delete stampCv[k];await loadStamps().catch(()=>{});await loadFonts().catch(()=>{});toast('読み込みました');render();
  }catch(e){toast('読み込みの途中で失敗しました');}
}

  const s3=SC('驚くミカ（夕方）',['転'],[{chara:mika.id,outfit:swim.id,action:stand.id,face:surp.id,body:[sweat.id,blush.id],add:'looking back'}],beach.id,{add:'sunset, orange sky',remove:'daytime, blue sky'});
  const s4=SC('教室でハグする二人',['結'],[{chara:mika.id,outfit:uni.id,action:stand.id,face:smile.id,body:[blush.id]},{chara:sen.id,outfit:uni.id,action:stand.id,face:surp.id,add:'scratching head'}],cls.id,{inter:[hug.id],loras:[{id:lo.id,weight:''}]});
  const w={id:uid(),title:'サンプル：夏の勘違い',panels:[s1.id,s2.id,s3.id,s4.id],lines:['ミカ「海だー！」','先輩「おーい、ミカ！」','ミカ「えっ、先輩なんでここに！？」','先輩「…夢オチかよ」'],memo:'',created:Date.now(),updated:Date.now()};
  for(const p of parts){S.parts.push(p);await dbPut('parts',p);}

/* ネガティブプロンプトの効かせ方（参考：note「ネガティブプロンプトで消えない理由」） */
function negHelp(){return `<details class="nh"><summary>ネガティブの効かせ方を見る</summary><div class="nhb">  <p style="margin:0 0 10px">ネガティブは「消す命令」ではなく「<b>弱める</b>」ものです。ポジティブのほうが強いので、ネガに書いても消えないことがよくあります。</p>
  <div class="sec" style="margin-bottom:10px"><h2>効きやすいもの</h2><p class="hint" style="margin:0">あとから付く小物（glasses など）・頬の赤み・画質（lowres, blurry, jpeg artifacts）・文字（text, watermark）・背景（simple background）</p></div>
  <div class="sec" style="margin-bottom:10px"><h2>効きにくいもの</h2><p class="hint" style="margin:0">その言葉と一体の特徴（angel の翼、猫耳キャラのしっぽ）・キャラLoRAに焼き付いた服・手や指の数・構図やカメラ位置。bad hands, extra fingers を入れても直りにくいです。</p></div>
  <div class="sec" style="margin-bottom:10px"><h2>消したいときのやり方</h2>
  <ol style="margin:0;padding-left:1.3em;line-height:1.7;font-size:14px">
    <li><b>言葉を分ける（いちばん効く）</b>：angel ではなく white dress, halo のように、ほしい部分だけを書く</li>
    <li><b>ポジティブで「なし」と書く</b>：no wings, without wings, wingless</li>
    <li><b>重みで調整</b>：元の言葉を弱める（angel:0.8）／ネガを強める（wings:1.5）。強すぎると絵が崩れます</li>
    <li><b>言いかえを足す</b>：feathered wings, angel wings など。ただしネガを長くしすぎると、かえって効きが弱まります</li>
    <li><b>手や指・しつこい部分</b>：ネガより、できた絵の一部を描き直す（inpaint）ほうが早いです</li>
  </ol></div>
  <p class="hint" style="margin:0 0 12px">モデルによって効き方は変わります。何枚か出して、当たりを選ぶつもりで使ってください。</p>
  </div></details>`;}
/* ========== 起動 ========== */
(async()=>{
  history.replaceState({n:1},'');
  /* オフラインで動かす仕組み（https か localhost のときだけ使える） */
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    /* 新しい版が入ったら、1回だけ自動で読み込み直す（はじめて入れたときは読み込み直さない） */
    const had=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloaded)return;reloaded=true;try{sessionStorage.setItem('updated','1');}catch(_){}location.reload();});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});}).catch(()=>{});
    try{if(sessionStorage.getItem('updated')){sessionStorage.removeItem('updated');setTimeout(()=>toast('新しい版になりました'),600);}}catch(_){}
  }
  try{db=await openDB();await loadAll();if(S.meta.pin){delete S.meta.pin;delete S.meta.lockAfter;dbPut('meta',S.meta);}/* v14 のパスワードは使わなくなった */await loadStamps().catch(()=>{});await loadFonts().catch(()=>{});}
  catch(e){db=null;view.innerHTML='<div class="banner">このブラウザではデータを保存できません（プライベートモードなど）。閉じると内容が消えます。</div>';}
  render();
  if(db&&navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(v=>{if(!v)navigator.storage.persist().catch(()=>{});}).catch(()=>{});
})();
