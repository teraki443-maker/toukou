const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob);});
const unb64=d=>fetch(d).then(r=>r.blob());
/* ===== 書き出し =====
   ・スマホは「共有」で Googleドライブなどへ送る。PCは「この端末に保存」でダウンロードのフォルダへ
   ・スマホの共有は .json のファイルを送れないので、中身は同じ JSON のまま .txt の名前にする（読み込みはどちらも使える）
   ・共有はボタンを押してすぐに呼ばないと断られるので、シートを開いたときに先にファイルを作っておく */
function ymdhm(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${ymd()}-${z(d.getHours())}${z(d.getMinutes())}`;}
async function buildExport(withImg){
  flush();
  const images=[],fonts=[],stamps=[];
  if(withImg){
    for(const r of await dbAll('stamps'))stamps.push({id:r.id,name:r.name,w:r.w,h:r.h,created:r.created,data:await b64(r.blob)});
    for(const r of await dbAll('images'))images.push({id:r.id,name:r.name,type:r.type,data:await b64(r.blob),thumb:r.thumb?await b64(r.thumb):null});
    for(const f of await dbAll('fonts'))fonts.push({id:f.id,name:f.name,file:f.file,size:f.size,created:f.created,data:await b64(f.blob)});
  }
  const data={app:'4koma-kobo',version:1,exported:new Date().toISOString(),textOnly:!withImg,meta:S.meta,parts:await Promise.all(S.parts.map(async p=>p.img?Object.assign({},p,{img:await b64(p.img)}):p)),scenes:S.scenes,works:S.works,images,fonts,stamps};
  return JSON.stringify(data);
}
function openExport(){
  const tf=new File(['x'],'t.txt',{type:'text/plain'});
  const canShare=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:[tf]}));
  const mobile=matchMedia('(pointer:coarse)').matches;
  openSheet(`<h2>書き出す</h2>
  <label class="switch"><input type="checkbox" id="exImg" checked><span>画像・字体・スタンプも入れる<span class="hint">外すと、部品・シーン・作品・設定（文字のデータ）だけになり、ファイルが小さくなります。プロンプトだけを急いで渡したいときに。画像のない端末では、そのシーンの画像は出ません。</span></span></label>
  <p class="hint" id="exInfo">ファイルを作っています…</p>
  <div class="row">${canShare?`<button class="btn ${mobile?'':'ghost'}" id="exShare" disabled>共有する（Googleドライブなど）</button>`:''}<button class="btn ${canShare&&mobile?'ghost':''}" id="exSave" disabled>この端末に保存</button></div>
  <p class="hint">${canShare?'スマホは「共有する」→「ドライブ」を選ぶと、Googleドライブに保存されます。PCでは drive.google.com からダウンロードして「読み込む（合わせる）」で取り込みます。':'PCでは「この端末に保存」でダウンロードのフォルダに入ります。スマホへ渡すときは、そのファイルを Googleドライブに上げてください。'}</p>
  <div class="row"><button class="btn ghost wide" id="exClose">閉じる</button></div>`);
  let ready=null,seq=0;
  const prep=async()=>{
    const my=++seq,withImg=$('#exImg').checked;ready=null;
    $$('#exShare,#exSave').forEach(x=>x.disabled=true);$('#exInfo').textContent='ファイルを作っています…';
    try{
      const json=await buildExport(withImg);if(my!==seq)return;
      const base=`toukou-${withImg?'backup':'moji'}-${ymdhm()}`;
      ready={withImg,json,base};
      $('#exInfo').textContent=`準備ができました（約 ${json.length<1048576?Math.max(1,Math.round(json.length/1024))+' KB':(json.length/1048576).toFixed(1)+' MB'}${withImg?'・画像など入り':'・文字だけ'}）`;
      $$('#exShare,#exSave').forEach(x=>x.disabled=false);
    }catch(e){if(my===seq)$('#exInfo').textContent='ファイルを作れませんでした';}
  };
  const done=async r=>{if(r.withImg){S.meta.lastBackup=Date.now();await dbPut('meta',S.meta);}};
  $('#exImg').onchange=prep;
  $('#exClose').onclick=()=>{closeSheet();render(true);};
  if($('#exShare'))$('#exShare').onclick=async()=>{
    const r=ready;if(!r)return;
    const f=new File([r.json],r.base+'.txt',{type:'text/plain'});
    try{await navigator.share({files:[f],title:r.base});await done(r);toast('共有しました');}
    catch(e){if(e&&e.name==='AbortError')return;toast('共有できませんでした。「この端末に保存」を使ってください');}
  };
  $('#exSave').onclick=async()=>{
    const r=ready;if(!r)return;
    const blob=new Blob([r.json],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=r.base+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},10000);
    await done(r);toast('保存しました（ダウンロードのフォルダ）');
  };
  prep();
}

/* ===== 読み込み =====
   replace=false（合わせる）：同じ id は updated（直した日時）の新しい方を残す。消した記録（meta.deleted）もお互いに反映する
   replace=true（置き換え）：今のデータを消してから、ファイルの内容をそのまま入れる */
async function importAll(file,replace){
  let data;try{data=JSON.parse(await file.text());}catch(e){return toast('読み込めないファイルです');}
  if(!data||data.app!=='4koma-kobo')return toast('このアプリのバックアップではありません');
  if(replace&&!confirm('今のデータをすべて消して、ファイルの内容に置き換えます。よろしいですか？'))return;
  toast('読み込んでいます…');
  const cnt={add:0,upd:0,keep:0,del:0,img:0};
  try{
    flush();
    const inDel=(data.meta&&data.meta.deleted)||{};
    const tomb=replace?Object.assign({},inDel):Object.assign({},S.meta.deleted||{});
    if(!replace)for(const id in inDel)if(!(tomb[id]>=inDel[id]))tomb[id]=inDel[id];
    if(replace)for(const st of['parts','scenes','works','images','fonts','stamps'])await tx(st,'readwrite',x=>x.clear());
    const haveImg=new Set(replace?[]:(await tx('images','readonly',x=>x.getAllKeys())||[]));
    const haveFont=new Set(replace?[]:(await tx('fonts','readonly',x=>x.getAllKeys())||[]));
    for(const r of data.images||[]){if(haveImg.has(r.id))continue;await dbPut('images',{id:r.id,name:r.name,type:r.type,blob:await unb64(r.data),thumb:r.thumb?await unb64(r.thumb):null});cnt.img++;}
    const haveSt=new Set(replace?[]:(await tx('stamps','readonly',x=>x.getAllKeys())||[]));
    for(const r of data.stamps||[]){if(haveSt.has(r.id)||(!replace&&tomb[r.id]))continue;await dbPut('stamps',{id:r.id,name:r.name,w:r.w,h:r.h,created:r.created,blob:await unb64(r.data)});}
    for(const r of data.fonts||[]){if(haveFont.has(r.id)||(!replace&&tomb[r.id]))continue;await dbPut('fonts',{id:r.id,name:r.name,file:r.file,size:r.size,created:r.created,blob:await unb64(r.data)});}
    if(data.meta&&Array.isArray(data.meta.bsets)){const have=new Set((S.meta.bsets||[]).map(s=>s.id));S.meta.bsets=replace?data.meta.bsets:[...(S.meta.bsets||[]),...data.meta.bsets.filter(s=>!have.has(s.id))];}
    if(data.meta){for(const k of['jpFont','expSize','expType','fmt','loraInPrompt'])if(data.meta[k]!==undefined&&(replace||S.meta[k]===undefined))S.meta[k]=data.meta[k];}
    const freeImgs=[];
    for(const k of['parts','scenes','works']){
      for(const o of data[k]||[]){
        if(k==='parts'&&typeof o.img==='string')o.img=await unb64(o.img);
        const ou=o.updated||0;
        if(replace){await dbPut(k,o);cnt.add++;continue;}
        if(tomb[o.id]&&tomb[o.id]>=ou)continue;
        const cur=byId(k,o.id),cu=cur?(cur.updated||0):-1;
        if(cur&&cu>ou){cnt.keep++;continue;}
        const nm=x=>JSON.stringify(x.img?Object.assign({},x,{img:x.img.size||1}):x);
        if(cur&&cu===ou&&(cu>0||nm(cur)===nm(o)))continue;
        await dbPut(k,o);cur?cnt.upd++:cnt.add++;
      }
      if(!replace)for(const cur of S[k]){const t=inDel[cur.id];if(t&&t>=(cur.updated||0)){await dbDel(k,cur.id);cnt.del++;if(k==='scenes')freeImgs.push(...(cur.images||[]));}}
    }
    if(!replace)for(const id of haveFont)if(inDel[id]){await dbDel('fonts',id);if(S.meta.jpFont===id)S.meta.jpFont='';}
    if(!replace)for(const id of haveSt)if(inDel[id])await dbDel('stamps',id);
    const old=Date.now()-180*864e5;for(const id in tomb)if(tomb[id]<old)delete tomb[id];
    S.meta.deleted=tomb;await dbPut('meta',S.meta);
    for(const k in urlCache){URL.revokeObjectURL(urlCache[k]);delete urlCache[k];}
    await loadAll();for(const id of freeImgs)await deleteImageIfUnused(id);
    for(const k in imgCache)delete imgCache[k];for(const k in stampImg)delete stampImg[k];for(const k in stampCv)delete stampCv[k];await loadStamps().catch(()=>{});await loadFonts().catch(()=>{});
    if(replace){toast('読み込みました');render();return;}
    render();
    openSheet(`<h2>読み込みました</h2>
    <p class="hint" style="margin:-6px 0 12px">ファイル：${esc(file.name)}${data.exported?`（${fmtDate(Date.parse(data.exported))} に書き出したもの${data.textOnly?'・文字だけ':''}）`:''}</p>
    <div class="stat"><div><b>${cnt.add}</b><small>新しく足した</small></div><div><b>${cnt.upd}</b><small>新しい方に更新</small></div><div><b>${cnt.keep}</b><small>こちらが新しいので残した</small></div><div><b>${cnt.del}</b><small>相手で消したので消した</small></div></div>
    <p class="hint">画像：${cnt.img} 枚を足しました。数はシーン・作品・部品を合わせたものです。</p>
    <div class="row"><button class="btn wide" id="imClose">閉じる</button></div>`);
    $('#imClose').onclick=closeSheet;
  }catch(e){toast('読み込みの途中で失敗しました');}
}

/* ===== OpenPose の棒人形（黒地・18点。PixAI の OpenPose に読み込ませる画像） ===== */

function opPaint(people,cw,ch){

const PIC_PARENT={head:'neck',neck:'pel',rE:'rS',rH:'rE',lE:'lS',lH:'lE',rK:'rP',rF:'rK',lK:'lP',lF:'lK'};
const PIC_KIDS={pel:['neck','rP','lP'],neck:['head','rS','lS'],head:['eyeR','eyeL','nose','earR','earL'],rS:['rE'],rE:['rH'],lS:['lE'],lE:['lH'],rP:['rK'],rK:['rF'],rF:['rT'],lP:['lK'],lK:['lF'],lF:['lT']};
const PIC_HANDLES=['head','neck','rE','rH','lE','lH','rK','rF','lK','lF'];
function picSub(n,acc){acc=acc||[];acc.push(n);(PIC_KIDS[n]||[]).forEach(c=>picSub(c,acc));return acc;}
/* ポーズを作るときに固定できる部位：[名前, 白い丸, 付け根の関節, 動く関節] */
const PIC_LOCKS={head:['頭',['head'],'neck',picSub('head')],body:['上半身',['neck'],'pel',picSub('neck')],
  rArm:['右腕',['rE','rH'],'rS',['rE','rH']],lArm:['左腕',['lE','lH'],'lS',['lE','lH']],rLeg:['右脚',['rK','rF'],'rP',['rK','rF','rT']],lLeg:['左脚',['lK','lF'],'lP',['lK','lF','lT']]};
const PIC_LOCK_OF={};for(const g in PIC_LOCKS)for(const h of PIC_LOCKS[g][1])PIC_LOCK_OF[h]=g;
/* 新しいポーズ nw に替えるとき、固定した部位だけ今の形 old を残す（付け根からの位置をそのまま写す）。
   上半身を固定したときは、固定していない頭・腕を、新しいポーズの形で今の上半身に付けなおす */
function picKeepLocks(old,nw,lock){if(!lock.size)return nw;const R=picClone(nw);
  const put=(names,base,from,fb)=>{for(const n of names)if(from[n])R[n]=[R[base][0]+from[n][0]-from[fb||base][0],R[base][1]+from[n][1]-from[fb||base][1],R[base][2]+from[n][2]-from[fb||base][2]];};
  if(lock.has('body')){put(picSub('neck'),'pel',old);for(const g of['head','rArm','lArm'])if(!lock.has(g)){const[, ,b,ns]=PIC_LOCKS[g];put(ns.filter(n=>n!==b),b,nw);}}
  for(const g of['head','rArm','lArm','rLeg','lLeg'])if(lock.has(g)){const[, ,b,ns]=PIC_LOCKS[g];put(ns,b,old);}
  return R;}

      +(ED.lock.size?'<button type="button" class="tg new" data-lk="none">固定をすべて外す</button>':'');
    $$('[data-lk]',$('#edLock')).forEach(b=>b.onclick=()=>{const g=b.dataset.lk;if(g==='none')ED.lock.clear();else if(ED.lock.has(g))ED.lock.delete(g);else ED.lock.add(g);drawLock();draw();});};
  drawLock();
  /* メモ（組み合わせ用）。{名前, タグ, 形} を1行ずつ（ED.memo）。行をタップすると、その形とタグを呼び出す。この画面を閉じると消える */
  ED.memo=[];
  const drawMemo=()=>{const box=$('#edMemo');
    box.innerHTML=ED.memo.length?ED.memo.map((m,i)=>`<div class="mrow"><button type="button" class="mcall" data-mi="${i}"><b>${esc(m.name)}</b>：${esc(m.tags)}</button><button type="button" class="mdel" data-md="${i}" aria-label="この行を消す">✕</button></div>`).join('')
      :'<p class="hint" style="margin:0">まだありません。「今のポーズをメモに足す」で足します。</p>';
    $$('[data-mi]',box).forEach(b=>b.onclick=()=>{const m=ED.memo[+b.dataset.mi];ED.P=picKeepLocks(ED.P,picFill(picClone(m.P)),ED.lock);$('#edTags').value=m.tags;
      const n=$('#edName');if(!n.value.trim()||n.value===ED.autoName){n.value=m.name;ED.autoName=n.value;}draw();toast(`「${m.name}」を呼び出しました`);});
    $$('[data-md]',box).forEach(b=>b.onclick=()=>{ED.memo.splice(+b.dataset.md,1);drawMemo();});};
  drawMemo();
  $('#edMemoIn').onclick=()=>{const t=splitTags($('#edTags').value).join(', ');if(!t)return toast('タグが空です');const name=$('#edName').value.trim()||'今のポーズ';
    const i=ED.memo.findIndex(m=>m.name===name&&m.tags===t);const e={name,tags:t,P:picClone(ED.P)};if(i>=0)ED.memo[i]=e;else ED.memo.push(e);drawMemo();toast('メモに足しました');};
  $('#edMemoOut').onclick=()=>{const t=ED.memo.flatMap(m=>splitTags(m.tags));if(!t.length)return toast('メモが空です');const ta=$('#edTags');ta.value=uniq([...splitTags(ta.value),...t]).join(', ');toast('タグに足しました');};
  $('#edMemoClr').onclick=()=>{if(ED.memo.length&&!confirm('メモを消しますか？'))return;ED.memo=[];drawMemo();};
  /* 日本語 → 英語 */
  $('#edJaGo').onclick=async()=>{const t=$('#edJa').value.trim();if(!t)return toast('日本語を入れてください');const b=$('#edJaGo'),m=$('#edJaMsg');b.disabled=true;b.textContent='直しています…';
    try{const r=await jaToTags(t);
      if(r.tags.length){const ta=$('#edTags');ta.value=uniq([...splitTags(ta.value),...r.tags]).join(', ');}
      if(!$('#edName').value.trim())$('#edName').value=t;
      if(r.fail.length)m.innerHTML=`<b style="color:var(--warn)">「${esc(r.fail.join('、'))}」は直せませんでした。</b><a href="${gtLink(r.fail.join('\n'))}" target="_blank" rel="noopener">Google翻訳で開く</a>（英語をコピーして、タグに貼ってください）`;
      else{m.textContent=`タグに足しました（辞書 ${r.dict}・翻訳 ${r.net}）。合っているか確かめてください。`;$('#edJa').value='';}
    }finally{b.disabled=false;b.textContent='英語に';}};
  $$('[data-ev]').forEach(b=>b.onclick=()=>{ED.yaw=+b.dataset.ev;draw();});
  $('#edYaw').oninput=e=>{ED.yaw=+e.target.value;draw();};
  const toS=e=>{const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*600,y:(e.clientY-r.top)/r.height*680};};
  st.addEventListener('pointerdown',e=>{const q=toS(e),p=proj();let best=null,bd=45;for(const n of PIC_HANDLES){if(ED.lock.has(PIC_LOCK_OF[n]))continue;/* 固定した部位は動かさない */const d=Math.hypot(p[n].X-q.x,p[n].Y-q.y);if(d<bd){bd=d;best=n;}}
    if(best){ED.drag=best;st.setPointerCapture(e.pointerId);draw();}
    else{ED.spin={x:e.clientX,yaw:ED.yaw};st.setPointerCapture(e.pointerId);}});
  st.addEventListener('pointermove',e=>{
    if(ED.spin){const r=svg.getBoundingClientRect();ED.yaw=((ED.spin.yaw-(e.clientX-ED.spin.x)/r.width*360)%360+360)%360;draw();return;}
    if(!ED.drag)return;const q=toS(e),J=ED.drag,Pa=ED.P[PIC_PARENT[J]];
    /* 今見ている面（横 a・縦 y）の中で、親の関節を軸に回す */
    const[pa,pd]=toV(Pa[0],Pa[2]),pb=Pa[1],[ja]=toV(ED.P[J][0],ED.P[J][2]);
    const ma=(q.x-OX)/K,mb=(GY-q.y)/K,d=Math.atan2(mb-pb,ma-pa)-Math.atan2(ED.P[J][1]-pb,ja-pa),c=Math.cos(d),s=Math.sin(d);
    for(const n of picSub(J)){const v=ED.P[n];if(!v)continue;const[va,vd]=toV(v[0]-Pa[0],v[2]-Pa[2]),rb=v[1]-pb;const na=va*c-rb*s,nb=va*s+rb*c;const[nx,nz]=fromV(na,vd);v[0]=Pa[0]+nx;v[2]=Pa[2]+nz;v[1]=pb+nb;}draw();});
  const end=()=>{ED.spin=null;if(ED.drag){ED.drag=null;draw();}};st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  $('#edCancel').onclick=closeSheet;
  /* OpenPose：シーンの人物がピクトグラムを使っていればその位置で、そうでなければ真ん中に1人で */
  $('#edOp').onclick=()=>{if(pc&&pc.on)return picSaveOpenPose(sc,{i:slotI,P:ED.P});
    const t={title:$('#edName').value.trim()||'pose',chars:[{pic:Object.assign(picNew({chars:[0]},0),{on:true,gaze:true,yaw:0})}],pic:{pitch:0,ar:(sc&&sc.pic&&sc.pic.ar)||'800x912'}};picSaveOpenPose(t,{i:0,P:ED.P});};
  /* 画像に合わせる：今の形から始める（この画面は開いたまま） */
  $('#edOpT').onclick=()=>{const nm=$('#edName').value.trim()||'pose';if(pc&&pc.on)return openOpTrace({sc,title:nm,kps:picOpKps(sc,{i:slotI,P:ED.P},true)});openOpTrace({sc,title:nm,P:picClone(ED.P)});};
  $('#edSave').onclick=async()=>{
    const name=$('#edName').value.trim(),tags=$('#edTags').value.trim();
    if(!name)return toast('名前を入れてください');if(!tags)return toast('タグを入れてください');
    const P=picClone(ED.P);let p=part;
    if(p){p.name=name;p.tags=tags;p.skel=P;await saveNow('parts',p);}
    else{p={id:uid(),type:'action',name,tags,subject:'',weight:'',loraName:'',neg:'',memo:'ピクトグラムで作ったポーズ',text:'',skel:P,created:Date.now()};S.parts.push(p);await saveNow('parts',p);}
    if(pc){pc.pose=p.id;await saveNow('scenes',sc);picUseRecent(p.id);}
    closeSheet();if(onDone)onDone(p);else render(true);toast(part?'ポーズを直しました':'ポーズを登録しました');
  };
}

/* ========== 起動 ========== */
(async()=>{
  history.replaceState({n:1},'');
  /* オフラインで動かす仕組み（https か localhost のときだけ使える） */
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    /* 新しい版が入ったら、1回だけ自動で読み込み直す（はじめて入れたときは読み込み直さない） */
    const had=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloaded)return;reloaded=true;try{sessionStorage.setItem('updated','1');}catch(_){}location.reload();});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});}).catch(()=>{});
    try{if(sessionStorage.getItem('updated')){sessionStorage.removeItem('updated');setTimeout(()=>toast('新しい版になりました'),600);}}catch(_){}
  }
  try{db=await openDB();await loadAll();if(S.meta.pin){delete S.meta.pin;delete S.meta.lockAfter;dbPut('meta',S.meta);}/* v14 のパスワードは使わなくなった */await loadStamps().catch(()=>{});await loadFonts().catch(()=>{});}
  catch(e){db=null;view.innerHTML='<div class="banner">このブラウザではデータを保存できません（プライベートモードなど）。閉じると内容が消えます。</div>';}
  render();
  if(db&&navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(v=>{if(!v)navigator.storage.persist().catch(()=>{});}).catch(()=>{});
})();
</script>
