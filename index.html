<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<!-- 3Dで深度ポーズを作る画面（pose3d.js）で使う three.js。版を変えるときは sw.js の THREE_LIB も合わせる -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1e2127" media="(prefers-color-scheme: dark)">
<title>投稿</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  投稿（4コマ漫画づくりのアプリ）
  ・部品（人物・服装・ポーズ表情・背景・画風・LoRA）を登録し、組み合わせてシーン（1コマ）を作る
  ・シーンから PixAI 用のプロンプトを組み立ててコピーする
  ・シーンを4つ選んで起承転結の作品にする
  ・データはこの端末のブラウザの中（IndexedDB）だけに保存。外部のサービスは使わない
  ・設定の「バックアップを書き出す」で、全データを1つのファイルにして保存できる
  ・スマホとPCで使うときは、書き出したファイルを相手の端末で「読み込む（合わせる）」。
    同じものは直した日時の新しい方を残し、消したものは S.meta.deleted（id と消した日時）で相手にも伝える
-->
<style>
:root{
  --ink:#1f2328; --sub:#646b75; --line:#e2e4e8; --bg:#f5f6f8; --card:#fff;
  --line2:#d3d6db; --line3:#b5bac2; --soft:#f0f1f4; --outer:#e6e8eb;
  --acc:#4c5fd5; --acc-d:#3a4bb8; --acc-l:#eef0fd; --warn:#d6453d;
  --r0:#e8590c; --r1:#2f9e44; --r2:#d6336c; --r3:#1c7ed6;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--outer);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:640px;margin:0 auto;background:var(--bg);min-height:100vh;min-height:100dvh}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;height:52px;padding:0 12px}
header h1{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#back{border:0;background:none;color:var(--acc);padding:8px 8px 8px 0;font-weight:600;white-space:nowrap}
main{padding:14px 16px calc(150px + env(safe-area-inset-bottom))}
nav#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav#tabs button{flex:1;border:0;background:none;padding:7px 0 8px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px}
nav#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav#tabs button.on{color:var(--acc);font-weight:700}
.fab{position:fixed;z-index:15;bottom:calc(70px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 304px));border:0;background:var(--acc);color:#fff;font-weight:700;padding:13px 20px;border-radius:999px;box-shadow:0 4px 14px rgba(40,50,120,.28)}
.fab:active{background:var(--acc-d)}

/* 部品 */
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.sec>h2{font-size:14px;margin:0 0 10px;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px;row-gap:0}
.sec>h2 small{font-weight:400;color:var(--sub);font-size:12px}
/* 部品の派生 */
.vrow{border-left:3px solid var(--line);padding:4px 0 4px 8px;margin:0 0 8px}
.vrow textarea{margin-top:4px;width:100%}
.vpick{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0 0;padding:6px 8px;border-radius:8px;border:1px dashed var(--c,var(--line))}
.vpick small{color:var(--sub);margin-right:2px;font-size:12px}
.vp{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;color:inherit;cursor:pointer}
.vp.on{background:var(--c,#888);border-color:var(--c,#888);color:#fff}
.tg .vn{font-size:10px;opacity:.7}
.pvar{color:var(--sub)}
.tg.wt.off{text-decoration:line-through;opacity:.5}
.lkrow{display:grid;grid-template-columns:1fr 1fr auto auto;gap:4px;padding:6px 0 6px 8px;border-left:3px solid var(--line);margin:0 0 6px}
.lkrow select{min-width:0}
.lkrow [data-lkp],.lkrow [data-lkt]{grid-column:1/-1}
.lkh{margin:-4px 0 6px}
.pastebox{border:2px dashed var(--acc);border-radius:10px;padding:14px 10px;margin:8px 0;min-height:48px;text-align:center;color:var(--sub);font-size:13px;outline:none;background:var(--card)}
.pastebox:empty::before{content:'ここを長押しして「貼り付け」を選びます（PC は Ctrl＋V）'}
/* 画像に合わせて OpenPose を作る */
.opt{position:fixed;inset:0;z-index:55;background:var(--bg);animation:opUp .26s ease-out}
.optin{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;max-width:640px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.optstage svg{width:100%;height:100%;max-height:none}
.optop{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-left:auto}
.optop input{width:110px}
.optimgs{display:flex;gap:6px;overflow-x:auto;margin:0 0 4px;padding-bottom:4px}
.optimgs button{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;padding:0;background:var(--soft);width:64px;height:64px;overflow:hidden;cursor:pointer}
.optimgs img{width:100%;height:100%;object-fit:cover;display:block}
.optimgs button{position:relative;font-size:22px}
.optimgs button small{position:absolute;left:0;right:0;bottom:0;font-size:9px;line-height:1.5;background:rgba(0,0,0,.6);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.optsticky{position:sticky;top:0;z-index:3;background:var(--bg);padding:env(safe-area-inset-top) 0 2px;margin:0 -2px}
/* 正方形の画面（スマホの高さに合わせて、下の欄が見える大きさに） */
.optstage{aspect-ratio:1/1;width:min(100%,50dvh);max-height:none;margin:0 auto}
.optbar{display:flex;align-items:center;gap:6px;overflow-x:auto;margin:6px 0 4px;padding-bottom:2px}
.optbar .ico{flex:0 0 auto;width:48px;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;font-size:18px}
.optbar .ico.txt{font-size:13px;font-weight:700}
.optbar .tgs{flex-wrap:nowrap;margin:0}
.optbar .tg{flex:0 0 auto;min-height:48px}
.optsep{flex:0 0 1px;height:28px;background:var(--line);margin:0 2px}
.optpane{padding:8px 0 4px}
.optpane:not([hidden]){animation:opFade .22s ease-out}
.opthd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0;min-height:52px}
.opthd b{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 下の手順ボタン（片手で押せるように画面の下） */
.opnav{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:640px;display:flex;gap:6px;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:6}
.opnav button{flex:1;min-width:0;min-height:56px;border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--sub);font-size:11.5px;font-weight:700;line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s}
.opnav button b{font-size:17px}
.opnav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.opsec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.opsec>h3{font-size:14px;margin:0 0 8px}.opsec>h3 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
.opt .btn,.opt .btn.sm{min-height:48px}
.opt .tg{min-height:48px}
.opt .ptabs button{min-height:48px}
.opt .switch{padding:8px 0;min-height:48px}
.opt input[type=range]{min-height:40px}
.opdepth .tg{flex:1 1 30%}
.opcus{display:flex;align-items:flex-end;gap:8px;margin:8px 0 0}
.opcus label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--sub);flex:1;min-width:0}
.opcus input{min-height:48px;font-size:16px;width:100%;box-sizing:border-box}
.opcus>b{align-self:center;padding-top:16px}
.oplab2{font-size:12px;color:var(--sub);font-weight:700;margin:10px 0 4px}
.opdep{display:flex;gap:10px;align-items:flex-start}
.optstage{position:relative}.optstage .opl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}.optstage .opl[hidden]{display:none}.optstage #optSvg{position:relative}
.opdep img{width:120px;flex:0 0 120px;border-radius:8px;background:#000;display:block;min-height:60px}
@keyframes opUp{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes opFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.opt,.optpane:not([hidden]){animation:none}.opnav button{transition:none}}
.switch.sm span{font-size:13px}
.obody{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:4px 0 6px}
.obh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px}
.obsex{margin:0}
.obsex button{padding:4px 14px}
.obrow{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 2px}
.obrow span{flex:0 0 5.6em}
.obrow input{flex:1;min-width:0}
.obrow b{flex:0 0 2.6em;text-align:right;font-weight:600;font-size:12px}
/* 顔の向きのパッド・左右対称のボタン（指で押しやすい大きさ） */
.opmir{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 8px}
.opmir button{min-height:48px;font-size:13px;line-height:1.3;border-radius:10px;border:1px solid var(--line2);border-left:6px solid var(--c);background:var(--card);color:var(--ink);padding:6px 8px;text-align:left}
.opmir button:active{background:var(--soft)}
.opface{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.opface .ofh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px}
.opface .ofh b{font-size:14px}.opface .ofs{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft)}
.opface .ofs.lk{background:#e7f6ec;color:#167a3b}.opface .ofs.ul{background:#fff3df;color:#9a5b00}
.opface label.ofr{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 8px}.opface label.ofr span{flex:0 0 6.5em}.opface label.ofr input{flex:1;min-width:0}
.opface .btn{min-height:48px}
.opface ol{margin:6px 0 0;padding-left:1.3em;font-size:12px;color:var(--sub);line-height:1.6}
.optbar .ico.undo{font-weight:700;position:relative}.optbar .ico.undo:disabled{opacity:.35}
.optbar .ico.undo i{position:absolute;right:2px;top:0;font-size:10px;font-style:normal;color:var(--acc)}
.opsc{display:flex;gap:10px;align-items:flex-start;margin:4px 0 0}
.opsc img{width:150px;border-radius:8px;background:#000;display:block}
.optpart{border:1px solid var(--line);border-left:4px solid #0f766e;border-radius:10px;padding:8px 10px;margin:10px 0}
.optsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.optchk{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
.optchk>b{display:block;font-size:13px;margin-bottom:4px}
.oc{font-size:13px;line-height:1.5;padding:4px 0;border-top:1px dashed var(--line)}
.oc.warn{color:var(--warn)}
.oc.ok{color:#15803d}
.optips ul{margin:0;padding-left:1.2em;font-size:13px;line-height:1.6}
.pool{border:1px dashed var(--line3,var(--line));border-radius:10px;padding:8px 10px;margin:0 0 8px}
.poolh{font-size:13px;font-weight:700;margin:0 0 8px}
.poolto{display:grid;grid-template-columns:1fr 1fr auto;gap:4px}
.poolto select{min-width:0}
.poolh small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px}
.simg{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.simh,.simr{display:grid;grid-template-columns:34px 34px 1fr;gap:4px;align-items:center}
.simh{font-size:11px;color:var(--sub);text-align:center}
.simr{padding:5px 0;border-top:1px dashed var(--line)}
.simr input{justify-self:center;width:18px;height:18px}
.simr small{display:block;color:var(--sub);font-size:11px;word-break:break-all}
/* シーンの画面：欄をたたむ（見出しを押す）。たたんだ欄は、選んでいるものを見出しの下に小さく出す */
.sec>h2.fh,.slot>.sh.fh{cursor:pointer;-webkit-user-select:none;user-select:none;position:relative;padding-right:24px}
.sec>h2.fh::after,.slot>.sh.fh::after{content:'';position:absolute;right:6px;top:5px;width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);transition:transform .15s}
.slot>.sh.fh{padding-right:0;padding-left:18px;flex-wrap:wrap}
.slot>.sh.fh::after{top:50%;margin-top:-6px;right:auto;left:2px}
.sec.fold>h2.fh::after,.slot.fold>.sh.fh::after{transform:rotate(-45deg)}
.sec.fold>*:not(h2){display:none}
.sec.fold>h2{margin:0}
.slot.fold>*:not(.sh){display:none}
.slot.fold>.sh{margin-bottom:0}
.fsum{display:block;flex-basis:100%;font-size:12px;font-weight:400;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foldall{display:flex;justify-content:flex-end;gap:6px;margin:0 0 8px}
/* プロンプトの見出しのコピー（たたんでいるときだけ出す。開いているときは中のコピーを使う） */
.sec.prompt>h2 .pcp{display:inline-flex;gap:6px;margin-left:auto}
.sec.prompt:not(.fold)>h2 .pcp{display:none}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}
.tgs{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;min-height:34px}
.tg.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.tg.new{border-style:dashed;color:var(--acc)}
.pbox mark{border-radius:4px;padding:0 2px;font-weight:700}
.pbox mark.up{background:#ffe3c2;color:#8a3d00}
.pbox mark.dn{background:#dbe7ff;color:#1d3f8a}
.tg.wt.up{border-color:#f0b070;background:#fff1e0;color:#8a3d00}
.tg.wt.dn{border-color:#9db8ef;background:#eaf1ff;color:#1d3f8a}
.tg.wt b{font-size:11px}
.tg.wt.sel{outline:2px solid var(--ink);outline-offset:1px}
.wedit{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.wtop code{background:var(--soft);border-radius:6px;padding:2px 8px;font-size:13px;overflow-wrap:anywhere}
.wrow{display:flex;align-items:center;gap:10px}
.wrow input[type=range]{flex:1;padding:0;border:0;accent-color:var(--acc);height:32px}
.wscale{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin:0 50px 8px}
.ptabs{display:flex;gap:6px;margin-bottom:10px}
.ptabs button{flex:1;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:6px 0;display:flex;align-items:center;justify-content:center;gap:4px;opacity:.55}
.ptabs button.on{opacity:1;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.ptabs small{font-size:11px;color:var(--sub)}
.cwrap{width:100%;margin:0 auto 10px;border-radius:8px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.15);background:var(--card)}
.cwrap canvas{display:block;width:100%;height:100%;touch-action:none}
.cwrap{max-width:calc(62vh * var(--arn))}
/* 吹き出しを選んでいる間：上に見本を貼りつけ、下の操作をタブで切り替える（1画面で完結） */
body.editing nav#tabs{display:none}
body.editing main{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
body.editing .noedit{display:none}
body.editing .cstick{position:sticky;top:52px;z-index:6;background:var(--bg);margin:-14px -16px 8px;padding:8px 16px 6px;box-shadow:0 6px 8px -8px rgba(0,0,0,.25)}
body.editing .cstick .ptabs{display:none}
body.editing .cwrap{max-width:calc(44dvh * var(--arn));margin-bottom:0}
body.editing .cwrap{max-height:44dvh}
#bText{scroll-margin-bottom:12px}
@media (max-height:600px){body.editing .cwrap{max-width:calc(36dvh * var(--arn))}}
.ebar{display:flex;align-items:center;gap:6px;margin:0 0 6px}
.ebar b{flex:1;font-size:14px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ebar .btn.sm{padding:5px 9px}
.etabs{display:flex;margin:0 -14px 12px;border-bottom:1px solid var(--line)}
.etabs button{flex:1;border:0;background:none;padding:9px 0;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.rg{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.rg>span{flex:0 0 8.6em;font-size:12px;color:var(--sub);line-height:1.3}
.rg>span b{color:var(--ink)}
.rg input{flex:1;min-width:0}
.rg .btn.sm{flex:0 0 auto;padding:4px 8px;min-height:30px;font-size:12px}
.rsteps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:-2px 0 12px}
.rsteps .btn.sm{padding:4px 0;min-height:34px;font-size:12px}
.etabs button.on{color:var(--acc);border-color:var(--acc);font-weight:700}
#cctl .sec .f:last-child{margin-bottom:0}
.ctool{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.wedit .btn.ghost.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.onb{background:var(--ink);border-color:var(--ink);color:#fff}
.memo{margin:0;white-space:pre-wrap;font-size:14px}
.cimgs{display:flex;gap:8px;overflow-x:auto}
.cimgs button{flex:0 0 64px;height:64px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--soft)}
.cimgs button.on{border-color:var(--acc)}
.cimgs img{width:100%;height:100%;object-fit:cover;display:block}
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -14px;padding:0 14px 4px;scroll-snap-type:x mandatory}
.strip button{position:relative;flex:0 0 46%;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);scroll-snap-align:start}
.strip canvas{display:block;width:100%;height:auto}
.strip .role{position:absolute;left:6px;top:6px}
.expgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.expgrid div{position:relative;aspect-ratio:800/912;background:var(--soft);border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.expgrid img{width:100%;height:100%;object-fit:contain;display:block}
.expgrid i{font-size:10px;color:var(--sub);font-style:normal}
.expgrid .role{position:absolute;left:3px;top:3px;width:20px;height:20px;font-size:11px;flex-basis:20px}
.setlist{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.setc{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card)}
.setc canvas{flex:0 0 auto;width:88px;height:auto;border-radius:6px}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}

input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:inherit;min-width:0}

input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.hint{display:block;font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}

.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}

/* 重複しているタグの欄（シーンの画面のプロンプトの下） */

/* 作品一覧 */

.rolepick button.on{color:#fff;border-color:transparent}
.rolepick button.on.r0{background:var(--r0)}.rolepick button.on.r1{background:var(--r1)}.rolepick button.on.r2{background:var(--r2)}.rolepick button.on.r3{background:var(--r3)}
.psep{display:block;height:7px}
.pbox{background:var(--soft);border-radius:8px;padding:10px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;white-space:pre-wrap;margin:0;user-select:text;-webkit-user-select:text}

.pcat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.tg.wt{border-left:5px solid var(--c)!important}

.wgl{font-size:12px;font-weight:700;color:color-mix(in srgb,var(--c) 75%,var(--ink));margin-bottom:4px}.wper{--c:#3b82f6}.wwho{font-weight:normal;color:var(--sub,#666);font-size:.8em}

.f.cat .tg.on{background:var(--c);border-color:var(--c)}
.pcat button{border-left:5px solid var(--c)!important;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:72px}
.pcat b{font-size:15px}.pcat .n{margin-left:auto;font-size:13px;color:var(--sub);font-weight:700}

.pitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pitem.hasimg{display:flex;gap:10px;align-items:flex-start}.pitem.hasimg>div{flex:1;min-width:0}

.pimg{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pimg .ph{width:96px;height:96px;flex:0 0 96px;border-radius:10px;border:1px dashed var(--line3);background:var(--soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:11px;text-align:center}

.pitem b{font-size:14px}

/* シート */
#sheet{position:fixed;inset:0;z-index:50;display:none}

details.nh{margin:-4px 0 12px;font-size:14px}

/* ===== ダークモード（スマホの設定が「ダーク」のとき） ===== */

  :root{--ink:#e6e8ec;--sub:#9aa1ab;--line:#2c3038;--bg:#15171b;--card:#1e2127;--line2:#3a3f48;--line3:#5a606b;--soft:#262a31;--outer:#0d0e10;
    --acc:#7b8cf0;--acc-d:#6475e0;--acc-l:#262c4d;--warn:#ff7b72;color-scheme:dark}
  .pbox mark.up,.tg.wt.up{background:#4a2c10;color:#ffc58a;border-color:#7a4a1c}
  .pbox mark.dn,.tg.wt.dn{background:#1c2c4d;color:#a9c4ff;border-color:#33507f}
  .btn.danger{border-color:#6b2f2c}
  .banner{background:#3a3016;border-color:#5c4b1f}
  .dupbox{background:#3a3016;border-color:#5c4b1f}
  .dup{border-color:#5c4b1f}
  .dup .dt code{background:rgba(255,255,255,.1)}
  .banner.info{border-color:#3a4378}
  .pbox.neg{color:#f2a49d;background:#3a1f1d}

  .tg.on,.fab,.btn:not(.ghost):not(.danger){color:#fff}
  #toast{background:#e6e8ec;color:#15171b}

}

<script>
'use strict';
/* ========== 小道具 ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ROLE=['起','承','転','結'];
const view=$('#view');
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2000);}
function fmtDate(t){if(!t)return'';const d=new Date(t);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;}
function ymd(){const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;}

/* 部品の種類 */
const PT={
  chara:{label:'人物',hint:'その人の変わらない特徴（髪・目など）。体つきは「身体の特徴」、服や表情は別の部品にすると使い回しやすい',ph:'black hair, short hair, brown eyes',namePh:'例：ミカ'},
  act:{label:'行動',hint:'その人がしていること（服を持ち上げる など）。ポーズと組み合わせて使います。1人にいくつでも付けられます',ph:'lift up clothes',namePh:'例：服を持ち上げる'},
  phys:{label:'身体の特徴',hint:'体型・身長・肌の色・胸の大きさなど、体のつくり。1人にいくつでも付けられます',ph:'slender, tall, fair skin',namePh:'例：細身'},
  outfit:{label:'服装',hint:'服・小物のタグ',ph:'bikini',namePh:'例：水着（黒）'},
  action:{label:'ポーズ',hint:'ポーズ・動き・視線など',ph:'standing, looking at viewer',namePh:'例：立つ'},
  face:{label:'表情',hint:'表情',ph:'smile',namePh:'例：笑顔'},
  body:{label:'体の状態',hint:'汗・赤面・濡れ・涙など。1人にいくつでも付けられます',ph:'sweat',namePh:'例：汗'},
  inter:{label:'絡み',hint:'ハグ・キス・手をつなぐなど、人物どうしの関わり。シーンにいくつでも付けられます',ph:'hug',namePh:'例：ハグ'},
  bg:{label:'背景',hint:'場所・時間帯・天気など',ph:'beach, blue sky, daytime',namePh:'例：昼のビーチ'},
  np:{label:'ネガポジ',hint:'ネガティブに書いても消えにくいものを、ポジティブ側でおさえる部品です。なくしたいものは no ○○・without ○○、色は white ○○ のように、ほしい形をはっきり書きます。シーンにいくつでも付けられます',ph:'pale skin, no tan',namePh:'例：白い肌'},
  fx:{label:'エフェクト・動き',hint:'動きの線・キラキラ・風・水しぶきなど、絵に足す効果。シーンにいくつでも付けられます',ph:'motion lines',namePh:'例：動きの線'},
  angle:{label:'カメラ位置',hint:'どこから見るか（横から・後ろから・見上げなど）。シーンにいくつでも付けられます',ph:'from side',namePh:'例：横から'},
  camera:{label:'構図',hint:'カメラの距離（全身・上半身・アップなど）やピント',ph:'full body',namePh:'例：全身'},
  light:{label:'光',hint:'光の当たり方・明るさだけ（逆光・薄暗いなど）。場所（暗い部屋・夕方の海など）は「背景」に入れます',ph:'soft lighting',namePh:'例：やわらかい光'},
  openpose:{label:'OpenPose',hint:'OpenPose の棒人形の点と、合わせたときに下に敷いた画像を一緒にしまう部品です。押すと、画像と点がそのまま出て、直したり PNG で保存したりできます。シーンのプロンプトには入りません',ph:'',namePh:'例：向かい合って腕組み'},
  depth:{label:'深度ポーズ',hint:'深度（Depth）のポーズ画像です。画像をコピーして「📋 貼り付け」で追加します。黒い背景は透明として扱います。シーンで人物ごとに選ぶと、カテゴリ・アングル・手足の接地のタグがプロンプトに入り、2人以上を重ねた画像を保存できます',ph:'hand on hip',namePh:'例：片手を腰に立つ'},
  other:{label:'その他',hint:'どの項目にも当てはまらないタグ（持ち物・小物・細かい指定など）。人物ごとにも、シーン全体にも、いくつでも付けられます',ph:'holding umbrella',namePh:'例：傘を持つ'},
  style:{label:'画風',hint:'画質・画風のタグ。タグの形では最後に入ります',ph:'masterpiece, best quality',namePh:'例：いつもの画風'},
  lora:{label:'LoRA',hint:'LoRA を使うときにプロンプトへ足すタグ（なければ空のまま）。LoRA は作られたモデルの系統（SDXL 系・Tsubaki 系）でしか使えません',ph:'トリガーワード',namePh:'例：水彩風'}
};
const PT_ORDER=['chara','phys','outfit','action','depth','act','face','body','inter','bg','angle','camera','light','fx','np','other','style','lora'];
/* プロンプトの形（PixAI 公式ブログの勧めに合わせる） */
const FMT={
  tag:{label:'タグ（SDXL 系：Haruka・Hoshino など）',hint:'人数 → 人物の特徴 → 身体の特徴 → 服 → ポーズ → 行動 → 表情 → 体の状態 → 絡み → 背景 → カメラ位置 → 構図 → 光 → エフェクト・動き → ネガポジ → 画風 の順に、タグを並べます。'},
  prose:{label:'文章（Tsubaki 系）',hint:'人物（2人以上なら人数と絡みを先に）→ 一人ずつの説明 → 背景 → カメラ位置 → 構図 → 光 → エフェクト・動き → ネガポジ → 画風 の順の英語の文章にします。部品に「文章」を書いておくと、タグの代わりにそれを使います。'},
  group:{label:'かっこでまとめる（girl(…) の形）',hint:'人物ごとに girl(…) の形でまとめます（今までの書き方）。'}
};

/* ========== データベース（IndexedDB） ========== */
let db=null;
const APP_VER='v95';/* sw.js の VERSION と同じにする */
const STORES=['parts','scenes','works','images','meta','fonts','stamps'];
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('manga4koma',3);r.onupgradeneeded=()=>{const d=r.result;for(const s of STORES)if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{if(!db)return res(undefined);const t=db.transaction(store,mode);const req=fn(t.objectStore(store));let out;if(req)req.onsuccess=()=>{out=req.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const dbAll=s=>tx(s,'readonly',st=>st.getAll()).then(r=>r||[]);
const dbGet=(s,id)=>tx(s,'readonly',st=>st.get(id));
const dbPut=(s,v)=>tx(s,'readwrite',st=>st.put(v));
const dbDel=(s,id)=>tx(s,'readwrite',st=>st.delete(id));

const S={parts:[],scenes:[],works:[],meta:{id:'settings',loraInPrompt:false,lastBackup:0}};
/* ===== 部品の派生 =====
   部品の中に、少し違う形（派生）を入れられる。p.vars=[{id,name,tags}]（text・neg・skel・memo もあれば使う）。
   シーンでは「部品のid~派生のid」で選ぶ。派生のタグは、基本のタグの代わりに使う（ネガティブ・見本の画像などは基本のもの）。
   派生がなくなったときは、基本の部品として扱う */
const VSEP='~';
const vBase=id=>String(id||'').split(VSEP)[0];
function varPart(id){const[b,v]=String(id).split(VSEP);const p=S.parts.find(x=>x.id===b);if(!p)return undefined;const vr=(p.vars||[]).find(x=>x.id===v);if(!vr)return p;
  return Object.assign({},p,{id,name:(p.name||'名前なし')+'・'+(vr.name||'派生'),tags:vr.tags||'',text:vr.text||'',neg:vr.neg!=null?vr.neg:p.neg,skel:vr.skel||p.skel,vars:undefined,_base:p.id,_vname:vr.name||''});}
const byId=(k,id)=>!id?undefined:(k==='parts'&&String(id).includes(VSEP))?varPart(id):S[k].find(x=>x.id===id);
/* シーンの中の部品の選び方を、まとめて付けかえる。fn(id) が返した id にする（'' なら外す）。
   snaps が true なら、画像に記録した設定も付けかえる。変わったら true を返す */
function mapSceneIds(s,fn,snaps){
  const one=v=>v?(fn(v)||''):v;
  const arr=a=>{const o=[];for(const x of A_(a)){const n=one(x);if(n&&!o.includes(n))o.push(n);}return o;};
  const fix=s=>{for(const c of s.chars||[]){for(const f of['chara','face'])if(c[f])c[f]=one(c[f]);for(const f of['outfit','action','body','phys','act','other'])if(c[f]!=null&&A_(c[f]).length)c[f]=arr(c[f]);if(c.pic&&c.pic.pose)c.pic.pose=fn(c.pic.pose)||'stand';}
    if(s.dpose&&Array.isArray(s.dpose.L))for(const e of s.dpose.L)if(e&&e.id)e.id=one(e.id);
    for(const f of['bg','style','camera','light','openpose'])if(s[f])s[f]=one(s[f]);for(const f of['inter','angle','fx','np','other'])if(Array.isArray(s[f]))s[f]=arr(s[f]);
    if(Array.isArray(s.loras)){const seen=new Set();s.loras=s.loras.map(l=>Object.assign({},l,{id:one(l.id)})).filter(l=>{if(!l.id||seen.has(l.id))return false;seen.add(l.id);return true;});}};
  const before=JSON.stringify(s);fix(s);if(snaps)for(const m of Object.values(s.imgMeta||{}))if(m&&m.snap)fix(m.snap);return JSON.stringify(s)!==before;}
async function loadAll(){
  S.parts=await dbAll('parts');S.scenes=await dbAll('scenes');S.works=await dbAll('works');
  S.meta=Object.assign({id:'settings',loraInPrompt:false,lastBackup:0},await dbGet('meta','settings')||{});
  await seedAngles();await seedCams();await seedFx();await seedNp();await fixNp();await seedAct();
}
/* カメラ位置のよく使う部品を、最初の1回だけ入れておく（消しても、もう一度は入らない） */
const ANGLE_PRESETS=[
  ['正面','straight-on','真正面から'],
  ['斜め前から','three-quarter view','顔と体が少し斜めを向いて見える'],

/* 反対の意味のタグ。左と右が同じシーン（かっこでまとめる形では同じ人物）にあると知らせる。
   組を足すときは [[左のタグ…],[右のタグ…]] を1行足す */
const OPP=[
  [['head in frame'],['head out of frame']],
  [['standing'],['sitting','sitting on chair','kneeling','lying','squatting']],
  [['from above','high angle'],['from below','low angle']],
  [['looking at viewer'],['looking away','looking at another']],
  [['day','daytime','daylight','sunlight'],['night','moonlight']],
  [['indoors'],['outdoors']],
  [['dim lighting','low light','dark room'],['sunlight','daylight']],
  [['close-up','portrait'],['full body','cowboy shot','wide shot','upper body']],
  [['full body'],['cowboy shot','upper body']],
  [['open mouth'],['closed mouth']],
  [['flat color'],['gradient']],
  [['muted color','muted colors','low saturation','desaturated'],['vibrant colors','vivid colors','saturated']],
  [['low contrast'],['high contrast']],
  [['shiny skin','shiny hair','glossy'],['matte']]

/* ===== 同じ内容の部品 =====
   スマホとPCで合わせたときなど、同じ部品が2つできることがある。名前・タグなどが同じものを1つにまとめる。
   シーンで使っているほうを残し、消すほうを選んでいるシーン（画像の記録も）は、残すほうに付けかえる */
function partSig(p){const n=x=>splitTags(x).map(norm).join(',');return JSON.stringify([p.type,(p.name||'').trim(),n(p.tags),n(p.neg),(p.text||'').trim(),p.type==='chara'?(p.subject||'').trim():'',p.loraName||'',p.type==='lora'?String(p.weight??''):'',p.skel?JSON.stringify(p.skel):'',JSON.stringify(p.vars||[])]);}
function dupParts(type){const m=new Map();for(const p of S.parts){if(p.img||(type&&p.type!==type))continue;const k=partSig(p);if(!m.has(k))m.set(k,[]);m.get(k).push(p);}return[...m.values()].filter(g=>g.length>1);}
async function mergeDupParts(type){
  const map={};
  for(const g of dupParts(type)){g.sort((a,b)=>partUsage(b.id)-partUsage(a.id)||(a.created||0)-(b.created||0));for(const x of g.slice(1))map[x.id]=g[0].id;}
  const R=id=>{const b=vBase(id);return map[b]?map[b]+String(id).slice(b.length):id;},RA=a=>[...new Set(A_(a).map(R))];
  const fix=s=>{for(const c of s.chars||[]){for(const f of['chara','face'])if(c[f])c[f]=R(c[f]);for(const f of['outfit','action','body','phys','act','other'])if(c[f]!=null)c[f]=Array.isArray(c[f])?RA(c[f]):R(c[f]);if(c.pic&&c.pic.pose)c.pic.pose=R(c.pic.pose);}
    for(const f of['bg','style','camera','light','openpose'])if(s[f])s[f]=R(s[f]);for(const f of['inter','angle','fx','np','other'])if(Array.isArray(s[f]))s[f]=RA(s[f]);
    if(Array.isArray(s.loras)){const seen=new Set();s.loras=s.loras.map(l=>Object.assign({},l,{id:R(l.id)})).filter(l=>{if(seen.has(l.id))return false;seen.add(l.id);return true;});}};
  for(const s of S.scenes){const before=JSON.stringify(s);fix(s);for(const m of Object.values(s.imgMeta||{}))if(m&&m.snap)fix(m.snap);if(JSON.stringify(s)!==before)await saveNow('scenes',s);}
  for(const id in map){S.parts=S.parts.filter(p=>p.id!==id);await dbDel('parts',id);markDeleted(id);}
  return Object.keys(map).length;
}
const mergeBanner=type=>{const n=dupParts(type).length;return n?`<div class="banner info">同じ内容の部品が ${n} 組あります（スマホとPCで合わせたときなどにできます）。<div class="row" style="margin:6px 0 0"><button class="btn sm" id="mergeDup">1つにまとめる</button></div></div>`:'';};
const mergeWire=type=>{const b=$('#mergeDup');if(b)b.onclick=async()=>{if(!confirm('同じ内容の部品を1つにまとめます。シーンで使っているほうを残し、もう一方を消します。シーンの選び方は、残すほうに付けかえます。よろしいですか？'))return;const n=await mergeDupParts(type);toast(`${n} 件の部品をまとめました`);render(true);};};
function stemOf(k){return k.split(' ').map(w=>w.length<4||/ss$/.test(w)?w:/ies$/.test(w)?w.slice(0,-3)+'y':/(x|ch|sh)es$/.test(w)?w.slice(0,-2):/s$/.test(w)?w.slice(0,-1):w).join(' ');}
function dupScan(sc){
  const fmt=S.meta.fmt||'tag',ch=sc.dups||{},prose=fmt==='prose';
  const lab=id=>{const p=P_(id);return p?`${(PT[p.type]||{}).label||''}「${p.name||'名前なし'}」`:'';};
  const src=[];
  const addIds=(ids,rm,scope,pre)=>{for(const id of ids)if(id)for(const t of T_(id))if(!rm.has(norm(t)))src.push({t,label:pre+lab(id),scope});};
  const addT=(tags,label,rm,scope)=>{for(const t of tags)if(!rm.has(norm(t)))src.push({t,label,scope});};
  for(const l of sc.loras||[])addIds([l.id],new Set(),'g','');
  const multi=(sc.chars||[]).length>1,PIC=picTags(sc),OPA=opAutoScene(sc);
  (sc.chars||[]).forEach((sl,i)=>{const rm=new Set(splitTags(sl.remove).map(norm)),scope=fmt==='group'?'s'+i:'g',pre=multi?`人物${i+1}の`:'';
    addIds([sl.chara,...(sl.phys||[]),...A_(sl.outfit),...A_(sl.action),...(sl.act||[]),sl.face,...(sl.body||[]),...(sl.other||[])],rm,scope,pre);addT(splitTags(sl.add),pre+'足すタグ',rm,scope);addT(PIC.per[i]||[],pre+'向き・位置',rm,scope);addT(OPA.per[i]||[],pre+'深度ポーズ（自動）',rm,scope);});
  const srm=new Set(splitTags(sc.remove).map(norm));
  addIds([...(sc.inter||[]),sc.bg,...(sc.angle||[]),sc.camera,sc.light,...(sc.fx||[]),...(sc.np||[]),...(sc.other||[]),sc.style],srm,'g','');
  addT(splitTags(sc.add),'足すタグ（人物以外）',srm,'g');addT(PIC.scene,'向き・位置',srm,'g');addT(OPA.scene,'深度ポーズ（自動）',srm,'g');
  const nsrc=[];const negOf=(id,suf)=>{const p=P_(id);if(p)for(const t of splitTags(p.neg))nsrc.push({t,label:lab(id)+suf});};
  if(sc.style)negOf(sc.style,'のネガティブ');for(const id of sc.np||[])negOf(id,'のネガティブ');for(const t of splitTags(sc.neg))nsrc.push({t,label:'ネガティブに足すタグ'});
  const wt=t=>{const w=parseTag(t).w;return w!=null?`（${w}）`:'';};
  const list=[],keepPos=new Set(),keepNeg=new Set(),simDel=new Set(),posDrop=new Set(),negDrop=new Set();
  const item=(kind,id,o)=>{const c=ch[id]||'';list.push(Object.assign({kind,id,choice:c||DUP_DEF[kind],decided:!!c},o));return c||DUP_DEF[kind];};
  if(!prose){
    const by=new Map();for(const x of src){const k=norm(x.t),g=x.scope+'|'+k;if(!by.has(g))by.set(g,{k,scope:x.scope,base:baseOf(x.t),items:[]});by.get(g).items.push(x);}
    const done=new Set();
    for(const g of by.values())if(g.items.length>1&&!done.has(g.k)){done.add(g.k);if(item('same','p:'+g.k,{base:g.base,n:g.items.length,srcs:g.items.map(x=>x.label+wt(x.t))})==='keep')keepPos.add(g.k);}
    const st=new Map();for(const g of by.values()){const sk=g.scope+'|'+stemOf(g.k);if(!st.has(sk))st.set(sk,{stem:stemOf(g.k),gs:[]});st.get(sk).gs.push(g);}
    const done2=new Set();
    for(const x of st.values())if(x.gs.length>1&&!done2.has(x.stem)){done2.add(x.stem);if(item('sim','s:'+x.stem,{bases:x.gs.map(g=>g.base),srcs:x.gs.map(g=>`${g.base}：${g.items[0].label}`)})==='del')simDel.add(x.stem);}
    /* 反対の意味のタグ（同じ scope の中で） */
    const done4=new Set();
    for(const[A,B]of OPP){const inA=new Set(A),inB=new Set(B);
      for(const g of by.values()){if(!inA.has(g.k))continue;
        for(const h of by.values()){if(h.scope!==g.scope||!inB.has(h.k))continue;const id='o:'+g.k+'|'+h.k;if(done4.has(id))continue;done4.add(id);
          const c=item('opp',id,{a:g.base,b:h.base,srcs:[`${g.base}：${g.items[0].label}`,`${h.base}：${h.items[0].label}`]});if(c==='a')posDrop.add(g.k);if(c==='b')posDrop.add(h.k);}}}
    const posK=new Map();for(const x of src){const k=norm(x.t);if(!posK.has(k))posK.set(k,x);}
    const done3=new Set();
    for(const y of nsrc){const k=norm(y.t);if(!posK.has(k)||done3.has(k))continue;done3.add(k);const c=item('conf','c:'+k,{base:baseOf(y.t),srcs:['ポジ：'+posK.get(k).label,'ネガ：'+y.label]});if(c==='pos')posDrop.add(k);if(c==='neg')negDrop.add(k);}
  }
  const nb=new Map();for(const y of nsrc){const k=norm(y.t);if(!nb.has(k))nb.set(k,{base:baseOf(y.t),items:[]});nb.get(k).items.push(y);}
  for(const[k,g]of nb)if(g.items.length>1&&item('nsame','n:'+k,{base:g.base,n:g.items.length,srcs:g.items.map(y=>y.label+wt(y.t))})==='keep')keepNeg.add(k);
  return{list,keepPos,
    /* ポジティブのタグを通すか（似たタグの後のほう・ポジから消すタグを落とす）。並びの順に1回ずつ呼ぶ */
    pf:()=>{const first=new Map();return t=>{const k=norm(t);if(posDrop.has(k))return false;const s=stemOf(k);if(simDel.has(s)){if(!first.has(s))first.set(s,k);else if(first.get(s)!==k)return false;}return true;};},
    neg:arr=>{const seen=new Set();return arr.filter(t=>{const k=norm(t);if(negDrop.has(k))return false;if(seen.has(k)&&!keepNeg.has(k))return false;seen.add(k);return true;});}};
}
function buildPrompt(sc){
  const D=dupScan(sc);KEEP=(S.meta.fmt||'tag')==='prose'?null:D.keepPos;
  try{const r=buildPrompt0(sc,D);r.dups=D.list;return r;}finally{KEEP=null;}

function buildPrompt0(sc,D){
  const fmt=S.meta.fmt||'tag';
  const slots=(sc.chars||[]).map(sl=>slotInfo(sl));
  const srm=splitTags(sc.remove);
  /* ピクトグラムで決めた向き・位置のタグ */
  const OPA=opAutoScene(sc);
  const PIC=picTags(sc);slots.forEach((s,i)=>s.pic=uniq(PIC.per[i]||[],[...s.rm,...s.feat,...s.phys,...s.out,...s.pose,...s.act,...s.face,...s.body,...s.other,...s.add]));slots.forEach((s,i)=>s.opa=uniq(OPA.per[i]||[],[...s.rm,...s.feat,...s.phys,...s.out,...s.pose,...s.act,...s.face,...s.body,...s.other,...s.add,...s.pic]));const picS=uniq(PIC.scene,srm);
  const inter=uniq((sc.inter||[]).flatMap(T_),srm),bg=uniq(T_(sc.bg),srm),ang=uniq((sc.angle||[]).flatMap(T_),srm),cam=uniq(T_(sc.camera),srm),lit=uniq(T_(sc.light),srm),fx=uniq((sc.fx||[]).flatMap(T_),srm),npP=uniq((sc.np||[]).flatMap(T_),srm),add=uniq(splitTags(sc.add),srm),oth=uniq((sc.other||[]).flatMap(T_),srm),opT=uniq([...OPA.scene],srm),style=uniq(T_(sc.style),srm);

    trig.push(...splitTags(p.tags));
  }
  const loraTxt=S.meta.loraInPrompt?loras.map(l=>`<lora:${l.name}:${l.weight===''?1:l.weight}>`):[];
  let pos;
  /* タグを { t:タグ, si:人物の番号（人物以外は null）, cat:項目 } にして並べる。

  const multi=slots.length>1;
  const I=(arr,cat,si)=>arr.map(t=>({t,cat,si:multi?si:null,p:si}));
  const slotItems=(s,i)=>[...I(s.feat,'chara',i),...I(s.phys,'phys',i),...I(s.out,'outfit',i),...I(s.pose,'action',i),...I(s.act,'act',i),...I(s.face,'face',i),...I(s.body,'body',i),...I(s.other,'other',i),...I(s.add,'add',i),...I(s.pic,'pic',i),...I(s.opa,'depth',i)];
  const restItems=()=>[...I(inter,'inter'),...I(picS,'pic'),...I(bg,'bg'),...I(ang,'angle'),...I(opT,'depth'),...I(add,'add'),...I(oth,'other'),...I(cam,'camera'),...I(lit,'light'),...I(fx,'fx'),...I(npP,'np'),...I(style,'style')];

  const uniqI=arr=>{const seen=new Set();return arr.filter(x=>{const k=norm(x.t);if(seen.has(k)&&!(KEEP&&KEEP.has(k)))return false;seen.add(k);return true;});};

      const bd=(s.sl.body||[]).map(id=>TX_(id)||uniq(T_(id),s.rm).join(', ')).filter(Boolean).join(', ');if(bd)d.push(bd);if(s.other.length)d.push(s.other.join(', '));if(s.add.length)d.push(s.add.join(', '));if(s.pic.length)d.push(s.pic.join(', '));if(s.opa.length)d.push(s.opa.join(', '));return d;};

    }
    const it=(sc.inter||[]).map(id=>TX_(id)).filter(Boolean),itTags=(sc.inter||[]).filter(id=>!TX_(id)).flatMap(id=>uniq(T_(id),srm));

    if(picS.length)S2.push(sent(picS.join(', ')));
    if(slots.length>1)slots.forEach((s,i)=>S2.push(sent([`The ${ORD[i]||(i+1)+'th'} is ${head(s)}`,...details(s)].join(', '))));
    const bgt=TX_(sc.bg)||bg.join(', ');if(bgt)S2.push(sent(TX_(sc.bg)?bgt:'Background: '+bgt));

    if(oth.length)S2.push(sent(oth.join(', ')));
    if(opT.length)S2.push(sent(opT.join(', ')));
    const at=(sc.angle||[]).map(id=>TX_(id)).filter(Boolean),atTags=(sc.angle||[]).filter(id=>!TX_(id)).flatMap(id=>uniq(T_(id),srm).map(baseOf));
    for(const x of at)S2.push(sent(x));if(atTags.length)S2.push(sent('Viewed '+uniq(atTags).join(', ')));
    const ct=TX_(sc.camera)||cam.join(', ');if(ct)S2.push(sent(TX_(sc.camera)?ct:'Framing: '+ct));

function usedIn(sceneId){const r=[];for(const w of S.works)(w.panels||[]).forEach((p,i)=>{if(p===sceneId)r.push({w,i});});return r;}
function partUsage(pid){const e=x=>!!x&&(x===pid||(!pid.includes(VSEP)&&vBase(x)===pid)),h=a=>A_(a).some(e);
  return S.scenes.filter(s=>e(s.bg)||e(s.style)||e(s.camera)||e(s.light)||e(s.openpose)||((s.dpose&&s.dpose.L)||[]).some(x=>x&&e(x.id))||h(s.inter)||h(s.angle)||h(s.fx)||h(s.np)||h(s.other)||(s.chars||[]).some(c=>e(c.chara)||h(c.outfit)||h(c.action)||(c.pic&&e(c.pic.pose))||e(c.face)||h(c.body)||h(c.phys)||h(c.act)||h(c.other))||(s.loras||[]).some(l=>e(l.id))).length;}
/* 服装・ポーズは、前は1つだけ（文字）、今はいくつでも（配列）。どちらでも読めるようにする */
const A_=v=>Array.isArray(v)?v:(v?[v]:[]);
const newSlot=()=>({chara:'',phys:[],outfit:[],action:[],act:[],face:'',body:[],other:[],add:'',remove:''});
/* ===== 絡みと一緒に選ぶ部品 =====
   絡みの部品に p.links=[{w, f, id}] を入れる。w は 0＝シーン全体、1・2・3＝人物の番号。f は項目（action など）、id は部品（派生は 部品id~派生id）。
   シーンで絡みを選ぶと、ここにある部品も選ぶ（1つだけ選ぶ項目は、ほかのものが選ばれていれば変えない）。
   絡みを外すときは、一緒に選んだ部品も外すか聞く（ほかの絡みでも使う部品は外さない） */
const LK_PER=['chara','phys','outfit','action','act','face','body','other','add','subj'],LK_SCN=['openpose','angle','camera','light','bg','fx','np','other','style','add','neg'];
/* シーンから取り込むときは、すべての設定（光・背景・画風・足すタグ・ネガティブに足すタグも）を入れる。いらない行は ✕ で外す */
const LK_ONE=['chara','face','camera','bg','light','style','openpose'],LK_TX=['add','subj','neg'];
const lkLab=(f,w)=>f==='add'?(w?'足すタグ':'足すタグ（人物以外）'):f==='subj'?'呼び方':f==='neg'?'ネガティブに足すタグ':(PT[f]||{}).label||f;
const lkName=l=>{const who=l.w?'人物'+l.w+'の':'';if(LK_TX.includes(l.f))return `${who}${lkLab(l.f,l.w)}「${l.tx||''}」`;const p=P_(l.id);return `${who}${lkLab(l.f,l.w)}「${p?p.name||'名前なし':'（削除された部品）'}」`;};
const lkObj=(sc,l)=>l.w?(sc.chars||[])[l.w-1]:sc;
const lkOk=l=>LK_TX.includes(l.f)?!!(l.tx||'').trim():!!P_(l.id);
function lkHas(sc,l){const o=lkObj(sc,l);if(!o)return false;
  if(l.f==='add'||l.f==='neg'){const have=new Set(splitTags(o[l.f]).map(norm));return splitTags(l.tx).every(t=>have.has(norm(t)));}
  if(l.f==='subj')return(o.subj||'').trim()===(l.tx||'').trim();
  return LK_ONE.includes(l.f)?o[l.f]===l.id:A_(o[l.f]).includes(l.id);}
/* 絡みを選んだとき：登録した設定を当てる。1つだけ選ぶ項目と呼び方は置きかえ、いくつでも選ぶ項目と足すタグは足す */
function applyLinks(sc,interId){const p=P_(interId);const L=(p&&p.links)||[];let add=0,slots=0;const rep=[];sc.chars=sc.chars||[];
  for(const l of L){if(!lkOk(l))continue;
    if(l.w)while(sc.chars.length<l.w){sc.chars.push(newSlot());slots++;}
    const o=lkObj(sc,l);if(lkHas(sc,l))continue;
    if(l.f==='add'||l.f==='neg'){o[l.f]=uniq([...splitTags(o[l.f]),...splitTags(l.tx)]).join(', ');add++;}
    else if(l.f==='subj'){o.subj=(l.tx||'').trim();add++;}
    else if(LK_ONE.includes(l.f)){if(o[l.f])rep.push(lkName(l));o[l.f]=l.id;add++;}
    else{const a=A_(o[l.f]);o[l.f]=[...a.filter(x=>vBase(x)!==vBase(l.id)),l.id];add++;}}
  return{add,slots,skip:[],rep};}
function unlinkList(sc,interId){const p=P_(interId);const key=l=>l.w+'|'+l.f+'|'+(l.id||l.tx||'');
  const keep=new Set((sc.inter||[]).filter(x=>x!==interId).flatMap(x=>(P_(x)&&P_(x).links)||[]).map(key));
  return((p&&p.links)||[]).filter(l=>!keep.has(key(l))&&lkHas(sc,l));}
function removeLinks(sc,L){for(const l of L){const o=lkObj(sc,l);if(!o)continue;
  if(l.f==='add'||l.f==='neg'){const rm=new Set(splitTags(l.tx).map(norm));o[l.f]=splitTags(o[l.f]).filter(t=>!rm.has(norm(t))).join(', ');}
  else if(l.f==='subj'){if((o.subj||'').trim()===(l.tx||'').trim())o.subj='';}
  else if(LK_ONE.includes(l.f)){if(o[l.f]===l.id)o[l.f]='';}else o[l.f]=A_(o[l.f]).filter(x=>x!==l.id);}}
/* シーンの設定（光・背景・画風・絡み・LoRA を除く）を、絡みに登録する形にする */
function linksFromScene(sc,selfId,withInter){const L=[];
  (sc.chars||[]).forEach((c,i)=>{const w=i+1;if(c.chara)L.push({w,f:'chara',id:c.chara});for(const f of['phys','outfit','action','act'])for(const id of A_(c[f]))L.push({w,f,id});if(c.face)L.push({w,f:'face',id:c.face});for(const id of A_(c.body))L.push({w,f:'body',id});for(const id of A_(c.other))L.push({w,f:'other',id});
    if((c.add||'').trim())L.push({w,f:'add',tx:c.add.trim()});if((c.subj||'').trim())L.push({w,f:'subj',tx:c.subj.trim()});});
  for(const id of sc.angle||[])L.push({w:0,f:'angle',id});for(const f of['openpose','camera','light','bg'])if(sc[f])L.push({w:0,f,id:sc[f]});for(const f of['fx','np','other'])for(const id of sc[f]||[])L.push({w:0,f,id});if(sc.style)L.push({w:0,f:'style',id:sc.style});
  for(const f of['add','neg'])if((sc[f]||'').trim())L.push({w:0,f,tx:sc[f].trim()});
  try{const P=picTags(sc);(P.per||[]).forEach((a,i)=>{if(a&&a.length)L.push({w:i+1,f:'add',tx:a.join(', ')});});if(P.scene&&P.scene.length)L.push({w:0,f:'add',tx:P.scene.join(', ')});}catch(_){}
  /* シーンで選んでいる絡み（いま直している絡みは除く）のタグ。部品の画面で、タグに分けて振り分ける */
  if(withInter)for(const id of sc.inter||[]){if(vBase(id)===selfId)continue;const ip=P_(id);if(ip&&(ip.tags||'').trim())L.push({w:0,f:'itag',tx:ip.tags.trim(),src:id});}
  return L;}
function newScene(){const s={id:uid(),title:'',roles:[],chars:[newSlot()],inter:[],angle:[],fx:[],np:[],other:[],bg:'',camera:'',light:'',style:defaultStyle(),loras:[],add:'',remove:'',neg:'',memo:'',images:[],created:Date.now(),updated:Date.now()};S.scenes.push(s);return s;}

/* 部品の種類ごとの色（シーンの欄と部品の一覧で同じ色を使う） */
const CATC={add:'#9ca3af',pic:'#0d9488',act:'#f43f5e',chara:'#3b82f6',phys:'#0ea5a4',outfit:'#8b5cf6',action:'#f97316',face:'#ec4899',body:'#ef4444',inter:'#d946ef',bg:'#22a34a',angle:'#6366f1',camera:'#0891b2',light:'#eab308',fx:'#84cc16',np:'#64748b',other:'#78716c',openpose:'#0f766e',depth:'#334155',style:'#a16207',lora:'#475569'};
/* 長押し：0.5秒押し続けたら fn を呼ぶ。そのあとの「押した」はなかったことにする */
function longPress(el,fn){let t=0,x=0,y=0,fired=false;
  const stop=()=>{clearTimeout(t);t=0;};
  el.addEventListener('pointerdown',e=>{fired=false;x=e.clientX;y=e.clientY;stop();t=setTimeout(()=>{fired=true;t=0;if(navigator.vibrate)try{navigator.vibrate(15);}catch(_){}fn();},500);});
  el.addEventListener('pointermove',e=>{if(t&&Math.hypot(e.clientX-x,e.clientY-y)>10)stop();});
  ['pointerup','pointercancel','pointerleave'].forEach(k=>el.addEventListener(k,stop));
  el.addEventListener('click',e=>{if(fired){fired=false;e.stopImmediatePropagation();e.preventDefault();}},true);

/* 画像ごとに、そのときのプロンプトの設定を記録する */
const SNAP_KEYS=['chars','inter','angle','fx','np','other','openpose','opAuto','bg','camera','light','style','loras','add','remove','neg','weights','dups','pic'];
const snapDef=k=>(k==='chars'||k==='inter'||k==='angle'||k==='fx'||k==='np'||k==='other'||k==='loras')?[]:(k==='weights'||k==='dups')?{}:k==='pic'?null:'';
const snapVal=(o,k)=>JSON.parse(JSON.stringify(o[k]??snapDef(k)));
function recordSnap(sc,id){sc.imgMeta=sc.imgMeta||{};const snap={};for(const k of SNAP_KEYS)snap[k]=snapVal(sc,k);const p=buildPrompt(sc);sc.imgMeta[id]={snap,pos:p.pos,neg:p.neg,loras:p.loras,fmt:p.fmt,at:Date.now()};}
function snapSame(sc,snap){return SNAP_KEYS.every(k=>JSON.stringify(snapVal(sc,k))===JSON.stringify(snapVal(snap,k)));}
function snapSummary(snap){
  const nm=id=>{const p=byId('parts',id);return p?esc(p.name||'名前なし'):(id?'<span class="gone">（削除された部品）</span>':'');};
  const rows=[];
  (snap.chars||[]).forEach((c,i)=>{const b=[nm(c.chara),...(c.phys||[]).map(nm),...A_(c.outfit).map(nm),...A_(c.action).map(nm),...(c.act||[]).map(nm),nm(c.face),...(c.body||[]).map(nm),...(c.other||[]).map(nm)].filter(Boolean).join('・');rows.push(`<tr><th>人物 ${i+1}</th><td>${b||'—'}${c.subj?`<br><small>呼び方：${esc(c.subj)}</small>`:''}${c.add?`<br><small>足す：${esc(c.add)}</small>`:''}${c.remove?`<br><small>外す：${esc(c.remove)}</small>`:''}</td></tr>`);});
  if((snap.inter||[]).length)rows.push(`<tr><th>絡み</th><td>${snap.inter.map(nm).join('・')}</td></tr>`);
  if((snap.angle||[]).length)rows.push(`<tr><th>カメラ位置</th><td>${snap.angle.map(nm).join('・')}</td></tr>`);
  if((snap.fx||[]).length)rows.push(`<tr><th>エフェクト</th><td>${snap.fx.map(nm).join('・')}</td></tr>`);
  if((snap.np||[]).length)rows.push(`<tr><th>ネガポジ</th><td>${snap.np.map(nm).join('・')}</td></tr>`);
  if((snap.other||[]).length)rows.push(`<tr><th>その他</th><td>${snap.other.map(nm).join('・')}</td></tr>`);
  const rest=[['OpenPose',snap.openpose],['背景',snap.bg],['構図',snap.camera],['光',snap.light],['画風',snap.style]].filter(x=>x[1]).map(([l,id])=>`<tr><th>${l}</th><td>${nm(id)}</td></tr>`);
  rows.push(...rest);
  if((snap.loras||[]).length)rows.push(`<tr><th>LoRA</th><td>${snap.loras.map(l=>nm(l.id)+(l.weight!==''&&l.weight!=null?`（${esc(l.weight)}）`:'')).join('・')}</td></tr>`);
  const w=Object.entries(snap.weights||{});if(w.length)rows.push(`<tr><th>重み</th><td>${w.map(([k,v])=>{const m=/^(\d+)\|(.*)$/.exec(k);return `${m?`人物${m[1]}の`+esc(m[2]):esc(k)} ${v}`;}).join('、')}</td></tr>`);
  return `<table class="snapt">${rows.join('')}</table>`;
}

  const cv=$('#iCover');if(cv)cv.onclick=()=>{sc.images.splice(k,1);sc.images.unshift(id);saveNow('scenes',sc);closeSheet();render(true);};
  $('#iSave').onclick=async()=>{const r=await dbGet('images',id);if(!r)return;const a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download=r.name||('image-'+id+'.png');document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);};
  $('#iDel').onclick=async()=>{if(!confirm('この画像をシーンから外しますか？'))return;sc.images.splice(k,1);if(sc.imgMeta)delete sc.imgMeta[id];await saveNow('scenes',sc);await deleteImageIfUnused(id);closeSheet();render(true);};
}

/* ========== 吹き出しと仕上げ（ブラウザの Canvas で描く） ========== */
/* 書き出しの大きさ（PixAI の 800×912 に合わせたものが最初） */
const EXP_SIZES={'1600x1824':[1600,1824],'800x912':[800,912],'1536':[1536,2048],'1080':[1080,1440]};
const EXP_LABEL={'1600x1824':'1600×1824（800×912 の2倍・おすすめ）','800x912':'800×912（PixAI の絵と同じ）','1536':'1536×2048（横3：縦4）','1080':'1080×1440（横3：縦4・軽い）'};
const BTYPES=[['round','丸'],['shout','叫び'],['think','心の声'],['box','四角'],['none','文字だけ']];
const FONT='"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif';
/* 取り込んだ字体（スマホの中に保存し、FontFace で読み込む。ネットにはつながない） */
let FONTS=[];
const fontFam=id=>'uf_'+id;
async function loadFonts(){
  FONTS=(await dbAll('fonts')).sort((a,b)=>(a.created||0)-(b.created||0));
  for(const f of FONTS){if(f.loaded)continue;try{const ff=new FontFace(fontFam(f.id),await f.blob.arrayBuffer());await ff.load();document.fonts.add(ff);f.loaded=true;}catch(e){f.broken=true;}}
}
/* 吹き出しの字体の並び：選んだ字体 → 日本語の予備の字体 → スマホの字体 */
function fontStack(b){
  const ids=[b&&b.font,S.meta.jpFont].filter((x,k,a)=>x&&a.indexOf(x)===k&&FONTS.some(f=>f.id===x&&f.loaded));
  return [...ids.map(id=>`"${fontFam(id)}"`),FONT].join(',');

/* 取り込んだ字体は太字にしない（字の形がくずれるため）。スマホの字体のときだけ太字 */
const fontWeight=b=>{const id=(b&&b.font)||S.meta.jpFont;return id&&FONTS.some(f=>f.id===id&&f.loaded)?'normal':'bold';};
async function addFont(file){
  if(!/\.(ttf|otf|woff2?)$/i.test(file.name))throw new Error('type');
  const id=uid();const blob=new Blob([file],{type:file.type||'font/ttf'});
  const ff=new FontFace(fontFam(id),await blob.arrayBuffer());await ff.load();document.fonts.add(ff);
  const rec={id,name:file.name.replace(/\.(ttf|otf|woff2?)$/i,''),file:file.name,blob,size:blob.size,created:Date.now()};
  await dbPut('fonts',rec);rec.loaded=true;FONTS.push(rec);return rec;
}
/* ========== セリフ画像（文字を書いた画像を取り込み、吹き出しの代わりにコマへ置く） ==========
   スマホの中（stamps）に保存。コマに置いたものは type:'img' の吹き出しとして扱う */
let STAMPS=[];const stampImg={},stampCv={},stampUrl={};let stampRedraw=null;
async function loadStamps(){STAMPS=(await dbAll('stamps')).sort((a,b)=>(a.created||0)-(b.created||0));}
function loadStamp(id){if(!id)return Promise.resolve(null);if(stampImg[id])return stampImg[id].p;
  const o={im:null};const rec=STAMPS.find(x=>x.id===id);
  o.p=(rec?Promise.resolve(rec):dbGet('stamps',id)).then(r=>new Promise(res=>{if(!r||!r.blob)return res(null);const im=new Image();im.onload=()=>{o.im=im;res(im);};im.onerror=()=>res(null);im.src=URL.createObjectURL(r.blob);})).catch(()=>null);

async function addStamp(file,white){
  if(!/^image\//.test(file.type||'')&&!/\.(png|jpe?g|webp|gif|bmp)$/i.test(file.name||''))throw new Error('type');

  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u;}).finally(()=>URL.revokeObjectURL(u));
  const sc=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));

    const box=$('#cctl');const b=cSel!=null?comp.bubbles[cSel]:null;
    document.body.classList.toggle('editing',!!b);if(!b)document.body.classList.remove('typing');
    /* 上の帯：何番目か・前後の吹き出し・よく使う操作 */
    const n=comp.bubbles.length;
    const bar=b?`<div class="ebar"><button class="btn ghost sm" id="bPrev" ${n<2?'disabled':''} aria-label="前の吹き出し">‹</button><b>${cSel+1}／${n}</b><button class="btn ghost sm" id="bNext" ${n<2?'disabled':''} aria-label="次の吹き出し">›</button><button class="btn ghost sm" id="bDup">複製</button><button class="btn danger sm" id="bDel">削除</button><button class="btn sm" id="bDone">完了</button></div>`:'';
    const tabs=list=>{if(!list.some(([k])=>k===ctlTab))ctlTab=list[0][0];return `<div class="etabs">${list.map(([k,l])=>`<button type="button" class="${k===ctlTab?'on':''}" data-et="${k}">${l}</button>`).join('')}</div>`;};

    const aRow=(id,k,label)=>{const v=Math.round(al(b[k])*100);return `<div class="rg"><span>${label}<br><b id="${id}v">${v}%</b></span><input type="range" id="${id}" data-alpha="${k}" min="0" max="100" step="1" value="${v}" aria-label="${label}"><button type="button" class="btn ghost sm" data-rs="${id}">戻す</button></div>`;};
    const more=`<div class="row" style="margin:4px 0 0"><button class="btn ghost sm" id="bSet">セットに登録</button><button class="btn ghost sm" id="bFront">いちばん前へ</button></div>`;
    const common=()=>{
      $$('[data-et]',box).forEach(x=>x.onclick=()=>{ctlTab=x.dataset.et;ctl();});
      $$('[data-ck]',box).forEach(x=>{const k=x.dataset.ck;
        if(x.tagName==='INPUT'){x.oninput=e=>{b[k]=e.target.value;save('works',w);redraw();};x.onchange=()=>{draw();ctl();};}
        else x.onclick=()=>{b[k]=x.dataset.cv;save('works',w);draw();ctl();};});
      const on=(id,f)=>{const el=$('#'+id);if(el)el.onclick=f;};
      const owr=$('#bOw');if(owr)owr.oninput=e=>{b.ow=+e.target.value;$('#bOwv').textContent=b.ow.toFixed(1);save('works',w);redraw();};
      /* 濃さ（透明度） */
      $$('[data-alpha]',box).forEach(el=>{const k=el.dataset.alpha;el.oninput=e=>{b[k]=+e.target.value/100;$('#'+el.id+'v').textContent=e.target.value+'%';save('works',w);redraw();};
        const rs=$(`[data-rs="${el.id}"]`);if(rs)rs.onclick=()=>{el.value=100;b[k]=1;$('#'+el.id+'v').textContent='100%';save('works',w);redraw();};});
      $$('[data-cs]',box).forEach(x=>x.onclick=()=>{colSub=x.dataset.cs;ctl();});
      const go2=d=>{cSel=(cSel+d+n)%n;draw();ctl();};
      on('bPrev',()=>go2(-1));on('bNext',()=>go2(1));
      on('bSet',()=>$('#fromSet').click());
      on('bDup',()=>{const c=JSON.parse(JSON.stringify(b));c.id=uid();c.x=Math.min(1,c.x+0.05);c.y=Math.min(1,c.y+0.05);c.tx+=0.05;c.ty+=0.05;comp.bubbles.push(c);cSel=comp.bubbles.length-1;save('works',w);draw();ctl();});
      on('bFront',()=>{comp.bubbles.splice(cSel,1);comp.bubbles.push(b);cSel=comp.bubbles.length-1;save('works',w);draw();ctl();});
      on('bDel',()=>{comp.bubbles.splice(cSel,1);cSel=null;save('works',w);draw();ctl();});

    };
    const rng=(id,label,v,min,max,step,shown,reset)=>`<div class="rg"><span>${label}<br><b id="${id}v">${shown}</b></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}" aria-label="${label}">${reset!=null?`<button type="button" class="btn ghost sm" data-rs="${id}" data-rv="${reset}">戻す</button>`:''}</div>`;
    /* スライダーをつなぐ：k=値の名前、f=表示の形 */
    const bindR=(id,set,show)=>{const el=$('#'+id);if(!el)return;const apply=v=>{set(v);$('#'+id+'v').textContent=show(v);save('works',w);redraw();};el.oninput=e=>apply(+e.target.value);
      const rs=$(`[data-rs="${id}"]`);if(rs)rs.onclick=()=>{el.value=rs.dataset.rv;apply(+rs.dataset.rv);};};
    const pct=v=>Math.round(v*100)+'%',dg=v=>Math.round(v)+'°';
    if(b&&b.type==='img'){
      const r=STAMPS.find(x=>x.id===b.stamp);
      const T=tabs([['size','大きさ・傾き'],['color','色・外枠']]);
      const body=ctlTab==='size'?`${rng('bSz','大きさ',Math.round((b.sz||.16)*100),3,90,1,Math.round((b.sz||.16)*100))}
        ${rng('bRot','傾き',b.rot||0,-180,180,1,(b.rot||0)+'°',0)}
        <div class="row" style="margin:4px 0 0"><button class="btn ghost sm" id="bSwap">ほかの画像に替える</button><button class="btn ghost sm" id="bSet">セットに登録</button><button class="btn ghost sm" id="bFront">いちばん前へ</button></div>
        <p class="hint" style="margin:8px 0 0">${esc(r?r.name:'画像が見つかりません')}</p>`
        :`${colorRow('色（文字の部分を塗りかえる）','color',b.color,'元の色')}${colorRow('外枠の色','oc',b.oc,'なし')}${owRow(b.oc)}${aRow('bIa','ia','画像の濃さ')}`;
      box.innerHTML=`<div class="sec">${bar}${T}${body}</div>`;
      const sz=$('#bSz');if(sz)sz.oninput=e=>{b.sz=+e.target.value/100;$('#bSzv').textContent=e.target.value;save('works',w);redraw();};
      bindR('bRot',v=>b.rot=v,dg);
      const sw=$('#bSwap');if(sw)sw.onclick=()=>{stampPickReplace=true;openStamps(placeStamp);};
      common();
    }else if(b){
      const T=tabs([['text','文字'],['color','色'],['shape','形'],['size','大きさ'],['rot','角度']]);
      let body='';
      if(ctlTab==='text')body=`<label class="f"><textarea id="bText" rows="2" placeholder="セリフ（改行で行を分けられます）">${esc(b.text)}</textarea></label>
        <div class="f"><span>書き方</span><div class="tgs"><button type="button" class="tg ${b.vertical?'on':''}" data-bv="1">縦書き</button><button type="button" class="tg ${b.vertical?'':'on'}" data-bv="0">横書き</button></div></div>
        ${b.vertical?`<div class="f"><span>縦書きの行の並び（改行したとき）</span><div class="tgs"><button type="button" class="tg ${b.vdir!=='rtl'?'on':''}" data-vd="">左から</button><button type="button" class="tg ${b.vdir==='rtl'?'on':''}" data-vd="rtl">右から</button></div></div>`:''}
        <div class="f"><span>字体</span><div class="tgs"><button type="button" class="tg ${!b.font?'on':''}" data-bf="">いつもの字体（${esc((FONTS.find(f=>f.id===S.meta.jpFont&&f.loaded)||{name:'スマホの字体'}).name)}）</button>${FONTS.filter(f=>f.loaded&&f.id!==S.meta.jpFont).map(f=>`<button type="button" class="tg ${b.font===f.id?'on':''}" data-bf="${f.id}" style="font-family:'${fontFam(f.id)}',${FONT}">${esc(f.name)}</button>`).join('')}</div>${FONTS.length?'<span class="hint">「いつもの字体」は「保存・設定」で変えられます。変えると、ここで「いつもの字体」にしている吹き出しは全部変わります。</span>':'<span class="hint">字体は「保存・設定」の「字体」で取り込めます。<button type="button" class="linkb" id="bFontHelp">入れ方を見る</button></span>'}</div>`;
      else if(ctlTab==='color'){
        const subs=[['text','文字'],['outline','文字の外枠'],...(b.type!=='none'?[['bubble','吹き出し']]:[])];if(!subs.some(([k])=>k===colSub))colSub='text';
        body=`<div class="tgs" style="margin-bottom:10px">${subs.map(([k,l])=>`<button type="button" class="tg ${colSub===k?'on':''}" data-cs="${k}">${l}</button>`).join('')}</div>`+
        (colSub==='text'?`${colorRow('文字の色','color',b.color||'#111111')}${aRow('bCa','ca','文字の濃さ')}`
        :colSub==='outline'?`${colorRow('文字の外枠の色','oc',textOC(b),'なし')}${owRow(textOC(b))}${textOC(b)?aRow('bOa','oa','外枠の濃さ'):''}`
        :`${colorRow('中の色','bg',b.bg===undefined?'#ffffff':b.bg,'透明')}${(b.bg===undefined||b.bg)?aRow('bBga','bga','中の濃さ'):''}${colorRow('線の色','lc',b.lc||'#111111')}${aRow('bLa','la','線の濃さ')}`)+
        `<p class="hint" style="margin:4px 0 0">濃さを下げると、うしろの絵が透けて見えます。</p>`;}
      else if(ctlTab==='shape')body=`<div class="f"><div class="tgs">${BTYPES.map(([k,l])=>`<button type="button" class="tg ${b.type===k?'on':''}" data-bt="${k}">${l}</button>`).join('')}</div></div>
        ${b.type!=='none'?`<div class="f"><span>輪郭の線</span><div class="tgs"><button type="button" class="tg ${b.line!=='brush'?'on':''}" data-bl="pen">ふつう</button><button type="button" class="tg ${b.line==='brush'?'on':''}" data-bl="brush">筆</button></div></div>
        ${rng('bLw','線の太さ',b.lw||1,0.4,3,0.1,(b.lw||1).toFixed(1))}`:''}
        ${b.type!=='box'&&b.type!=='none'?`<label class="switch" style="margin-bottom:8px"><input type="checkbox" id="bTail" ${b.tail?'checked':''}><span>しっぽを付ける<span class="hint">見本の青い丸を動かすと、しっぽの向きが変わります</span></span></label>`:''}${more}`;
      else if(ctlTab==='rot'){const steps=k=>`<div class="rsteps">${[-45,-30,-15,15,30,45].map(d=>`<button type="button" class="btn ghost sm" data-rk="${k}" data-rd="${d}">${d>0?'+':'−'}${Math.abs(d)}°</button>`).join('')}</div>`;
        body=`${b.type!=='none'?rng('bBrot','吹き出しの角度',b.brot||0,-180,180,1,dg(b.brot||0),0)+steps('brot'):''}${rng('bTrot','文字の角度',b.trot||0,-180,180,1,dg(b.trot||0),0)}${steps('trot')}
        <p class="hint" style="margin:6px 0 0">ボタンは、今の角度から足したり引いたりします。吹き出しと文字は、別々に回せます。${b.type!=='none'?'しっぽの先は、回しても今の場所のままです。':''}</p>`;}
      else body=`${b.type!=='none'?rng('bBsx','吹き出しの横幅',b.bsx||1,0.5,2.5,0.05,pct(b.bsx||1),1)+rng('bBsy','吹き出しの高さ',b.bsy||1,0.5,2.5,0.05,pct(b.bsy||1),1):''}
        ${rng('bFs','文字の大きさ',Math.round(b.fs*1000),18,70,1,Math.round(b.fs*1000))}${rng('bWrap','1行の文字数',b.wrap||0,0,20,1,b.wrap?b.wrap:'自動')}${rng('bCsp','文字の間',b.csp||0,-0.3,1,0.05,(b.csp||0).toFixed(2),0)}${rng('bLsp','行間',b.lsp==null?1:b.lsp,0,3,0.1,(b.lsp==null?1:b.lsp).toFixed(1),1)}
        <p class="hint" style="margin:4px 0 0">1行の文字数を「自動」（いちばん左）にすると、改行したところでだけ行が分かれ、吹き出しが文字に合わせて広がります。文字の間は、となりの字とのすき間（0がふつう）。行間は、改行したときの行と行のあいだ（1.0がふつう）です。</p>`;
      box.innerHTML=`<div class="sec">${bar}${T}${body}</div>`;
      const ta=$('#bText');if(ta){ta.oninput=e=>{b.text=e.target.value;save('works',w);redraw();};
        /* キーボードが出たら、入力欄が見本の下に隠れないように画面の下へ寄せる */
        const show=()=>{if(document.activeElement===ta)ta.scrollIntoView({block:'end',behavior:'smooth'});};
        ta.onfocus=()=>setTimeout(show,350);if(window.visualViewport&&!window._kbHook){window._kbHook=1;visualViewport.addEventListener('resize',()=>{const t=$('#bText');if(t&&document.activeElement===t)setTimeout(()=>t.scrollIntoView({block:'end'}),50);});}}
      $$('[data-bt]',box).forEach(x=>x.onclick=()=>{b.type=x.dataset.bt;save('works',w);draw();ctl();});
      $$('[data-vd]',box).forEach(x=>x.onclick=()=>{b.vdir=x.dataset.vd;save('works',w);draw();ctl();});
      $$('[data-bv]',box).forEach(x=>x.onclick=()=>{b.vertical=x.dataset.bv==='1';save('works',w);draw();ctl();});
      const bfh=$('#bFontHelp');if(bfh)bfh.onclick=openFontHelp;
      $$('[data-bf]',box).forEach(x=>x.onclick=()=>{b.font=x.dataset.bf;S.meta.lastFont=b.font;dbPut('meta',S.meta);save('works',w);draw();ctl();});
      $$('[data-bl]',box).forEach(x=>x.onclick=()=>{b.line=x.dataset.bl;S.meta.lastLine=b.line;dbPut('meta',S.meta);save('works',w);draw();ctl();});
      bindR('bLw',v=>{b.lw=v;S.meta.lastLw=v;},v=>v.toFixed(1));
      bindR('bFs',v=>b.fs=v/1000,v=>v);
      bindR('bBsx',v=>b.bsx=v,pct);bindR('bBsy',v=>b.bsy=v,pct);
      bindR('bBrot',v=>b.brot=v,dg);bindR('bTrot',v=>b.trot=v,dg);
      $$('[data-rk]',box).forEach(x=>x.onclick=()=>{const k=x.dataset.rk,id=k==='brot'?'bBrot':'bTrot';let v=(b[k]||0)+ +x.dataset.rd;if(v>180)v-=360;if(v<-180)v+=360;b[k]=v;$('#'+id).value=v;$('#'+id+'v').textContent=dg(v);save('works',w);redraw();});
      bindR('bCsp',v=>b.csp=v,v=>v.toFixed(2));bindR('bLsp',v=>b.lsp=v,v=>v.toFixed(1));bindR('bWrap',v=>b.wrap=v,v=>v?v:'自動');
      const bt=$('#bTail');if(bt)bt.onchange=e=>{b.tail=e.target.checked;save('works',w);draw();};
      common();
    }else{
      const imgs=sc?(sc.images||[]):[];const curI=compImg(w,i);
      box.innerHTML=`<div class="sec"><h2>絵</h2>
      ${!sc?'<div class="banner">このコマにはシーンが入っていません。作品の画面で、シーンを選んでください。</div>':!imgs.length?'<div class="banner">このコマのシーンには、画像がありません。シーンの画面で画像を追加してください。</div>':''}
      ${imgs.length>1?`<div class="f"><span>使う画像</span><div class="cimgs">${imgs.map(id=>`<button class="${id===curI?'on':''}" data-cimg="${id}"><img data-img="${id}" alt=""></button>`).join('')}</div></div>`:''}
      <label class="f"><span>拡大 <b id="zv">${(comp.zoom||1).toFixed(2)}</b></span><input type="range" id="cZoom" min="1" max="3" step="0.01" value="${comp.zoom||1}"></label>
      <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="cFit" ${comp.fit==='contain'?'checked':''}><span>絵の全体を入れる（はみ出さない。余白は白）</span></label>
      <div class="row" style="margin-bottom:0"><button class="btn ghost sm" id="cReset">位置と拡大を元に戻す</button></div>
      <span class="hint">「絵を動かす」を押すと、指で絵の位置を動かせます。絵の形が ${EW}×${EH} と違うときは、はみ出したところが切れます。</span></div>`;
      hydrate(box);
      $$('[data-cimg]',box).forEach(x=>x.onclick=()=>{comp.img=x.dataset.cimg;save('works',w);loadImg(comp.img).then(im=>{img=im;draw();});ctl();});
      $('#cZoom').oninput=e=>{comp.zoom=+e.target.value;$('#zv').textContent=comp.zoom.toFixed(2);save('works',w);redraw();};
      $('#cFit').onchange=e=>{comp.fit=e.target.checked?'contain':'cover';save('works',w);draw();};
      $('#cReset').onclick=()=>{comp.zoom=1;comp.ox=.5;comp.oy=.5;save('works',w);draw();ctl();};
    }
  }
  ctl();
}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},8000);}
async function openExport(w){
  const[EW,EH]=expWH();
  openSheet(`<h2>4枚を書き出す <small class="muted" style="font-size:12px;font-weight:400">1コマ1枚（B）</small></h2>
  <div class="expgrid" id="expG">${ROLE.map((r,i)=>`<div><span class="role r${i}">${r}</span><i>作っています…</i></div>`).join('')}</div>
  <div class="two nar" style="margin:12px 0">
    <label class="f"><span>大きさ</span><select id="exSize">${Object.keys(EXP_SIZES).map(k=>`<option value="${k}"${(EXP_SIZES[S.meta.expSize]?S.meta.expSize:'1600x1824')===k?' selected':''}>${EXP_LABEL[k]}</option>`).join('')}</select></label>
    <label class="f"><span>形式</span><select id="exType"><option value="jpeg"${S.meta.expType!=='png'?' selected':''}>JPEG（おすすめ）</option><option value="png"${S.meta.expType==='png'?' selected':''}>PNG（きれい・重い）</option></select></label>
  </div>
  <div class="row"><button class="btn" id="exShare" disabled>共有（X などへ渡す）</button><button class="btn ghost" id="exSave" disabled>端末に保存（4枚）</button><button class="btn ghost" id="exClose">閉じる</button></div>
  <p class="hint">「共有」を押して X のアプリを選ぶと、4枚が投稿の画面に入ります。並ぶ順番は、投稿する前に X の画面で確かめてください（入れ替えもできます）。<br>「端末に保存」は「ダウンロード」のフォルダに入ります。ブラウザに「複数のファイルのダウンロード」を聞かれたら、許可してください。</p>`);
  let files=[];
  const build=async()=>{
    $('#exShare').disabled=$('#exSave').disabled=true;
    files=[];const g=$('#expG');
    for(let i=0;i<4;i++){const b=await renderFull(w,i);files.push(new File([b],fileName(w,i),{type:b.type}));
      const cell=g&&g.children[i];if(cell){const u=URL.createObjectURL(b);cell.innerHTML=`<span class="role r${i}">${ROLE[i]}</span><img src="${u}" alt="">`;}}
    if(!$('#exShare'))return;
    $('#exShare').disabled=$('#exSave').disabled=false;
    const mb=files.reduce((s,f)=>s+f.size,0)/1048576;
    const miss=[0,1,2,3].filter(i=>!compImg(w,i)).map(i=>ROLE[i]);
    $('#expG').insertAdjacentHTML('afterend',`<p class="hint" id="exInfo">${EW}×${EH}・合わせて約 ${mb.toFixed(1)} MB${miss.length?`<br><b style="color:var(--warn)">画像のないコマがあります：${miss.join('・')}</b>`:''}</p>`);
  };
  $('#exClose').onclick=closeSheet;
  $('#exSize').onchange=e=>{S.meta.expSize=e.target.value;dbPut('meta',S.meta);const x=$('#exInfo');if(x)x.remove();build();};
  $('#exType').onchange=e=>{S.meta.expType=e.target.value;dbPut('meta',S.meta);const x=$('#exInfo');if(x)x.remove();build();};
  $('#exSave').onclick=async()=>{for(const f of files){downloadBlob(f,f.name);await new Promise(r=>setTimeout(r,400));}toast('4枚を保存しました');};
  $('#exShare').onclick=async()=>{
    if(!(navigator.canShare&&navigator.canShare({files}))){toast('このブラウザでは共有できません。「端末に保存」を使ってください');return;}
    try{await navigator.share({files});}catch(e){if(e&&e.name!=='AbortError')toast('共有できませんでした');}
  };
  build();
}

/* ===== 似ている部品を派生にまとめる =====
   同じ種類の部品で、タグがもう一方に全部入っているもの・名前とタグが近いものを組にする。
   組の中でタグが少ないものを「基本」の候補にし、ほかを派生の候補にする（基本は画面で選びなおせる）。

function simGroups(type){
  if(type==='lora'||type==='chara'||type==='openpose'||type==='depth')return[];
  const nm=p=>(p.name||'').replace(/[（(].*?[)）]/g,'').trim();
  const ps=S.parts.filter(p=>p.type===type).map(p=>({p,t:new Set(splitTags(p.tags).map(norm)),n:nm(p)})).filter(x=>x.t.size);
  ps.sort((a,b)=>a.t.size-b.t.size||(a.p.name||'').length-(b.p.name||'').length);
  const sim=(a,b)=>{let i=0;for(const x of a.t)if(b.t.has(x))i++;const j=i/(a.t.size+b.t.size-i);
    if(i===a.t.size||i===b.t.size)return 1+j;if(a.n.length>=2&&b.n.length>=2&&(a.n.includes(b.n)||b.n.includes(a.n))&&j>=.25)return .9+j;return j>=.6?j:0;};
  const role=new Map(),G=new Map();
  ps.forEach((x,xi)=>{if((x.p.vars||[]).length||x.p.skel||x.p.img)return;let best=null,bs=0;
    ps.forEach((b,bi)=>{if(b===x||bi>xi||role.get(b.p.id)==='m')return;const s=sim(b,x);if(s>bs){bs=s;best=b;}});
    if(best){role.set(best.p.id,'b');role.set(x.p.id,'m');if(!G.has(best.p.id))G.set(best.p.id,[best.p]);G.get(best.p.id).push(x.p);}});
  return[...G.values()];}

async function mergeAsVars(baseId,memIds){
  const b=S.parts.find(x=>x.id===baseId);if(!b)return 0;b.vars=b.vars||[];const map={};
  for(const id of memIds){const m=S.parts.find(x=>x.id===id);if(!m||m===b||(m.vars||[]).length)continue;
    const v={id:'v'+uid(),name:varNameOf(b,m),tags:m.tags||''};if(m.text)v.text=m.text;if((m.neg||'')!==(b.neg||''))v.neg=m.neg||'';if(m.skel)v.skel=m.skel;if(m.memo)v.memo=m.memo;
    b.vars.push(v);map[m.id]=b.id+VSEP+v.id;}

async function netTranslate(t){const u='https://api.mymemory.translated.net/get?langpair=ja|en&q='+encodeURIComponent(t);

    $$('[data-split]',box).forEach(b=>b.onclick=()=>{const g=r.groups.find(x=>x.cat===b.dataset.split);cut(g.tags);const o=splits.find(x=>x.cat===g.cat);if(o)o.tags.push(...g.tags);else splits.push({cat:g.cat,tags:[...g.tags]});drawRole();});
    const rc=$('[data-rmcount]',box);if(rc)rc.onclick=()=>{cut(r.count);drawRole();};
  };
  $('#pTags').addEventListener('input',drawRole);drawRole();
  /* 分けた部品を、元の部品を使っているシーンに付ける */
  const attach=async(oldId,n)=>{let add=0,skip=0;const S1=['bg','style','camera','light'],SA=['inter','angle','fx','np'];
    for(const s of S.scenes){
      const scn=S1.some(f=>s[f]===oldId)||SA.some(f=>(s[f]||[]).includes(oldId))||(s.loras||[]).some(l=>l.id===oldId);
      const sl=(s.chars||[]).filter(c=>['chara','face'].some(f=>c[f]===oldId)||['outfit','action'].some(f=>A_(c[f]).includes(oldId))||['body','phys','act'].some(f=>(c[f]||[]).includes(oldId)));
      if(!scn&&!sl.length)continue;let ch=false;
      if(S1.includes(n.type)){if(!s[n.type]){s[n.type]=n.id;ch=true;}else skip++;}
      else if(SA.includes(n.type)){s[n.type]=[...(s[n.type]||[]),n.id];ch=true;}
      else if(n.type==='action'){if(sl.length){for(const c of sl)c.action=[...A_(c.action),n.id];ch=true;}else skip++;}
      if(ch){add++;await saveNow('scenes',s);}}
    return{add,skip};};
  $('#pCancel').onclick=closeSheet;
  $('#pSave').onclick=async()=>{const made=await poolMake();read(p);const i=S.parts.findIndex(x=>x.id===p.id);if(i>=0)S.parts[i]=p;else S.parts.push(p);await saveNow('parts',p);
    const msg=[];if(made.length)msg.push(`部品「${made.join('」「')}」を作りました`);
    /* 消した派生を選んでいたシーンは、基本の部品にする */
    const gone=new Set(((src&&src.vars)||[]).filter(v=>!(p.vars||[]).some(x=>x.id===v.id)).map(v=>p.id+VSEP+v.id));
    if(gone.size)for(const s of S.scenes)if(mapSceneIds(s,id=>gone.has(id)?p.id:id,false))await saveNow('scenes',s);
    for(const x of splits){const n={id:uid(),type:x.cat,name:`${p.name||'部品'}の${PT[x.cat].label}`,tags:x.tags.join(', '),subject:'',weight:'',loraName:'',neg:'',memo:`「${p.name||''}」から分けた部品`,text:'',created:Date.now()};S.parts.push(n);await saveNow('parts',n);
      const r=src?await attach(p.id,n):{add:0,skip:0};msg.push(`${PT[x.cat].label}の部品「${n.name}」を作りました`+(r.add?`（${r.add} 件のシーンに付けました）`:'')+(r.skip?`。${r.skip} 件のシーンは、${PT[x.cat].label}がすでに選ばれているので、そのままです`:''));}
    closeSheet();onSave&&onSave(p);toast(msg.length?msg.join('。'):'保存しました');};
  const dp=$('#pDup');if(dp)dp.onclick=async()=>{const n=read(Object.assign(JSON.parse(JSON.stringify(Object.assign({},p,{img:null}))),{img:p.img||null}));n.id=uid();n.name+='（コピー）';S.parts.push(n);await saveNow('parts',n);closeSheet();setTimeout(()=>openPart(n.id,null,onSave),30);};
  const dl=$('#pDel');if(dl)dl.onclick=async()=>{if(!confirm(used?`この部品は ${used} 件のシーンで使っています。削除すると、そのシーンからも外れます。削除しますか？`:'この部品を削除しますか？'))return;
    /* 絡みを消すときは、使っているシーンで一緒に選んだ部品も外すか聞く */
    if(p.type==='inter'&&src&&(src.links||[]).length){const hit=S.scenes.map(s=>[s,(s.inter||[]).filter(x=>vBase(x)===p.id).flatMap(x=>unlinkList(s,x))]).filter(x=>x[1].length);
      if(hit.length&&confirm(`この絡みを使っている ${hit.length} 件のシーンで、この絡みで呼び出した設定も外しますか？\n\n${[...new Set(hit.flatMap(x=>x[1].map(lkName)))].join('\n')}\n\n「キャンセル」なら、絡みだけを外します。`))for(const[s,L]of hit)removeLinks(s,L);}
    /* シーンから外す（派生を選んでいたところも） */
    for(const s of S.scenes)if(mapSceneIds(s,id=>vBase(id)===p.id?'':id,false))await saveNow('scenes',s);
    S.parts=S.parts.filter(x=>x.id!==p.id);await dbDel('parts',p.id);markDeleted(p.id);closeSheet();onSave&&onSave(null);};
}

  </dl></div>

  <div class="row"><button class="btn wide" id="fhClose">閉じる</button></div>`);
  $('#fhClose').onclick=closeSheet;

const unb64=d=>fetch(d).then(r=>r.blob());
/* ===== 書き出し =====
   ・スマホは「共有」で Googleドライブなどへ送る。PCは「この端末に保存」でダウンロードのフォルダへ
   ・スマホの共有は .json のファイルを送れないので、中身は同じ JSON のまま .txt の名前にする（読み込みはどちらも使える）
   ・共有はボタンを押してすぐに呼ばないと断られるので、シートを開いたときに先にファイルを作っておく */
function ymdhm(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${ymd()}-${z(d.getHours())}${z(d.getMinutes())}`;}
async function buildExport(withImg){
  flush();
  const images=[],fonts=[],stamps=[];
  if(withImg){
    for(const r of await dbAll('stamps'))stamps.push({id:r.id,name:r.name,w:r.w,h:r.h,created:r.created,data:await b64(r.blob)});
    for(const r of await dbAll('images'))images.push({id:r.id,name:r.name,type:r.type,data:await b64(r.blob),thumb:r.thumb?await b64(r.thumb):null});
    for(const f of await dbAll('fonts'))fonts.push({id:f.id,name:f.name,file:f.file,size:f.size,created:f.created,data:await b64(f.blob)});
  }
  const data={app:'4koma-kobo',version:1,exported:new Date().toISOString(),textOnly:!withImg,meta:S.meta,parts:await Promise.all(S.parts.map(async p=>p.img?Object.assign({},p,{img:await b64(p.img)}):p)),scenes:S.scenes,works:S.works,images,fonts,stamps};
  return JSON.stringify(data);
}
function openExport(){
  const tf=new File(['x'],'t.txt',{type:'text/plain'});
  const canShare=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:[tf]}));
  const mobile=matchMedia('(pointer:coarse)').matches;
  openSheet(`<h2>書き出す</h2>
  <label class="switch"><input type="checkbox" id="exImg" checked><span>画像・字体・スタンプも入れる<span class="hint">外すと、部品・シーン・作品・設定（文字のデータ）だけになり、ファイルが小さくなります。プロンプトだけを急いで渡したいときに。画像のない端末では、そのシーンの画像は出ません。</span></span></label>
  <p class="hint" id="exInfo">ファイルを作っています…</p>
  <div class="row">${canShare?`<button class="btn ${mobile?'':'ghost'}" id="exShare" disabled>共有する（Googleドライブなど）</button>`:''}<button class="btn ${canShare&&mobile?'ghost':''}" id="exSave" disabled>この端末に保存</button></div>
  <p class="hint">${canShare?'スマホは「共有する」→「ドライブ」を選ぶと、Googleドライブに保存されます。PCでは drive.google.com からダウンロードして「読み込む（合わせる）」で取り込みます。':'PCでは「この端末に保存」でダウンロードのフォルダに入ります。スマホへ渡すときは、そのファイルを Googleドライブに上げてください。'}</p>
  <div class="row"><button class="btn ghost wide" id="exClose">閉じる</button></div>`);
  let ready=null,seq=0;
  const prep=async()=>{
    const my=++seq,withImg=$('#exImg').checked;ready=null;
    $$('#exShare,#exSave').forEach(x=>x.disabled=true);$('#exInfo').textContent='ファイルを作っています…';
    try{
      const json=await buildExport(withImg);if(my!==seq)return;
      const base=`toukou-${withImg?'backup':'moji'}-${ymdhm()}`;
      ready={withImg,json,base};
      $('#exInfo').textContent=`準備ができました（約 ${json.length<1048576?Math.max(1,Math.round(json.length/1024))+' KB':(json.length/1048576).toFixed(1)+' MB'}${withImg?'・画像など入り':'・文字だけ'}）`;
      $$('#exShare,#exSave').forEach(x=>x.disabled=false);
    }catch(e){if(my===seq)$('#exInfo').textContent='ファイルを作れませんでした';}
  };
  const done=async r=>{if(r.withImg){S.meta.lastBackup=Date.now();await dbPut('meta',S.meta);}};
  $('#exImg').onchange=prep;
  $('#exClose').onclick=()=>{closeSheet();render(true);};
  if($('#exShare'))$('#exShare').onclick=async()=>{
    const r=ready;if(!r)return;
    const f=new File([r.json],r.base+'.txt',{type:'text/plain'});
    try{await navigator.share({files:[f],title:r.base});await done(r);toast('共有しました');}
    catch(e){if(e&&e.name==='AbortError')return;toast('共有できませんでした。「この端末に保存」を使ってください');}
  };
  $('#exSave').onclick=async()=>{
    const r=ready;if(!r)return;
    const blob=new Blob([r.json],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=r.base+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},10000);
    await done(r);toast('保存しました（ダウンロードのフォルダ）');
  };
  prep();
}
