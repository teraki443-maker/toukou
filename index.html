<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>投稿</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  投稿（4コマ漫画づくりのアプリ）
  ・部品（人物・服装・ポーズ表情・背景・画風・LoRA）を登録し、組み合わせてシーン（1コマ）を作る
  ・シーンから PixAI 用のプロンプトを組み立ててコピーする
  ・シーンを4つ選んで起承転結の作品にする
  ・データはこの端末のブラウザの中（IndexedDB）だけに保存。外部のサービスは使わない
  ・設定の「バックアップを書き出す」で、全データを1つのファイルにして保存できる
-->
<style>
:root{
  --ink:#1f2328; --sub:#646b75; --line:#e2e4e8; --bg:#f5f6f8; --card:#fff;
  --acc:#4c5fd5; --acc-d:#3a4bb8; --acc-l:#eef0fd; --warn:#d6453d;
  --r0:#e8590c; --r1:#2f9e44; --r2:#d6336c; --r3:#1c7ed6;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e6e8eb;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:640px;margin:0 auto;background:var(--bg);min-height:100vh;min-height:100dvh}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;height:52px;padding:0 12px}
header h1{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#back{border:0;background:none;color:var(--acc);padding:8px 8px 8px 0;font-weight:600;white-space:nowrap}
main{padding:14px 16px calc(150px + env(safe-area-inset-bottom))}
nav#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav#tabs button{flex:1;border:0;background:none;padding:7px 0 8px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px}
nav#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav#tabs button.on{color:var(--acc);font-weight:700}
.fab{position:fixed;z-index:15;bottom:calc(70px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 304px));border:0;background:var(--acc);color:#fff;font-weight:700;padding:13px 20px;border-radius:999px;box-shadow:0 4px 14px rgba(40,50,120,.28)}
.fab:active{background:var(--acc-d)}

/* 部品 */
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.sec>h2{font-size:14px;margin:0 0 10px;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px;row-gap:0}
.sec>h2 small{font-weight:400;color:var(--sub);font-size:12px}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}
.tgs{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid #d3d6db;background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;min-height:34px}
.tg.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.tg.new{border-style:dashed;color:var(--acc)}
.pbox mark{border-radius:4px;padding:0 2px;font-weight:700}
.pbox mark.up{background:#ffe3c2;color:#8a3d00}
.pbox mark.dn{background:#dbe7ff;color:#1d3f8a}
.tg.wt.up{border-color:#f0b070;background:#fff1e0;color:#8a3d00}
.tg.wt.dn{border-color:#9db8ef;background:#eaf1ff;color:#1d3f8a}
.tg.wt b{font-size:11px}
.tg.wt.sel{outline:2px solid var(--ink);outline-offset:1px}
.wedit{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.wtop code{background:#f3f4f8;border-radius:6px;padding:2px 8px;font-size:13px;overflow-wrap:anywhere}
.wrow{display:flex;align-items:center;gap:10px}
.wrow input[type=range]{flex:1;padding:0;border:0;accent-color:var(--acc);height:32px}
.wscale{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin:0 50px 8px}
.ptabs{display:flex;gap:6px;margin-bottom:10px}
.ptabs button{flex:1;border:1px solid #d3d6db;background:#fff;border-radius:10px;padding:6px 0;display:flex;align-items:center;justify-content:center;gap:4px;opacity:.55}
.ptabs button.on{opacity:1;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.ptabs small{font-size:11px;color:var(--sub)}
.cwrap{width:100%;margin:0 auto 10px;border-radius:8px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.15);background:#fff}
.cwrap canvas{display:block;width:100%;height:100%;touch-action:none}
.cwrap{max-width:calc(62vh * var(--arn))}
/* 吹き出しを選んでいる間：上に見本を貼りつけ、下の操作をタブで切り替える（1画面で完結） */
body.editing nav#tabs{display:none}
body.editing main{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
body.editing .noedit{display:none}
body.editing .cstick{position:sticky;top:52px;z-index:6;background:var(--bg);margin:-14px -16px 8px;padding:8px 16px 6px;box-shadow:0 6px 8px -8px rgba(0,0,0,.25)}
body.editing .cstick .ptabs{display:none}
body.editing .cwrap{max-width:calc(44dvh * var(--arn));margin-bottom:0}
body.editing .cwrap{max-height:44dvh}
#bText{scroll-margin-bottom:12px}
@media (max-height:600px){body.editing .cwrap{max-width:calc(36dvh * var(--arn))}}
.ebar{display:flex;align-items:center;gap:6px;margin:0 0 6px}
.ebar b{flex:1;font-size:14px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ebar .btn.sm{padding:5px 9px}
.etabs{display:flex;margin:0 -14px 12px;border-bottom:1px solid var(--line)}
.etabs button{flex:1;border:0;background:none;padding:9px 0;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.rg{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.rg>span{flex:0 0 8.6em;font-size:12px;color:var(--sub);line-height:1.3}
.rg>span b{color:var(--ink)}
.rg input{flex:1;min-width:0}
.rg .btn.sm{flex:0 0 auto;padding:4px 8px;min-height:30px;font-size:12px}
.rsteps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:-2px 0 12px}
.rsteps .btn.sm{padding:4px 0;min-height:34px;font-size:12px}
.etabs button.on{color:var(--acc);border-color:var(--acc);font-weight:700}
#cctl .sec .f:last-child{margin-bottom:0}
.ctool{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.btn.onb{background:var(--ink);border-color:var(--ink);color:#fff}
.memo{margin:0;white-space:pre-wrap;font-size:14px}
.cimgs{display:flex;gap:8px;overflow-x:auto}
.cimgs button{flex:0 0 64px;height:64px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#f0f1f4}
.cimgs button.on{border-color:var(--acc)}
.cimgs img{width:100%;height:100%;object-fit:cover;display:block}
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -14px;padding:0 14px 4px;scroll-snap-type:x mandatory}
.strip button{position:relative;flex:0 0 46%;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;scroll-snap-align:start}
.strip canvas{display:block;width:100%;height:auto}
.strip .role{position:absolute;left:6px;top:6px}
.expgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.expgrid div{position:relative;aspect-ratio:800/912;background:#f0f1f4;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.expgrid img{width:100%;height:100%;object-fit:contain;display:block}
.expgrid i{font-size:10px;color:var(--sub);font-style:normal}
.expgrid .role{position:absolute;left:3px;top:3px;width:20px;height:20px;font-size:11px;flex-basis:20px}
.setlist{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.setc{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.setc canvas{flex:0 0 auto;width:88px;height:auto;border-radius:6px}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #d3d6db;padding:0;flex:0 0 30px}
.sw button.on,.sw label.on{outline:2px solid var(--acc);outline-offset:2px}
.sw button.nn{width:auto;flex:0 0 auto;border-radius:999px;padding:0 12px;font-size:12px;background:#fff;color:var(--ink)}
.sw label.cc{display:flex;align-items:center;gap:4px;border:1px solid #d3d6db;border-radius:999px;padding:2px 10px 2px 3px;font-size:12px;background:#fff}
.sw label.cc input{width:26px;height:26px;border:0;padding:0;background:none;border-radius:50%}
.stgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stc{border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stc .pick{aspect-ratio:1;width:100%;border:0;border-radius:6px;padding:6px;background:repeating-conic-gradient(#e6e8ec 0 25%,#fff 0 50%) 0 0/14px 14px}
.stc .pick img{width:100%;height:100%;object-fit:contain;display:block}
.stc small{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stc .acts{display:flex;gap:4px}.stc .acts button{flex:1;font-size:11px;padding:3px 0;border-radius:6px;border:1px solid var(--line);background:#fff}
.stc .acts button.d{color:var(--warn)}
.setb{flex:1;min-width:0}
.setb b{display:block;font-size:14px}
.setb small{color:var(--sub);font-size:11px}
.hsec{margin:0 0 18px}
.hsec h3{font-size:15px;margin:0 0 10px;padding-left:10px;border-left:4px solid var(--acc)}
.hstep{display:flex;gap:10px;margin-bottom:10px}
.hnum{flex:0 0 26px;height:26px;border-radius:50%;background:var(--acc-l);color:var(--acc);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.hbody{flex:1;min-width:0;font-size:14px}
.hbody>b:first-child{display:block;margin-bottom:2px}
.hbody p{margin:0 0 4px}
.hbody ul{margin:2px 0 4px;padding-left:18px}
.hbody code,.hfaq code{background:#f3f4f8;border-radius:4px;padding:0 5px;font-size:13px;overflow-wrap:anywhere}
.hfaq{margin:0;font-size:14px}
.hfaq dt{font-weight:700;margin-top:10px}
.hfaq dd{margin:2px 0 0;color:var(--sub)}
.linkb{border:0;background:none;color:var(--acc);text-decoration:underline;padding:0 0 0 4px;font-size:12px}
.imgs .im i.snapb{position:absolute;right:4px;bottom:4px;background:rgba(255,255,255,.92);color:var(--acc);font-style:normal;font-size:10px;font-weight:700;padding:0 6px;border-radius:4px;border:1px solid #c9d0f5}
.snapbox{background:#fafbff}
.snapt{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
.snapt th{text-align:left;white-space:nowrap;color:var(--sub);font-weight:600;padding:5px 10px 5px 0;vertical-align:top;width:1%}
.snapt td{padding:5px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.snapt tr:last-child td{border-bottom:0}
.snapt small{color:var(--sub)}
.gone{color:var(--warn)}
.fmtsel{font-size:13px;padding:5px 8px;width:auto;max-width:62%}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid #d3d6db;border-radius:10px;background:#fff;color:inherit;min-width:0}
textarea{min-height:64px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.hint{display:block;font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
.muted{color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:active{background:var(--acc-d)}
.btn.ghost{background:#fff;color:var(--acc)}
.btn.ghost:active{background:var(--acc-l)}
.btn.danger{background:#fff;color:var(--warn);border-color:#f0c4c1}
.btn.sm{padding:6px 11px;font-size:13px;min-height:36px}
.btn.wide{width:100%}
.ico{border:1px solid #d3d6db;background:#fff;border-radius:10px;width:42px;flex:0 0 42px;color:var(--acc);font-size:16px}
.empty{text-align:center;color:var(--sub);padding:40px 12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.banner{background:#fff8e6;border:1px solid #f3dfa6;border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.banner.info{background:var(--acc-l);border-color:#d4daf8}

.role{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;color:#fff;font-size:13px;font-weight:700;flex:0 0 24px}
.r0{background:var(--r0)}.r1{background:var(--r1)}.r2{background:var(--r2)}.r3{background:var(--r3)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#eef0f3;color:var(--sub);margin:0 4px 2px 0}

/* 作品一覧 */
.wlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wcard{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:0;text-align:left;overflow:hidden}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line);aspect-ratio:1/1}
.grid4 .cell{background:#f0f1f4;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#b5bac2;font-weight:700}
.grid4 img{width:100%;height:100%;object-fit:cover;display:block}
.wcard .meta{padding:8px 10px}
.wcard .meta b{display:block;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wcard .meta small{color:var(--sub);font-size:11px}

/* 作品の編集 */
.panel .ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel .ph b{font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.prow{display:flex;gap:12px;align-items:flex-start}
.pthumb{flex:0 0 108px;width:108px;aspect-ratio:1/1;border:1px dashed #c5c9d0;border-radius:10px;background:#f6f7f9;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pbtns{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.pbtns .btn{width:100%;padding-left:4px;padding-right:4px;overflow:hidden;text-overflow:ellipsis}
.pbtns .main{grid-column:1/-1;min-height:44px;font-size:14px}
.panel .ph .linkx{margin-left:auto;flex:0 0 auto;border:0;background:none;color:var(--warn);font-size:13px;padding:4px 2px}
.pthumb{flex-basis:96px!important;width:96px!important}
.fab.sm{padding:10px 16px;font-size:14px;display:flex;align-items:center;gap:6px}
.fab.sm svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.editing #toast{bottom:calc(24px + env(safe-area-inset-bottom))}
@media (max-width:400px){.two.nar{grid-template-columns:1fr}}
.prev{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.prev div{aspect-ratio:4/3;background:#eef0f3;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#b5bac2;font-weight:700}
.prev img{width:100%;height:100%;object-fit:cover}

/* シーン一覧 */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.filters input{grid-column:1/-1}
.rolebar{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.rolebar button{border:1px solid #d3d6db;background:#fff;border-radius:999px;padding:4px 12px;font-size:13px}
.rolebar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.scard{display:flex;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:10px}
.scard .th{flex:0 0 84px;width:84px;height:84px;border-radius:8px;background:#f0f1f4;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#b5bac2;font-size:11px}
.scard .th img{width:100%;height:100%;object-fit:cover}
.scard .sb{min-width:0;flex:1}
.scard .sb b{display:block;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scard .pp{margin:2px 0 0;font-size:12px;color:var(--sub);font-family:ui-monospace,Menlo,Consolas,monospace;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.pickbar{background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.pickbar .btn{background:#fff;color:var(--ink);border-color:#fff}

/* シーンの編集 */
.slot{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fbfbfc}
.slot .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;font-size:13px}
.sel{display:flex;gap:6px}
.sel select{flex:1}
.ptags{font-size:11px;color:var(--sub);margin-top:3px;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two label.f{margin-bottom:0}
.rolepick{display:flex;gap:6px}
.rolepick button{border:1px solid #d3d6db;background:#fff;border-radius:8px;width:44px;height:36px;font-weight:700;color:var(--sub)}
.rolepick button.on{color:#fff;border-color:transparent}
.rolepick button.on.r0{background:var(--r0)}.rolepick button.on.r1{background:var(--r1)}.rolepick button.on.r2{background:var(--r2)}.rolepick button.on.r3{background:var(--r3)}
.pbox{background:#f3f4f8;border-radius:8px;padding:10px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;white-space:pre-wrap;margin:0;user-select:text;-webkit-user-select:text}
.pbox.neg{color:#8a4b47;background:#fbf2f1}
.plabel{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:700;margin:8px 0 4px}
.plabel:first-of-type{margin-top:0}
.loras{font-size:13px;margin-top:8px}
.loras span{display:inline-block;background:#fff4e0;border:1px solid #f1d9a8;border-radius:6px;padding:1px 8px;margin:0 4px 4px 0}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow input[type=checkbox]{width:20px;height:20px;flex:0 0 20px;accent-color:var(--acc)}
.lrow .ln{flex:1;min-width:0;font-size:14px}
.lrow .ln small{display:block;color:var(--sub);font-size:11px}
.lrow input[type=number]{width:84px;flex:0 0 84px}
.collapse>summary{list-style:none;cursor:pointer;color:var(--acc);font-size:13px;font-weight:600}
.collapse>summary::-webkit-details-marker{display:none}
.imgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.imgs .im{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:#f0f1f4}
.imgs .im img{width:100%;height:100%;object-fit:cover;display:block}
.imgs .im em{position:absolute;left:4px;top:4px;background:var(--acc);color:#fff;font-style:normal;font-size:10px;padding:0 6px;border-radius:4px}
.imgs .add{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--acc);border:1px dashed #b9c1ee;background:var(--acc-l);cursor:pointer;font-weight:600}

/* 部品一覧 */
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid #d3d6db;background:#fff;border-radius:999px;padding:5px 13px;font-size:13px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pcat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pcat button{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:72px}
.pcat b{font-size:15px}.pcat .n{margin-left:auto;font-size:13px;color:var(--sub);font-weight:700}
.pcat small{flex-basis:100%;font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pitem.hasimg{display:flex;gap:10px;align-items:flex-start}.pitem.hasimg>div{flex:1;min-width:0}
.pitem .pim{flex:0 0 64px;width:64px;height:64px;border-radius:8px;object-fit:cover;background:#eee}
.pimg{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pimg .ph{width:96px;height:96px;flex:0 0 96px;border-radius:10px;border:1px dashed #c3c7cf;background:#f6f7f9 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:11px;text-align:center}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.pgrid button{border:2px solid transparent;border-radius:10px;background:#fff;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:center}
.pgrid button.on{border-color:var(--acc)}
.pgrid .gi{aspect-ratio:1;width:100%;background:#eef0f3 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:11px;padding:4px}
.pgrid small{font-size:11px;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.pitem b{font-size:14px}
.pitem small{float:right;color:var(--sub);font-size:11px;margin-top:2px}
.pitem .ptags{font-size:12px}

/* シート */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(20,22,30,.45)}
#sheet .bd{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h2{font-size:17px;margin:0 0 14px}
#sheet .full{width:100%;max-height:46vh;max-height:46dvh;object-fit:contain;border-radius:10px;display:block;background:#f0f1f4;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,32,40,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
details.nh{margin:-4px 0 12px;font-size:14px}
details.nh summary{color:var(--acc);font-size:13px;cursor:pointer;padding:4px 0}
details.nh .nhb{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:6px}
details.nh .nhb .sec{border:0;padding:0;background:none;box-shadow:none}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat div{background:#f3f4f8;border-radius:8px;padding:8px 0}
.stat b{display:block;font-size:18px}
.stat small{font-size:11px;color:var(--sub)}
.switch{display:flex;align-items:flex-start;gap:10px;font-size:14px}
.switch input{width:20px;height:20px;flex:0 0 20px;margin-top:2px;accent-color:var(--acc)}
</style>

<div id="sheet"><div class="bk"></div><div class="bd" id="sheetBody"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ========== 小道具 ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ROLE=['起','承','転','結'];
const view=$('#view');
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2000);}
function fmtDate(t){if(!t)return'';const d=new Date(t);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;}
function ymd(){const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;}

/* 部品の種類 */
const PT={
  chara:{label:'人物',hint:'その人の変わらない特徴（髪・目など）。体つきは「身体の特徴」、服や表情は別の部品にすると使い回しやすい',ph:'black hair, short hair, brown eyes',namePh:'例：ミカ'},
  phys:{label:'身体の特徴',hint:'体型・身長・肌の色・胸の大きさなど、体のつくり。1人にいくつでも付けられます',ph:'slender, tall, fair skin',namePh:'例：細身'},
  outfit:{label:'服装',hint:'服・小物のタグ',ph:'bikini',namePh:'例：水着（黒）'},
  action:{label:'ポーズ',hint:'ポーズ・動き・視線など',ph:'standing, looking at viewer',namePh:'例：立つ'},
  face:{label:'表情',hint:'表情',ph:'smile',namePh:'例：笑顔'},
  body:{label:'体の状態',hint:'汗・赤面・濡れ・涙など。1人にいくつでも付けられます',ph:'sweat',namePh:'例：汗'},
  inter:{label:'絡み',hint:'ハグ・キス・手をつなぐなど、人物どうしの関わり。シーンにいくつでも付けられます',ph:'hug',namePh:'例：ハグ'},
  bg:{label:'背景',hint:'場所・時間帯・天気など',ph:'beach, blue sky, daytime',namePh:'例：昼のビーチ'},
  angle:{label:'カメラ位置',hint:'どこから見るか（横から・後ろから・見上げなど）。シーンにいくつでも付けられます',ph:'from side',namePh:'例：横から'},
  camera:{label:'構図',hint:'カメラの距離（全身・上半身・アップなど）やピント',ph:'full body',namePh:'例：全身'},
  light:{label:'光',hint:'光の当たり方・明るさだけ（逆光・薄暗いなど）。場所（暗い部屋・夕方の海など）は「背景」に入れます',ph:'soft lighting',namePh:'例：やわらかい光'},
  style:{label:'画風',hint:'画質・画風のタグ。タグの形では最後に入ります',ph:'masterpiece, best quality',namePh:'例：いつもの画風'},
  lora:{label:'LoRA',hint:'LoRA を使うときにプロンプトへ足すタグ（なければ空のまま）。LoRA は作られたモデルの系統（SDXL 系・Tsubaki 系）でしか使えません',ph:'トリガーワード',namePh:'例：水彩風'}
};
const PT_ORDER=['chara','phys','outfit','action','face','body','inter','bg','angle','camera','light','style','lora'];
/* プロンプトの形（PixAI 公式ブログの勧めに合わせる） */
const FMT={
  tag:{label:'タグ（SDXL 系：Haruka・Hoshino など）',hint:'人数 → 人物の特徴 → 身体の特徴 → 服 → ポーズ → 表情 → 体の状態 → 絡み → 背景 → カメラ位置 → 構図 → 光 → 画風 の順に、タグを並べます。'},
  prose:{label:'文章（Tsubaki 系）',hint:'人物（2人以上なら人数と絡みを先に）→ 一人ずつの説明 → 背景 → カメラ位置 → 構図 → 光 → 画風 の順の英語の文章にします。部品に「文章」を書いておくと、タグの代わりにそれを使います。'},
  group:{label:'かっこでまとめる（girl(…) の形）',hint:'人物ごとに girl(…) の形でまとめます（今までの書き方）。'}
};

/* ========== データベース（IndexedDB） ========== */
let db=null;
const APP_VER='v19';/* sw.js の VERSION と同じにする */
const STORES=['parts','scenes','works','images','meta','fonts','stamps'];
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('manga4koma',3);r.onupgradeneeded=()=>{const d=r.result;for(const s of STORES)if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{if(!db)return res(undefined);const t=db.transaction(store,mode);const req=fn(t.objectStore(store));let out;if(req)req.onsuccess=()=>{out=req.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const dbAll=s=>tx(s,'readonly',st=>st.getAll()).then(r=>r||[]);
const dbGet=(s,id)=>tx(s,'readonly',st=>st.get(id));
const dbPut=(s,v)=>tx(s,'readwrite',st=>st.put(v));
const dbDel=(s,id)=>tx(s,'readwrite',st=>st.delete(id));

const S={parts:[],scenes:[],works:[],meta:{id:'settings',loraInPrompt:false,lastBackup:0}};
const byId=(k,id)=>id?S[k].find(x=>x.id===id):undefined;
async function loadAll(){
  S.parts=await dbAll('parts');S.scenes=await dbAll('scenes');S.works=await dbAll('works');
  S.meta=Object.assign({id:'settings',loraInPrompt:false,lastBackup:0},await dbGet('meta','settings')||{});
  await seedAngles();await seedCams();
}
/* カメラ位置のよく使う部品を、最初の1回だけ入れておく（消しても、もう一度は入らない） */
const ANGLE_PRESETS=[
  ['正面','straight-on','真正面から'],
  ['斜め前から','three-quarter view','顔と体が少し斜めを向いて見える'],
  ['横から','from side','横から見る'],
  ['真横（横顔）','from side, profile','顔も真横を向いた横顔'],
  ['後ろから','from behind','背中側から'],
  ['上から（見下ろし）','from above','高いところから見下ろす'],
  ['下から（見上げ・あおり）','from below','低いところから見上げる'],
  ['真上から','from above, high angle','かなり高い位置から見下ろす'],
  ['真下から','from below, low angle','かなり低い位置から見上げる'],
  ['傾ける（ダッチアングル）','dutch angle','画面を斜めに傾けて動きや不安を出す'],
  ['主観（POV）','pov','見ている人の目線']
];
async function seedAngles(){
  if(S.meta.seedAngle)return;
  if(!S.parts.some(p=>p.type==='angle')){
    for(const[name,tags,memo]of ANGLE_PRESETS){const p={id:uid(),type:'angle',name,tags,memo,created:Date.now(),updated:Date.now()};S.parts.push(p);await dbPut('parts',p);}
  }
  S.meta.seedAngle=1;await dbPut('meta',S.meta);
}
/* 構図・光のよく効く部品を、1回だけ足す（同じタグのものがあれば足さない） */
const CAM_PRESETS=[
  ['太ももから上（カウボーイショット）','cowboy shot','太ももあたりから上。体の形と表情が両方見える、いちばん使いやすい距離'],
  ['顔のアップ','close-up, portrait','顔を大きく。表情を見せたいコマに'],
  ['背景ぼかし','depth of field, blurry background','人物にピントを合わせ、背景をぼかす']
];
/* 光のよく効く部品 */
/* 光の部品は、光のことだけ（場所や時間帯は背景に入れる） */
const LIGHT_PRESETS=[
  ['やわらかい光','soft lighting','ふんわり明るい。どんな場面にも合わせやすい'],
  ['ドラマチックな光','cinematic lighting, dramatic lighting','映画のような強い明暗。見せ場のコマに'],
  ['薄暗い（ぼんやり）','dim lighting, low light','全体が暗く、人物がうっすら見える。背景の「暗い部屋」などと組み合わせる'],
  ['薄暗い＋窓からの光','dim lighting, window light, light rays','暗い中に、窓から光の筋がさしこむ'],
  ['薄暗い＋ランプの灯り','dim lighting, warm lighting, lamplight','暗い中で、オレンジ色の灯りが近くを照らす'],
  ['薄暗い＋画面の光','dim lighting, screen light, face lit by screen','スマホやパソコンの画面の光で顔が照らされる'],
  ['逆光','backlighting, rim light','うしろから光。体や髪のふちが光る'],
  ['逆光（夕日の色）','backlighting, golden hour, warm lighting','うしろから夕方のあたたかい光。夕日は背景で選ぶ'],
  ['逆光（光のつぶ）','backlighting, sunlight, light particles','明るい光を背にして、光のつぶが舞う'],
  ['逆光（シルエット）','backlighting, silhouette','人物が影になって形だけ見える']
];
/* v17 で入れた光の部品を、光だけのタグに直す（自分で直したものはそのまま） */
const LIGHT_FIX={'dark room, dim lighting, low light':2,'dark room, window light, light rays, dim lighting':3,'dark room, dim lighting, warm lamp light, glowing':4,'dark room, screen light, glowing screen, face lit by screen':5,'backlighting, sunset, golden hour':7,'backlighting, sunlight through window, light particles':8,'backlighting, silhouette, dark figure':9};
async function seedCams(){
  if(!S.meta.seedCam){
    const have=new Set(S.parts.filter(p=>p.type==='camera').map(p=>(p.tags||'').trim()));
    for(const[name,tags,memo]of CAM_PRESETS){if(have.has(tags))continue;const p={id:uid(),type:'camera',name,tags,memo,created:Date.now(),updated:Date.now()};S.parts.push(p);await dbPut('parts',p);}
    S.meta.seedCam=1;await dbPut('meta',S.meta);
  }
  if(!S.meta.seedLight){
    /* 構図と光を分けたとき：光だけの部品は「光」へ移し、シーンでも光の欄に付けかえる */
    const lightOnly=new Set(LIGHT_PRESETS.map(x=>x[1]));
    for(const p of S.parts)if(p.type==='camera'&&lightOnly.has((p.tags||'').trim())){p.type='light';p.updated=Date.now();await dbPut('parts',p);
      for(const sc of S.scenes)if(sc.camera===p.id){sc.camera='';if(!sc.light)sc.light=p.id;await dbPut('scenes',sc);}}
    const have=new Set(S.parts.filter(p=>p.type==='light').map(p=>(p.tags||'').trim()));
    for(const[name,tags,memo]of LIGHT_PRESETS){if(have.has(tags))continue;const p={id:uid(),type:'light',name,tags,memo,created:Date.now(),updated:Date.now()};S.parts.push(p);await dbPut('parts',p);}
    S.meta.seedLight=1;await dbPut('meta',S.meta);
  }
  if(!S.meta.seedLight2){
    for(const p of S.parts){const k=LIGHT_FIX[(p.tags||'').trim()];if(p.type==='light'&&k!=null){const[name,tags,memo]=LIGHT_PRESETS[k];p.name=name;p.tags=tags;p.memo=memo;p.updated=Date.now();await dbPut('parts',p);}}
    S.meta.seedLight2=1;await dbPut('meta',S.meta);
  }
}
/* 入力のたびに保存（少し待ってまとめて保存） */
const pending=new Map();let flushT;
function save(kind,obj){obj.updated=Date.now();pending.set(obj.id,[kind,obj]);clearTimeout(flushT);flushT=setTimeout(flush,350);}
function flush(){const items=[...pending.values()];pending.clear();for(const[k,o]of items)dbPut(k,o).catch(()=>toast('保存できませんでした'));}
function saveNow(kind,obj){obj.updated=Date.now();pending.delete(obj.id);return dbPut(kind,obj).catch(()=>toast('保存できませんでした'));}
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();});

/* ========== 画像 ========== */
const urlCache={};
async function imgURL(id,thumb){const k=id+(thumb?':t':':f');if(urlCache[k])return urlCache[k];const r=await dbGet('images',id);if(!r)return'';const b=thumb?(r.thumb||r.blob):r.blob;return urlCache[k]=URL.createObjectURL(b);}
/* 部品の見本画像（表情・画風などのイメージ）。部品のデータの中に小さい画像として入れておく */
const partUrls={};
function partImgUrl(p){if(!p||!p.img)return '';const c=partUrls[p.id];if(c&&c.b===p.img)return c.u;if(c)URL.revokeObjectURL(c.u);const u=URL.createObjectURL(p.img);partUrls[p.id]={b:p.img,u};return u;}
const IMG_TYPES=['face','style'];/* 見本を並べて選べる種類 */
function makeThumb(blob,max){return new Promise(res=>{const u=URL.createObjectURL(blob);const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b||blob);},'image/jpeg',.82);};im.onerror=()=>{URL.revokeObjectURL(u);res(blob);};im.src=u;});}
async function addImage(file){const blob=new Blob([file],{type:file.type||'image/png'});const thumb=await makeThumb(blob,480);const id=uid();await dbPut('images',{id,blob,thumb,name:file.name||'image',type:blob.type});return id;}
function hydrate(root){$$('img[data-img]',root).forEach(img=>{if(img.src)return;imgURL(img.dataset.img,!img.dataset.full).then(u=>{if(u)img.src=u;});});}
async function deleteImageIfUnused(id){if(S.scenes.some(s=>(s.images||[]).includes(id)))return;await dbDel('images',id);for(const k of[id+':t',id+':f'])if(urlCache[k]){URL.revokeObjectURL(urlCache[k]);delete urlCache[k];}}

/* ========== タグとプロンプト ========== */
/* カンマで区切る（かっこの中のカンマでは区切らない） */
function splitTags(s){
  s=String(s||'').replace(/[、，]/g,',').replace(/（/g,'(').replace(/）/g,')').replace(/\n/g,',');
  const out=[];let depth=0,cur='';
  for(const ch of s){
    if(ch==='('||ch==='['||ch==='<')depth++;
    if(ch===')'||ch===']'||ch==='>')depth=Math.max(0,depth-1);
    if(ch===','&&depth===0){if(cur.trim())out.push(cur.trim());cur='';}else cur+=ch;
  }
  if(cur.trim())out.push(cur.trim());
  return out;
}
/* 重み付きのタグ (tag:1.2) を、タグと重みに分ける */
function parseTag(t){const m=/^\((.+):\s*(-?[\d.]+)\)$/.exec(String(t).trim());return m?{base:m[1].trim(),w:+m[2]}:{base:String(t).trim(),w:null};}
const norm=t=>parseTag(t).base.toLowerCase().replace(/\s+/g,' ').trim();
const baseOf=t=>parseTag(t).base;
/* シーンの重みを当てる */
function weigh(t,sc){const p=parseTag(t);const k=norm(t);const ws=(sc&&sc.weights)||{};const w=(k in ws)?ws[k]:p.w;return(w!=null&&Math.abs(w-1)>1e-9)?`(${p.base}:${+(+w).toFixed(2)})`:p.base;}
function uniq(arr,remove){const rm=new Set((remove||[]).map(norm));const seen=new Set();return arr.filter(t=>{const k=norm(t);if(rm.has(k)||seen.has(k))return false;seen.add(k);return true;});}
const P_=id=>byId('parts',id);
const T_=id=>splitTags(P_(id)&&P_(id).tags);
const TX_=id=>((P_(id)&&P_(id).text)||'').trim();
function subjKind(s){s=(s||'').toLowerCase();if(/girl|woman|female/.test(s))return'girl';if(/boy|man|male/.test(s))return'boy';return'';}
/* 人数のタグ：1girl・2girls・1boy など */
function countTags(subs){const g=subs.filter(s=>subjKind(s)==='girl').length,b=subs.filter(s=>subjKind(s)==='boy').length;const o=[];if(g)o.push(g===1?'1girl':g+'girls');if(b)o.push(b===1?'1boy':b+'boys');return o;}
function slotInfo(sl){
  const c=P_(sl.chara),rm=splitTags(sl.remove);
  const subj=(((c&&c.subject)||'girl').trim()||'girl').replace(/^\d+\s*/,'');
  return{sl,c,subj,rm,feat:uniq(T_(sl.chara),rm),phys:uniq((sl.phys||[]).flatMap(T_),rm),out:uniq(T_(sl.outfit),rm),pose:uniq(T_(sl.action),rm),face:uniq(T_(sl.face),rm),
    body:uniq((sl.body||[]).flatMap(T_),rm),add:uniq(splitTags(sl.add),rm)};
}
const NUMW=['','One','Two','Three','Four','Five','Six'];
const ORD=['first','second','third','fourth','fifth','sixth'];
const art=w=>/^[aeiou]/i.test(w)?'an':'a';
const sent=s=>{s=String(s||'').trim().replace(/[,\s]+$/,'');if(!s)return'';s=s[0].toUpperCase()+s.slice(1);return /[.!?]$/.test(s)?s:s+'.';};
function buildPrompt(sc){
  const fmt=S.meta.fmt||'tag';
  const slots=(sc.chars||[]).map(slotInfo);
  const srm=splitTags(sc.remove);
  const inter=uniq((sc.inter||[]).flatMap(T_),srm),bg=uniq(T_(sc.bg),srm),ang=uniq((sc.angle||[]).flatMap(T_),srm),cam=uniq(T_(sc.camera),srm),lit=uniq(T_(sc.light),srm),add=uniq(splitTags(sc.add),srm),style=uniq(T_(sc.style),srm);
  const loras=[],trig=[];
  for(const l of sc.loras||[]){
    const p=P_(l.id);if(!p)continue;
    const w=(l.weight!==''&&l.weight!=null)?l.weight:(p.weight??'');
    loras.push({name:p.loraName||p.name,label:p.name,weight:w});
    trig.push(...splitTags(p.tags));
  }
  const loraTxt=S.meta.loraInPrompt?loras.map(l=>`<lora:${l.name}:${l.weight===''?1:l.weight}>`):[];
  let pos;
  /* 重みを付けられるタグの一覧（並びはタグの形と同じ） */
  const all=[...trig];for(const s of slots)all.push(...s.feat,...s.phys,...s.out,...s.pose,...s.face,...s.body,...s.add);all.push(...inter,...bg,...ang,...add,...cam,...lit,...style);
  const tagList=uniq(all).map(t=>({base:baseOf(t),key:norm(t),own:parseTag(t).w}));
  const W=t=>weigh(t,sc);
  if(fmt==='group'){
    const out=slots.map(s=>{const t=uniq([...s.feat,...s.phys,...s.out,...s.pose,...s.face,...s.body,...s.add]).map(W);return t.length?`${s.subj}(${t.join(', ')})`:s.subj;});
    pos=[...out,...uniq([...inter,...bg,...ang,...add,...cam,...lit,...style,...trig]).map(W),...loraTxt].join(', ');
  }else if(fmt==='tag'){
    const t=[...trig];
    for(const s of slots)t.push(...s.feat,...s.phys,...s.out,...s.pose,...s.face,...s.body,...s.add);
    t.push(...inter,...bg,...ang,...add,...cam,...lit,...style);
    pos=[...countTags(slots.map(s=>s.subj)),...uniq(t).map(W),...loraTxt].join(', ');
  }else{
    /* 文章の形では重みを使わない（PixAI の DiT ガイドで、(tag:1.2) は効かないとされているため） */
    const B=a=>a.map(baseOf);
    for(const s of slots)for(const k of['feat','phys','out','pose','face','body','add'])s[k]=B(s[k]);
    trig.splice(0,trig.length,...B(trig));
    for(const a of[inter,bg,ang,cam,lit,add,style])a.splice(0,a.length,...B(a));
    /* 文章（Tsubaki 系） */
    const S2=[];
    if(trig.length)S2.push(uniq(trig).join(', ')+',');
    const head=s=>TX_(s.sl.chara)||`${art(s.subj)} ${s.subj}${s.feat.length?' with '+s.feat.join(', '):''}`;
    const details=s=>{const d=[];const ph=(s.sl.phys||[]).map(id=>TX_(id)||uniq(T_(id),s.rm).map(baseOf).join(', ')).filter(Boolean).join(', ');if(ph)d.push(ph);const o=TX_(s.sl.outfit)||s.out.join(', ');if(o)d.push(/^wear/i.test(o)?o:'wearing '+o);
      const pz=TX_(s.sl.action)||s.pose.join(', ');if(pz)d.push(pz);const fc=TX_(s.sl.face)||s.face.join(', ');if(fc)d.push(fc);
      const bd=(s.sl.body||[]).map(id=>TX_(id)||uniq(T_(id),s.rm).join(', ')).filter(Boolean).join(', ');if(bd)d.push(bd);if(s.add.length)d.push(s.add.join(', '));return d;};
    if(slots.length===1){const s=slots[0];S2.push(sent([head(s),...details(s)].join(', ')));}
    else if(slots.length>1){
      S2.push(sent(`${NUMW[slots.length]||slots.length} characters: `+slots.map(s=>`${art(s.subj)} ${s.subj}`).join(' and ')));
    }
    const it=(sc.inter||[]).map(id=>TX_(id)).filter(Boolean),itTags=(sc.inter||[]).filter(id=>!TX_(id)).flatMap(id=>uniq(T_(id),srm));
    for(const x of it)S2.push(sent(x));
    if(itTags.length)S2.push(sent(`They are ${uniq(itTags).join(', ')}`));
    if(slots.length>1)slots.forEach((s,i)=>S2.push(sent([`The ${ORD[i]||(i+1)+'th'} is ${head(s)}`,...details(s)].join(', '))));
    const bgt=TX_(sc.bg)||bg.join(', ');if(bgt)S2.push(sent(TX_(sc.bg)?bgt:'Background: '+bgt));
    if(add.length)S2.push(sent(add.join(', ')));
    const at=(sc.angle||[]).map(id=>TX_(id)).filter(Boolean),atTags=(sc.angle||[]).filter(id=>!TX_(id)).flatMap(id=>uniq(T_(id),srm).map(baseOf));
    for(const x of at)S2.push(sent(x));if(atTags.length)S2.push(sent('Viewed '+uniq(atTags).join(', ')));
    const ct=TX_(sc.camera)||cam.join(', ');if(ct)S2.push(sent(TX_(sc.camera)?ct:'Framing: '+ct));
    const lt=TX_(sc.light)||lit.join(', ');if(lt)S2.push(sent(TX_(sc.light)?lt:'Lighting: '+lt));
    const sty=TX_(sc.style)||style.join(', ');if(sty)S2.push(sent(TX_(sc.style)?sty:'Style: '+sty));
    pos=[S2.join(' '),...loraTxt].filter(Boolean).join(' ');
  }
  const neg=uniq([...splitTags(P_(sc.style)&&P_(sc.style).neg),...splitTags(sc.neg)]);
  return{pos,neg:neg.join(', '),loras,tagList,fmt};
}
/* プレビュー：重みを付けたタグに色を付ける */
function hlPrompt(pos){return esc(pos).replace(/\(([^()]+):(-?[\d.]+)\)/g,(m,b,w)=>`<mark class="${+w>1?'up':'dn'}">${m}</mark>`);}
async function copyText(t){
  if(!t)return toast('コピーする文字がありません');
  try{await navigator.clipboard.writeText(t);toast('コピーしました');}
  catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();toast(ok?'コピーしました':'コピーできませんでした。長押しで選んでください');}
}

let tab='parts',stack=[{v:'parts'}],ignorePop=0;/* 開いたら最初は「部品」 */
const cur=()=>stack[stack.length-1];
function go(v,p){stack.push(Object.assign({v},p||{}));history.pushState({n:stack.length},'');render();}
function goBack(){if(stack.length>1)history.back();}
addEventListener('popstate',()=>{
  if(ignorePop>0){ignorePop--;return;}
  if($('#sheet').classList.contains('open')){hideSheet();return;}
  if(stack.length>1){flush();stack.pop();render();}
});
function setTab(t){flush();const extra=stack.length-1;tab=t;stack=[{v:t}];if(extra>0){ignorePop++;history.go(-extra);}render();}
$('#back').onclick=goBack;
$$('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function setHead(t){$('#ttl').textContent=t;$('#back').hidden=stack.length<=1;}
function render(keep){

}

/* いくつでも選べる部品（体の状態・絡み） */
function chipSel(label,type,arr,attrs){const ps=S.parts.filter(p=>p.type===type).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'));
  return `<div class="f"><span>${label}（いくつでも）</span><div class="tgs">${ps.map(p=>`<button type="button" class="tg ${arr.includes(p.id)?'on':''}" ${attrs} data-pid="${p.id}">${esc(p.name||'名前なし')}</button>`).join('')}<button type="button" class="tg new" ${attrs} data-pid="__new">＋ 登録</button></div></div>`;}
let wSel=null;
function vScene(c){
  const sc=byId('scenes',c.id);if(!sc){stack.pop();return render();}
  sc.chars=sc.chars||[];sc.loras=sc.loras||[];sc.images=sc.images||[];sc.roles=sc.roles||[];sc.inter=sc.inter||[];sc.angle=sc.angle||[];
  sc.chars.forEach(c=>{c.body=c.body||[];c.phys=c.phys||[];});
  setHead(sc.title||'無題のシーン');
  const loraParts=S.parts.filter(p=>p.type==='lora');
  const u=usedIn(sc.id);
  view.innerHTML=`
  <label class="f"><span>シーンの名前</span><input id="sTitle" value="${esc(sc.title)}" placeholder="例：ビーチで振り向くミカ"></label>
  <label class="f"><span>向いている場面（いくつでも）</span><div class="rolepick">${ROLE.map((r,i)=>`<button class="r${i} ${sc.roles.includes(r)?'on':''}" data-role="${r}">${r}</button>`).join('')}</div></label>

  <div class="sec prompt">
    <div class="plabel"><select class="fmtsel" id="fmtSel" aria-label="プロンプトの形">${Object.entries(FMT).map(([k,v])=>`<option value="${k}"${(S.meta.fmt||'tag')===k?' selected':''}>${v.label}</option>`).join('')}</select><button class="btn sm" id="cpPos">コピー</button></div>
    <pre class="pbox" id="pPos"></pre>
    <div id="negWrap"><div class="plabel">ネガティブ <button class="btn sm ghost" id="cpNeg">コピー</button></div><pre class="pbox neg" id="pNeg"></pre></div>
    <div class="loras" id="pLora"></div>
  </div>

  <div class="sec" id="wSec"><h2>重み <small>タグを押して、強く・弱くする</small></h2>
    <div id="wBody"></div>
  </div>

  <div class="sec"><h2>人物 <small>人数のタグ（1girl・2girls など）は自動で付きます</small></h2>
    ${sc.chars.map((sl,i)=>`<div class="slot"><div class="sh">人物 ${i+1}<button class="btn sm danger" data-delslot="${i}">外す</button></div>
      ${partSel('人物','chara',sl.chara,`data-slot="${i}" data-f="chara"`)}
      ${chipSel('身体の特徴','phys',sl.phys,`data-chip="phys" data-slot="${i}"`)}
      ${partSel('服装','outfit',sl.outfit,`data-slot="${i}" data-f="outfit"`)}
      ${partSel('ポーズ','action',sl.action,`data-slot="${i}" data-f="action"`)}
      ${partSel('表情','face',sl.face,`data-slot="${i}" data-f="face"`)}
      ${chipSel('体の状態','body',sl.body,`data-chip="body" data-slot="${i}"`)}
      <div class="two">
        <label class="f"><span>足すタグ</span><input data-slot="${i}" data-t="add" value="${esc(sl.add)}" placeholder="looking back"></label>
        <label class="f"><span>外すタグ</span><input data-slot="${i}" data-t="remove" value="${esc(sl.remove)}" placeholder="smile"></label>
      </div>
      <span class="hint">このシーンだけの変更です。部品はそのまま。</span>
    </div>`).join('')}
    <button class="btn ghost sm" id="addSlot">＋ 人物を足す</button>
  </div>

  <div class="sec"><h2>絡み <small>人物どうしの関わり</small></h2>
    ${chipSel('絡み','inter',sc.inter,'data-chip="inter"')}
    ${sc.inter.length&&sc.chars.length<2?'<p class="hint" style="margin:-6px 0 0">絡みは、人物が2人以上のときに使います。</p>':''}
  </div>

  <div class="sec"><h2>背景・カメラ・画風</h2>
    ${partSel('背景','bg',sc.bg,'data-scf="bg"')}
    ${chipSel('カメラ位置','angle',sc.angle,'data-chip="angle"')}
    ${partSel('構図','camera',sc.camera,'data-scf="camera"')}
    ${partSel('光','light',sc.light,'data-scf="light"')}
    ${partSel('画風','style',sc.style,'data-scf="style"')}
    <div class="two">
      <label class="f"><span>足すタグ（人物以外）</span><input data-st="add" value="${esc(sc.add)}" placeholder="sunset"></label>
      <label class="f"><span>外すタグ</span><input data-st="remove" value="${esc(sc.remove)}" placeholder="daytime"></label>
    </div>
    <label class="f" style="margin-top:12px"><span>ネガティブに足すタグ（このシーンだけ）</span><input data-st="neg" value="${esc(sc.neg)}" placeholder="glasses, text, watermark"></label>
    ${negHelp()}
  </div>

  <div class="sec"><h2>LoRA <small>PixAI の画面で選ぶ LoRA と重みを記録</small></h2>
    ${loraParts.length?loraParts.map(p=>{const on=sc.loras.find(l=>l.id===p.id);return `<div class="lrow"><input type="checkbox" data-lora="${p.id}" ${on?'checked':''} aria-label="${esc(p.name)}">
      <div class="ln">${esc(p.name)}<small>${esc(p.loraName&&p.loraName!==p.name?p.loraName+'・':'')}標準の重み ${esc(p.weight??'')}${p.tags?'・'+esc(p.tags):''}</small></div>
      ${on?`<input type="number" step="0.05" inputmode="decimal" data-lw="${p.id}" value="${esc(on.weight??'')}" placeholder="${esc(p.weight??'')}" aria-label="重み">`:''}</div>`;}).join('')
    :'<p class="hint" style="margin:0 0 8px">LoRA はまだ登録されていません。</p>'}
    <button class="btn ghost sm" id="addLora" style="margin-top:8px">＋ LoRA を登録</button>
  </div>

  <div class="sec"><h2>生成した画像 <small>1枚目が表紙になります</small></h2>
    <p class="hint" style="margin:-4px 0 10px">画像を追加すると、そのときのプロンプトの設定も一緒に記録します。画像を押すと、その設定をシーンに取り込めます。</p>
    <div class="imgs">${sc.images.map((id,k)=>`<button class="im" data-imgi="${k}"><img data-img="${id}" alt="">${k===0?'<em>表紙</em>':''}${(sc.imgMeta||{})[id]?'<i class="snapb" title="設定を記録済み">設定</i>':''}</button>`).join('')}
    <label class="im add">＋ 画像を追加<input type="file" accept="image/*" multiple hidden id="addImg"></label></div>
  </div>

  <label class="f"><span>メモ（シード値・モデル名・気づいたことなど）</span><textarea id="sMemo" rows="3">${esc(sc.memo||'')}</textarea></label>
  ${u.length?`<p class="hint">使っている作品：${u.map(x=>`${esc(x.w.title||'無題の4コマ')}（${ROLE[x.i]}）`).join('、')}</p>`:''}
  <div class="row"><button class="btn" id="sDup">複製して少し変える</button><button class="btn danger" id="sDel">削除</button></div>
  <p class="hint">「複製して少し変える」は、部品の選び方とタグをそのまま写した新しいシーンを作ります（画像は写しません）。</p>
  <button class="fab sm" id="fabCopy" aria-label="プロンプトをコピー"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>コピー</button>`;
  $('#fabCopy').onclick=()=>copyText(buildPrompt(sc).pos);

  sc.weights=sc.weights||{};
  /* 重みの画面 */
  const drawW=(p)=>{
    const box=$('#wBody');
    if(p.fmt==='prose'){box.innerHTML='<p class="hint" style="margin:0">文章の形（Tsubaki 系）では重みを入れません。PixAI のガイドで、(tag:1.2) の書き方は効かないとされているためです。強めたいものは、文章の前のほうに書いてください。</p>';return;}
    if(!p.tagList.length){box.innerHTML='<p class="hint" style="margin:0">部品を選ぶと、ここにタグが並びます。</p>';return;}
    if(wSel&&!p.tagList.some(t=>t.key===wSel))wSel=null;
    const wOf=t=>(t.key in sc.weights)?sc.weights[t.key]:(t.own??1);
    const sel=p.tagList.find(t=>t.key===wSel);
    box.innerHTML=`<div class="tgs">${p.tagList.map(t=>{const w=wOf(t);return `<button type="button" class="tg wt ${w>1?'up':w<1?'dn':''} ${t.key===wSel?'sel':''}" data-wk="${esc(t.key)}">${esc(t.base)}${Math.abs(w-1)>1e-9?` <b>${+(+w).toFixed(2)}</b>`:''}</button>`;}).join('')}</div>
    ${sel?`<div class="wedit">
      <div class="wtop"><b>${esc(sel.base)}</b><code id="wPrev"></code></div>
      <div class="wrow"><button class="btn ghost sm" id="wDn" aria-label="弱く">－</button><input type="range" id="wRange" min="0.5" max="1.8" step="0.05" value="${wOf(sel)}" aria-label="重み"><button class="btn ghost sm" id="wUp" aria-label="強く">＋</button></div>
      <div class="wscale"><span>0.5 弱い</span><span>1.0 ふつう</span><span>1.8 強い</span></div>
      <div class="row" style="margin-bottom:0">${[0.8,0.9,1.1,1.2,1.3].map(v=>`<button class="btn ghost sm" data-wv="${v}">${v}</button>`).join('')}<button class="btn danger sm" id="wReset">元に戻す</button></div>
      <span class="hint">1.1〜1.3 くらいが目安です。1.5 を超えると絵がくずれやすくなります。このシーンだけの設定です。</span>
    </div>`:`${Object.keys(sc.weights).length?'<div class="row" style="margin:10px 0 0"><button class="btn danger sm" id="wAll">重みをすべて元に戻す</button></div>':''}`}`;
    $$('[data-wk]',box).forEach(b=>b.onclick=()=>{wSel=wSel===b.dataset.wk?null:b.dataset.wk;drawW(buildPrompt(sc));});
    const wa=$('#wAll');if(wa)wa.onclick=()=>{if(!confirm('このシーンの重みを、すべて元に戻しますか？'))return;sc.weights={};save('scenes',sc);upd();};
    if(!sel)return;
    const setW=v=>{v=Math.round(Math.min(1.8,Math.max(0.5,v))*100)/100;if(Math.abs(v-(sel.own??1))<1e-9)delete sc.weights[sel.key];else sc.weights[sel.key]=v;save('scenes',sc);
      $('#wRange').value=v;$('#wPrev').textContent=weigh(sel.base,sc);const p2=buildPrompt(sc);$('#pPos').innerHTML=hlPrompt(p2.pos);
      const chip=$(`[data-wk="${CSS.escape(sel.key)}"]`,box);if(chip){chip.className=`tg wt ${v>1?'up':v<1?'dn':''} sel`;chip.innerHTML=esc(sel.base)+(Math.abs(v-1)>1e-9?` <b>${v}</b>`:'');}};
    $('#wPrev').textContent=weigh(sel.base,sc);
    $('#wRange').oninput=e=>setW(+e.target.value);
    $('#wUp').onclick=()=>setW(wOf(sel)+0.05);
    $('#wDn').onclick=()=>setW(wOf(sel)-0.05);
    $$('[data-wv]',box).forEach(b=>b.onclick=()=>setW(+b.dataset.wv));
    $('#wReset').onclick=()=>setW(sel.own??1);
  };
  const upd=()=>{const p=buildPrompt(sc);if(p.pos)$('#pPos').innerHTML=hlPrompt(p.pos);else $('#pPos').textContent='（部品を選ぶと、ここにプロンプトができます）';$('#pNeg').textContent=p.neg;$('#negWrap').hidden=!p.neg;drawW(p);
    $('#pLora').innerHTML=p.loras.length?'PixAI で選ぶ LoRA：'+p.loras.map(l=>`<span>${esc(l.name)}（${esc(l.weight===''?'—':l.weight)}）</span>`).join(''):'';};
  upd();
  $('#cpPos').onclick=()=>copyText(buildPrompt(sc).pos);
  $('#cpNeg').onclick=()=>copyText(buildPrompt(sc).neg);
  $('#sTitle').oninput=e=>{sc.title=e.target.value;$('#ttl').textContent=sc.title||'無題のシーン';save('scenes',sc);};
  $('#sMemo').oninput=e=>{sc.memo=e.target.value;save('scenes',sc);};
  $$('[data-role]',view).forEach(b=>b.onclick=()=>{const r=b.dataset.role;sc.roles=sc.roles.includes(r)?sc.roles.filter(x=>x!==r):[...sc.roles,r];b.classList.toggle('on');save('scenes',sc);});
  /* 部品を選ぶ */
  $$('[data-gpick]',view).forEach(b=>b.onclick=()=>{const sel=b.closest('.f').querySelector('select[data-type]');sel.value=sel.value===b.dataset.gpick?'':b.dataset.gpick;sel.onchange();});
  $$('select[data-type]',view).forEach(s=>s.onchange=()=>{
    const slot=s.dataset.slot,f=s.dataset.f,scf=s.dataset.scf;
    const setv=v=>{if(slot!=null)sc.chars[+slot][f]=v;else sc[scf]=v;};
    const getv=()=>slot!=null?sc.chars[+slot][f]:sc[scf];
    if(s.value==='__new'){s.value=getv()||'';openPart(null,s.dataset.type,p=>{setv(p.id);saveNow('scenes',sc);render(true);});return;}
    setv(s.value);save('scenes',sc);render(true);
  });
  $$('[data-editpart]',view).forEach(b=>b.onclick=()=>openPart(b.dataset.editpart,null,()=>render(true)));
  $$('input[data-t]',view).forEach(i=>i.oninput=()=>{sc.chars[+i.dataset.slot][i.dataset.t]=i.value;save('scenes',sc);upd();});
  $$('input[data-st]',view).forEach(i=>i.oninput=()=>{sc[i.dataset.st]=i.value;save('scenes',sc);upd();});
  $$('[data-delslot]',view).forEach(b=>b.onclick=()=>{sc.chars.splice(+b.dataset.delslot,1);save('scenes',sc);render(true);});
  $('#addSlot').onclick=()=>{sc.chars.push(newSlot());save('scenes',sc);render(true);};
  /* 体の状態・絡み（いくつでも） */
  $$('[data-chip]',view).forEach(b=>b.onclick=()=>{
    const kind=b.dataset.chip,slot=b.dataset.slot;
    const per=kind==='body'||kind==='phys';/* 人物ごと */
    const arr=()=>per?(sc.chars[+slot][kind]||[]):(sc[kind]||[]);
    const setArr=a=>{if(per)sc.chars[+slot][kind]=a;else sc[kind]=a;};
    if(b.dataset.pid==='__new'){openPart(null,kind,p=>{if(p){setArr([...arr(),p.id]);saveNow('scenes',sc);}render(true);});return;}
    const id=b.dataset.pid,a=arr();setArr(a.includes(id)?a.filter(x=>x!==id):[...a,id]);save('scenes',sc);render(true);
  });
  $('#fmtSel').onchange=e=>{S.meta.fmt=e.target.value;dbPut('meta',S.meta);upd();};
  /* LoRA */
  $$('input[data-lora]',view).forEach(cb=>cb.onchange=()=>{const id=cb.dataset.lora;if(cb.checked)sc.loras.push({id,weight:''});else sc.loras=sc.loras.filter(l=>l.id!==id);save('scenes',sc);render(true);});
  $$('input[data-lw]',view).forEach(i=>i.oninput=()=>{const l=sc.loras.find(x=>x.id===i.dataset.lw);if(l){l.weight=i.value;save('scenes',sc);upd();}});
  $('#addLora').onclick=()=>openPart(null,'lora',p=>{sc.loras.push({id:p.id,weight:''});saveNow('scenes',sc);render(true);});
  /* 画像 */
  $('#addImg').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;toast('画像を取り込んでいます…');for(const f of files){try{const id=await addImage(f);sc.images.push(id);recordSnap(sc,id);}catch(_){toast('取り込めない画像がありました');}}await saveNow('scenes',sc);render(true);toast(files.length+'枚を追加しました');};
  $$('[data-imgi]',view).forEach(b=>b.onclick=()=>openImage(sc,+b.dataset.imgi));
  /* 複製・削除 */
  $('#sDup').onclick=async()=>{const n=JSON.parse(JSON.stringify(sc));n.id=uid();n.title=(sc.title||'無題のシーン')+'（コピー）';n.images=[];n.created=Date.now();S.scenes.push(n);await saveNow('scenes',n);stack.pop();history.replaceState({n:stack.length+1},'');stack.push({v:'scene',id:n.id});render();toast('複製しました。変えたいところだけ直してください');};
  $('#sDel').onclick=async()=>{const uu=usedIn(sc.id);if(!confirm(uu.length?`このシーンは ${uu.length} か所の作品で使っています。削除すると作品からも外れます。削除しますか？`:'このシーンを削除しますか？'))return;
    for(const x of uu){x.w.panels[x.i]='';await saveNow('works',x.w);}
    const imgs=sc.images;S.scenes=S.scenes.filter(x=>x.id!==sc.id);await dbDel('scenes',sc.id);for(const id of imgs)await deleteImageIfUnused(id);goBack();};
}
/* 画像ごとに、そのときのプロンプトの設定を記録する */
const SNAP_KEYS=['chars','inter','angle','bg','camera','light','style','loras','add','remove','neg','weights'];
const snapDef=k=>(k==='chars'||k==='inter'||k==='angle'||k==='loras')?[]:k==='weights'?{}:'';
const snapVal=(o,k)=>JSON.parse(JSON.stringify(o[k]??snapDef(k)));
function recordSnap(sc,id){sc.imgMeta=sc.imgMeta||{};const snap={};for(const k of SNAP_KEYS)snap[k]=snapVal(sc,k);const p=buildPrompt(sc);sc.imgMeta[id]={snap,pos:p.pos,neg:p.neg,loras:p.loras,fmt:p.fmt,at:Date.now()};}
function snapSame(sc,snap){return SNAP_KEYS.every(k=>JSON.stringify(snapVal(sc,k))===JSON.stringify(snapVal(snap,k)));}
function snapSummary(snap){
  const nm=id=>{const p=byId('parts',id);return p?esc(p.name||'名前なし'):(id?'<span class="gone">（削除された部品）</span>':'');};
  const rows=[];
  (snap.chars||[]).forEach((c,i)=>{const b=[nm(c.chara),...(c.phys||[]).map(nm),nm(c.outfit),nm(c.action),nm(c.face),...(c.body||[]).map(nm)].filter(Boolean).join('・');rows.push(`<tr><th>人物 ${i+1}</th><td>${b||'—'}${c.add?`<br><small>足す：${esc(c.add)}</small>`:''}${c.remove?`<br><small>外す：${esc(c.remove)}</small>`:''}</td></tr>`);});
  if((snap.inter||[]).length)rows.push(`<tr><th>絡み</th><td>${snap.inter.map(nm).join('・')}</td></tr>`);
  if((snap.angle||[]).length)rows.push(`<tr><th>カメラ位置</th><td>${snap.angle.map(nm).join('・')}</td></tr>`);
  const rest=[['背景',snap.bg],['構図',snap.camera],['光',snap.light],['画風',snap.style]].filter(x=>x[1]).map(([l,id])=>`<tr><th>${l}</th><td>${nm(id)}</td></tr>`);
  rows.push(...rest);
  if((snap.loras||[]).length)rows.push(`<tr><th>LoRA</th><td>${snap.loras.map(l=>nm(l.id)+(l.weight!==''&&l.weight!=null?`（${esc(l.weight)}）`:'')).join('・')}</td></tr>`);
  const w=Object.entries(snap.weights||{});if(w.length)rows.push(`<tr><th>重み</th><td>${w.map(([k,v])=>`${esc(k)} ${v}`).join('、')}</td></tr>`);
  return `<table class="snapt">${rows.join('')}</table>`;
}
function openImage(sc,k){
  const id=sc.images[k];const m=(sc.imgMeta||{})[id];
  const same=m&&snapSame(sc,m.snap);
  openSheet(`<img class="full" data-img="${id}" data-full="1" alt="">
  ${m?`<div class="sec snapbox"><h2>この画像の設定 <small>${fmtDate(m.at)} に記録</small></h2>
    ${snapSummary(m.snap)}
    <div class="plabel">そのときのプロンプト <button class="btn sm ghost" id="iCopy">コピー</button></div>
    <pre class="pbox">${hlPrompt(m.pos||'')}</pre>
    ${same?'<p class="hint" style="margin:10px 0 0">今のシーンの設定と同じです。</p>'
    :`<button class="btn wide" id="iLoad" style="margin-top:12px">この画像の設定を取り込む</button><span class="hint">今のシーンの部品・タグ・重み・LoRA が、この画像を作ったときの設定に切り替わります。シーンの名前・メモ・画像はそのままです。</span>`}
  </div>`
  :`<div class="banner info">この画像には、プロンプトの設定が記録されていません（この機能より前に追加した画像です）。</div>`}
  <div class="row">${k>0?'<button class="btn ghost" id="iCover">表紙にする</button>':''}<button class="btn ghost" id="iSave">端末に保存</button><button class="btn ghost" id="iRec">${m?'今の設定で記録し直す':'今の設定を記録する'}</button><button class="btn danger" id="iDel">このシーンから外す</button><button class="btn ghost" id="iClose">閉じる</button></div>`);
  $('#iClose').onclick=closeSheet;
  const ic=$('#iCopy');if(ic)ic.onclick=()=>copyText(m.pos);
  const il=$('#iLoad');if(il)il.onclick=async()=>{
    if(!confirm('今のシーンの設定を、この画像を作ったときの設定に切り替えます。よろしいですか？'))return;
    if(!(sc.images||[]).some(x=>{const mm=(sc.imgMeta||{})[x];return mm&&snapSame(sc,mm.snap);})&&!confirm('今の設定は、どの画像にも記録されていません。切り替えると今の設定はなくなります。続けますか？\n（残したいときは「やめる」を押し、シーンを複製してから取り込んでください）'))return;
    for(const k2 of SNAP_KEYS)sc[k2]=snapVal(m.snap,k2);
    await saveNow('scenes',sc);wSel=null;closeSheet();render(true);
    toast('この画像の設定を取り込みました');
  };
  $('#iRec').onclick=async()=>{if(m&&!confirm('この画像に記録している設定を、今のシーンの設定で上書きします。よろしいですか？'))return;recordSnap(sc,id);await saveNow('scenes',sc);closeSheet();render(true);toast('今の設定を記録しました');};
  const cv=$('#iCover');if(cv)cv.onclick=()=>{sc.images.splice(k,1);sc.images.unshift(id);saveNow('scenes',sc);closeSheet();render(true);};

  $$('.ptabs button',view).forEach(b=>b.onclick=()=>{flush();cSel=null;cur().i=+b.dataset.pi;render();});
  $('#addB').onclick=()=>{ctlTab='text';const b=newBubble('セリフ',comp.bubbles.length);comp.bubbles.push(b);cSel=comp.bubbles.length-1;save('works',w);draw();ctl();setTimeout(()=>{const t=$('#bText');if(t){t.focus();t.select();}},50);};
  $('#fromLine').onclick=()=>{const ts=linesToTexts(w.lines[i]);if(!ts.length)return toast('この コマのセリフ・メモが空です（作品の画面で書けます）');
    if(comp.bubbles.length&&!confirm(`セリフ・メモから ${ts.length} 個の吹き出しを足します。今の吹き出しは残ります。よろしいですか？`))return;
    ctlTab='text';const n=comp.bubbles.length;ts.forEach((t,k)=>comp.bubbles.push(newBubble(t,n+k)));cSel=comp.bubbles.length-1;save('works',w);draw();ctl();toast(ts.length+'個の吹き出しを作りました');};
  $('#fromSet').onclick=()=>openSets(w,i,comp,()=>cSel,(sel,focus)=>{cSel=sel;panMode=false;if(focus)ctlTab='text';render(true);if(focus)setTimeout(()=>{const t=$('#bText');if(t){t.focus();t.select();}},80);});
  const placeStamp=id=>{loadStamp(id).then(()=>{const sb=cSel!=null?comp.bubbles[cSel]:null;
      if(sb&&sb.type==='img'&&stampPickReplace){sb.stamp=id;}else{const nb=newStampB(id,comp.bubbles.length);const o=stampImg[id];if(o&&o.im){const[EW,EH]=expWH();nb.sz=Math.min(0.2,0.6*(EW/EH)*o.im.naturalHeight/o.im.naturalWidth);nb.x=0.5;}comp.bubbles.push(nb);cSel=comp.bubbles.length-1;}
      stampPickReplace=false;panMode=false;save('works',w);render(true);});};
  $('#stampB').onclick=()=>{stampPickReplace=false;openStamps(placeStamp);};
  $('#panB').onclick=()=>{panMode=!panMode;if(panMode)cSel=null;render(true);};
  $('#saveOne').onclick=async()=>{flush();const b=await renderFull(w,i);downloadBlob(b,fileName(w,i));};
  $('#expAll').onclick=()=>{flush();openExport(w);};
  /* 指での操作 */
  let drag=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};};
  const hit=p=>{for(let k=comp.bubbles.length-1;k>=0;k--){const g=geoms[k];if(!g)continue;const dx=(p.x-g.cx)/g.rx,dy=(p.y-g.cy)/g.ry;if(g.rect?(Math.abs(dx)<=1&&Math.abs(dy)<=1):(dx*dx+dy*dy<=1.05))return k;}return -1;};
  cv.onpointerdown=e=>{
    const p=pt(e);cv.setPointerCapture(e.pointerId);
    const sb=cSel!=null?comp.bubbles[cSel]:null;
    if(sb&&hasTail(sb)&&Math.hypot(p.x-sb.tx*W,p.y-sb.ty*H)<26*unit){drag={k:'tail',p,o:{x:sb.tx,y:sb.ty}};return;}
    const h=panMode?-1:hit(p);
    if(h>=0){const b=comp.bubbles[h];const changed=cSel!==h;cSel=h;drag={k:'move',p,o:{x:b.x,y:b.y,tx:b.tx,ty:b.ty}};draw();if(changed)ctl();return;}
    if(panMode&&img){drag={k:'pan',p,o:{ox:comp.ox??.5,oy:comp.oy??.5}};return;}
    drag={k:'none',p};
  };
  cv.onpointermove=e=>{if(!drag||drag.k==='none')return;const p=pt(e),dx=p.x-drag.p.x,dy=p.y-drag.p.y;
    if(drag.k==='move'){const b=comp.bubbles[cSel];b.x=Math.min(1,Math.max(0,drag.o.x+dx/W));b.y=Math.min(1,Math.max(0,drag.o.y+dy/H));b.tx=drag.o.tx+(b.x-drag.o.x);b.ty=drag.o.ty+(b.y-drag.o.y);}
    else if(drag.k==='tail'){const b=comp.bubbles[cSel];b.tx=Math.min(1.05,Math.max(-0.05,drag.o.x+dx/W));b.ty=Math.min(1.05,Math.max(-0.05,drag.o.y+dy/H));}
    else if(drag.k==='pan'){const iw=img.naturalWidth,ih=img.naturalHeight;let s=comp.fit==='contain'?Math.min(W/iw,H/ih):Math.max(W/iw,H/ih);s*=comp.zoom||1;
      const ew=W-iw*s,eh=H-ih*s;if(ew<-1)comp.ox=Math.min(1,Math.max(0,drag.o.ox+dx/ew));if(eh<-1)comp.oy=Math.min(1,Math.max(0,drag.o.oy+dy/eh));}
    redraw();};
  const up=e=>{if(!drag)return;const d=drag;drag=null;
    if(d.k==='none'){const p=pt(e);if(Math.hypot(p.x-d.p.x,p.y-d.p.y)<8*unit&&cSel!=null){cSel=null;draw();ctl();}return;}
    save('works',w);};
  cv.onpointerup=up;cv.onpointercancel=up;
  /* 下の操作欄 */
  function ctl(){
    const box=$('#cctl');const b=cSel!=null?comp.bubbles[cSel]:null;
    document.body.classList.toggle('editing',!!b);if(!b)document.body.classList.remove('typing');
    /* 上の帯：何番目か・前後の吹き出し・よく使う操作 */
    const n=comp.bubbles.length;
    const bar=b?`<div class="ebar"><button class="btn ghost sm" id="bPrev" ${n<2?'disabled':''} aria-label="前の吹き出し">‹</button><b>${cSel+1}／${n}</b><button class="btn ghost sm" id="bNext" ${n<2?'disabled':''} aria-label="次の吹き出し">›</button><button class="btn ghost sm" id="bDup">複製</button><button class="btn danger sm" id="bDel">削除</button><button class="btn sm" id="bDone">完了</button></div>`:'';
    const tabs=list=>{if(!list.some(([k])=>k===ctlTab))ctlTab=list[0][0];return `<div class="etabs">${list.map(([k,l])=>`<button type="button" class="${k===ctlTab?'on':''}" data-et="${k}">${l}</button>`).join('')}</div>`;};

    const aRow=(id,k,label)=>{const v=Math.round(al(b[k])*100);return `<div class="rg"><span>${label}<br><b id="${id}v">${v}%</b></span><input type="range" id="${id}" data-alpha="${k}" min="0" max="100" step="1" value="${v}" aria-label="${label}"><button type="button" class="btn ghost sm" data-rs="${id}">戻す</button></div>`;};
    const more=`<div class="row" style="margin:4px 0 0"><button class="btn ghost sm" id="bSet">セットに登録</button><button class="btn ghost sm" id="bFront">いちばん前へ</button></div>`;
    const common=()=>{
      $$('[data-et]',box).forEach(x=>x.onclick=()=>{ctlTab=x.dataset.et;ctl();});
      $$('[data-ck]',box).forEach(x=>{const k=x.dataset.ck;
        if(x.tagName==='INPUT'){x.oninput=e=>{b[k]=e.target.value;save('works',w);redraw();};x.onchange=()=>{draw();ctl();};}
        else x.onclick=()=>{b[k]=x.dataset.cv;save('works',w);draw();ctl();};});
      const on=(id,f)=>{const el=$('#'+id);if(el)el.onclick=f;};
      const owr=$('#bOw');if(owr)owr.oninput=e=>{b.ow=+e.target.value;$('#bOwv').textContent=b.ow.toFixed(1);save('works',w);redraw();};
      /* 濃さ（透明度） */
      $$('[data-alpha]',box).forEach(el=>{const k=el.dataset.alpha;el.oninput=e=>{b[k]=+e.target.value/100;$('#'+el.id+'v').textContent=e.target.value+'%';save('works',w);redraw();};
        const rs=$(`[data-rs="${el.id}"]`);if(rs)rs.onclick=()=>{el.value=100;b[k]=1;$('#'+el.id+'v').textContent='100%';save('works',w);redraw();};});
      $$('[data-cs]',box).forEach(x=>x.onclick=()=>{colSub=x.dataset.cs;ctl();});
      const go2=d=>{cSel=(cSel+d+n)%n;draw();ctl();};

    };
    const rng=(id,label,v,min,max,step,shown,reset)=>`<div class="rg"><span>${label}<br><b id="${id}v">${shown}</b></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}" aria-label="${label}">${reset!=null?`<button type="button" class="btn ghost sm" data-rs="${id}" data-rv="${reset}">戻す</button>`:''}</div>`;
    /* スライダーをつなぐ：k=値の名前、f=表示の形 */
    const bindR=(id,set,show)=>{const el=$('#'+id);if(!el)return;const apply=v=>{set(v);$('#'+id+'v').textContent=show(v);save('works',w);redraw();};el.oninput=e=>apply(+e.target.value);
      const rs=$(`[data-rs="${id}"]`);if(rs)rs.onclick=()=>{el.value=rs.dataset.rv;apply(+rs.dataset.rv);};};
    const pct=v=>Math.round(v*100)+'%',dg=v=>Math.round(v)+'°';
    if(b&&b.type==='img'){
      const r=STAMPS.find(x=>x.id===b.stamp);
      const T=tabs([['size','大きさ・傾き'],['color','色・外枠']]);
      const body=ctlTab==='size'?`${rng('bSz','大きさ',Math.round((b.sz||.16)*100),3,90,1,Math.round((b.sz||.16)*100))}
        ${rng('bRot','傾き',b.rot||0,-180,180,1,(b.rot||0)+'°',0)}
        <div class="row" style="margin:4px 0 0"><button class="btn ghost sm" id="bSwap">ほかの画像に替える</button><button class="btn ghost sm" id="bSet">セットに登録</button><button class="btn ghost sm" id="bFront">いちばん前へ</button></div>
        <p class="hint" style="margin:8px 0 0">${esc(r?r.name:'画像が見つかりません')}</p>`
        :`${colorRow('色（文字の部分を塗りかえる）','color',b.color,'元の色')}${colorRow('外枠の色','oc',b.oc,'なし')}${owRow(b.oc)}${aRow('bIa','ia','画像の濃さ')}`;
      box.innerHTML=`<div class="sec">${bar}${T}${body}</div>`;
      const sz=$('#bSz');if(sz)sz.oninput=e=>{b.sz=+e.target.value/100;$('#bSzv').textContent=e.target.value;save('works',w);redraw();};
      bindR('bRot',v=>b.rot=v,dg);
      const sw=$('#bSwap');if(sw)sw.onclick=()=>{stampPickReplace=true;openStamps(placeStamp);};

    }else if(b){

      let body='';
      if(ctlTab==='text')body=`<label class="f"><textarea id="bText" rows="2" placeholder="セリフ（改行で行を分けられます）">${esc(b.text)}</textarea></label>
        <div class="f"><span>書き方</span><div class="tgs"><button type="button" class="tg ${b.vertical?'on':''}" data-bv="1">縦書き</button><button type="button" class="tg ${b.vertical?'':'on'}" data-bv="0">横書き</button></div></div>
        ${b.vertical?`<div class="f"><span>縦書きの行の並び（改行したとき）</span><div class="tgs"><button type="button" class="tg ${b.vdir!=='rtl'?'on':''}" data-vd="">左から</button><button type="button" class="tg ${b.vdir==='rtl'?'on':''}" data-vd="rtl">右から</button></div></div>`:''}
        <div class="f"><span>字体</span><div class="tgs"><button type="button" class="tg ${!b.font?'on':''}" data-bf="">いつもの字体（${esc((FONTS.find(f=>f.id===S.meta.jpFont&&f.loaded)||{name:'スマホの字体'}).name)}）</button>${FONTS.filter(f=>f.loaded&&f.id!==S.meta.jpFont).map(f=>`<button type="button" class="tg ${b.font===f.id?'on':''}" data-bf="${f.id}" style="font-family:'${fontFam(f.id)}',${FONT}">${esc(f.name)}</button>`).join('')}</div>${FONTS.length?'<span class="hint">「いつもの字体」は「保存・設定」で変えられます。変えると、ここで「いつもの字体」にしている吹き出しは全部変わります。</span>':'<span class="hint">字体は「保存・設定」の「字体」で取り込めます。<button type="button" class="linkb" id="bFontHelp">入れ方を見る</button></span>'}</div>`;
      else if(ctlTab==='color'){
        const subs=[['text','文字'],['outline','文字の外枠'],...(b.type!=='none'?[['bubble','吹き出し']]:[])];if(!subs.some(([k])=>k===colSub))colSub='text';
        body=`<div class="tgs" style="margin-bottom:10px">${subs.map(([k,l])=>`<button type="button" class="tg ${colSub===k?'on':''}" data-cs="${k}">${l}</button>`).join('')}</div>`+
        (colSub==='text'?`${colorRow('文字の色','color',b.color||'#111111')}${aRow('bCa','ca','文字の濃さ')}`
        :colSub==='outline'?`${colorRow('文字の外枠の色','oc',textOC(b),'なし')}${owRow(textOC(b))}${textOC(b)?aRow('bOa','oa','外枠の濃さ'):''}`
        :`${colorRow('中の色','bg',b.bg===undefined?'#ffffff':b.bg,'透明')}${(b.bg===undefined||b.bg)?aRow('bBga','bga','中の濃さ'):''}${colorRow('線の色','lc',b.lc||'#111111')}${aRow('bLa','la','線の濃さ')}`)+
        `<p class="hint" style="margin:4px 0 0">濃さを下げると、うしろの絵が透けて見えます。</p>`;}
      else if(ctlTab==='shape')body=`<div class="f"><div class="tgs">${BTYPES.map(([k,l])=>`<button type="button" class="tg ${b.type===k?'on':''}" data-bt="${k}">${l}</button>`).join('')}</div></div>
        ${b.type!=='none'?`<div class="f"><span>輪郭の線</span><div class="tgs"><button type="button" class="tg ${b.line!=='brush'?'on':''}" data-bl="pen">ふつう</button><button type="button" class="tg ${b.line==='brush'?'on':''}" data-bl="brush">筆</button></div></div>
        ${rng('bLw','線の太さ',b.lw||1,0.4,3,0.1,(b.lw||1).toFixed(1))}`:''}
        ${b.type!=='box'&&b.type!=='none'?`<label class="switch" style="margin-bottom:8px"><input type="checkbox" id="bTail" ${b.tail?'checked':''}><span>しっぽを付ける<span class="hint">見本の青い丸を動かすと、しっぽの向きが変わります</span></span></label>`:''}${more}`;
      else if(ctlTab==='rot'){const steps=k=>`<div class="rsteps">${[-45,-30,-15,15,30,45].map(d=>`<button type="button" class="btn ghost sm" data-rk="${k}" data-rd="${d}">${d>0?'+':'−'}${Math.abs(d)}°</button>`).join('')}</div>`;
        body=`${b.type!=='none'?rng('bBrot','吹き出しの角度',b.brot||0,-180,180,1,dg(b.brot||0),0)+steps('brot'):''}${rng('bTrot','文字の角度',b.trot||0,-180,180,1,dg(b.trot||0),0)}${steps('trot')}
        <p class="hint" style="margin:6px 0 0">ボタンは、今の角度から足したり引いたりします。吹き出しと文字は、別々に回せます。${b.type!=='none'?'しっぽの先は、回しても今の場所のままです。':''}</p>`;}
      else body=`${b.type!=='none'?rng('bBsx','吹き出しの横幅',b.bsx||1,0.5,2.5,0.05,pct(b.bsx||1),1)+rng('bBsy','吹き出しの高さ',b.bsy||1,0.5,2.5,0.05,pct(b.bsy||1),1):''}
        ${rng('bFs','文字の大きさ',Math.round(b.fs*1000),18,70,1,Math.round(b.fs*1000))}${rng('bWrap','1行の文字数',b.wrap||0,0,20,1,b.wrap?b.wrap:'自動')}${rng('bCsp','文字の間',b.csp||0,-0.3,1,0.05,(b.csp||0).toFixed(2),0)}${rng('bLsp','行間',b.lsp==null?1:b.lsp,0,3,0.1,(b.lsp==null?1:b.lsp).toFixed(1),1)}
        <p class="hint" style="margin:4px 0 0">1行の文字数を「自動」（いちばん左）にすると、改行したところでだけ行が分かれ、吹き出しが文字に合わせて広がります。文字の間は、となりの字とのすき間（0がふつう）。行間は、改行したときの行と行のあいだ（1.0がふつう）です。</p>`;
      box.innerHTML=`<div class="sec">${bar}${T}${body}</div>`;
      const ta=$('#bText');if(ta){ta.oninput=e=>{b.text=e.target.value;save('works',w);redraw();};
        /* キーボードが出たら、入力欄が見本の下に隠れないように画面の下へ寄せる */

      $$('[data-bt]',box).forEach(x=>x.onclick=()=>{b.type=x.dataset.bt;save('works',w);draw();ctl();});

      bindR('bCsp',v=>b.csp=v,v=>v.toFixed(2));bindR('bLsp',v=>b.lsp=v,v=>v.toFixed(1));bindR('bWrap',v=>b.wrap=v,v=>v?v:'自動');
      const bt=$('#bTail');if(bt)bt.onchange=e=>{b.tail=e.target.checked;save('works',w);draw();};

      ${imgs.length>1?`<div class="f"><span>使う画像</span><div class="cimgs">${imgs.map(id=>`<button class="${id===curI?'on':''}" data-cimg="${id}"><img data-img="${id}" alt=""></button>`).join('')}</div></div>`:''}
      <label class="f"><span>拡大 <b id="zv">${(comp.zoom||1).toFixed(2)}</b></span><input type="range" id="cZoom" min="1" max="3" step="0.01" value="${comp.zoom||1}"></label>
      <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="cFit" ${comp.fit==='contain'?'checked':''}><span>絵の全体を入れる（はみ出さない。余白は白）</span></label>
      <div class="row" style="margin-bottom:0"><button class="btn ghost sm" id="cReset">位置と拡大を元に戻す</button></div>
      <span class="hint">「絵を動かす」を押すと、指で絵の位置を動かせます。絵の形が ${EW}×${EH} と違うときは、はみ出したところが切れます。</span></div>`;
      hydrate(box);
      $$('[data-cimg]',box).forEach(x=>x.onclick=()=>{comp.img=x.dataset.cimg;save('works',w);loadImg(comp.img).then(im=>{img=im;draw();});ctl();});
      $('#cZoom').oninput=e=>{comp.zoom=+e.target.value;$('#zv').textContent=comp.zoom.toFixed(2);save('works',w);redraw();};
      $('#cFit').onchange=e=>{comp.fit=e.target.checked?'contain':'cover';save('works',w);draw();};
      $('#cReset').onclick=()=>{comp.zoom=1;comp.ox=.5;comp.oy=.5;save('works',w);draw();ctl();};
    }
  }
  ctl();
}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},8000);}
async function openExport(w){

  openSheet(`<h2>4枚を書き出す <small class="muted" style="font-size:12px;font-weight:400">1コマ1枚（B）</small></h2>
  <div class="expgrid" id="expG">${ROLE.map((r,i)=>`<div><span class="role r${i}">${r}</span><i>作っています…</i></div>`).join('')}</div>
  <div class="two nar" style="margin:12px 0">
    <label class="f"><span>大きさ</span><select id="exSize">${Object.keys(EXP_SIZES).map(k=>`<option value="${k}"${(EXP_SIZES[S.meta.expSize]?S.meta.expSize:'1600x1824')===k?' selected':''}>${EXP_LABEL[k]}</option>`).join('')}</select></label>
    <label class="f"><span>形式</span><select id="exType"><option value="jpeg"${S.meta.expType!=='png'?' selected':''}>JPEG（おすすめ）</option><option value="png"${S.meta.expType==='png'?' selected':''}>PNG（きれい・重い）</option></select></label>
  </div>
  <div class="row"><button class="btn" id="exShare" disabled>共有（X などへ渡す）</button><button class="btn ghost" id="exSave" disabled>端末に保存（4枚）</button><button class="btn ghost" id="exClose">閉じる</button></div>
  <p class="hint">「共有」を押して X のアプリを選ぶと、4枚が投稿の画面に入ります。並ぶ順番は、投稿する前に X の画面で確かめてください（入れ替えもできます）。<br>「端末に保存」は「ダウンロード」のフォルダに入ります。ブラウザに「複数のファイルのダウンロード」を聞かれたら、許可してください。</p>`);
  let files=[];
  const build=async()=>{
    $('#exShare').disabled=$('#exSave').disabled=true;
    files=[];const g=$('#expG');
    for(let i=0;i<4;i++){const b=await renderFull(w,i);files.push(new File([b],fileName(w,i),{type:b.type}));
      const cell=g&&g.children[i];if(cell){const u=URL.createObjectURL(b);cell.innerHTML=`<span class="role r${i}">${ROLE[i]}</span><img src="${u}" alt="">`;}}
    if(!$('#exShare'))return;
    $('#exShare').disabled=$('#exSave').disabled=false;
    const mb=files.reduce((s,f)=>s+f.size,0)/1048576;
    const miss=[0,1,2,3].filter(i=>!compImg(w,i)).map(i=>ROLE[i]);
    $('#expG').insertAdjacentHTML('afterend',`<p class="hint" id="exInfo">${EW}×${EH}・合わせて約 ${mb.toFixed(1)} MB${miss.length?`<br><b style="color:var(--warn)">画像のないコマがあります：${miss.join('・')}</b>`:''}</p>`);
  };
  $('#exClose').onclick=closeSheet;
  $('#exSize').onchange=e=>{S.meta.expSize=e.target.value;dbPut('meta',S.meta);const x=$('#exInfo');if(x)x.remove();build();};
  $('#exType').onchange=e=>{S.meta.expType=e.target.value;dbPut('meta',S.meta);const x=$('#exInfo');if(x)x.remove();build();};
  $('#exSave').onclick=async()=>{for(const f of files){downloadBlob(f,f.name);await new Promise(r=>setTimeout(r,400));}toast('4枚を保存しました');};
  $('#exShare').onclick=async()=>{
    if(!(navigator.canShare&&navigator.canShare({files}))){toast('このブラウザでは共有できません。「端末に保存」を使ってください');return;}
    try{await navigator.share({files});}catch(e){if(e&&e.name!=='AbortError')toast('共有できませんでした');}
  };
  build();
}
