/* ===== 読み込み =====
   replace=false（合わせる）：同じ id は updated（直した日時）の新しい方を残す。消した記録（meta.deleted）もお互いに反映する
   replace=true（置き換え）：今のデータを消してから、ファイルの内容をそのまま入れる */
async function importAll(file,replace){
  let data;try{data=JSON.parse(await file.text());}catch(e){return toast('読み込めないファイルです');}
  if(!data||data.app!=='4koma-kobo')return toast('このアプリのバックアップではありません');
  if(replace&&!confirm('今のデータをすべて消して、ファイルの内容に置き換えます。よろしいですか？'))return;
  toast('読み込んでいます…');
  const cnt={add:0,upd:0,keep:0,del:0,img:0};
  try{
    flush();
    const inDel=(data.meta&&data.meta.deleted)||{};
    const tomb=replace?Object.assign({},inDel):Object.assign({},S.meta.deleted||{});
    if(!replace)for(const id in inDel)if(!(tomb[id]>=inDel[id]))tomb[id]=inDel[id];
    if(replace)for(const st of['parts','scenes','works','images','fonts','stamps'])await tx(st,'readwrite',x=>x.clear());
    const haveImg=new Set(replace?[]:(await tx('images','readonly',x=>x.getAllKeys())||[]));
    const haveFont=new Set(replace?[]:(await tx('fonts','readonly',x=>x.getAllKeys())||[]));
    for(const r of data.images||[]){if(haveImg.has(r.id))continue;await dbPut('images',{id:r.id,name:r.name,type:r.type,blob:await unb64(r.data),thumb:r.thumb?await unb64(r.thumb):null});cnt.img++;}
    const haveSt=new Set(replace?[]:(await tx('stamps','readonly',x=>x.getAllKeys())||[]));
    for(const r of data.stamps||[]){if(haveSt.has(r.id)||(!replace&&tomb[r.id]))continue;await dbPut('stamps',{id:r.id,name:r.name,w:r.w,h:r.h,created:r.created,blob:await unb64(r.data)});}
    for(const r of data.fonts||[]){if(haveFont.has(r.id)||(!replace&&tomb[r.id]))continue;await dbPut('fonts',{id:r.id,name:r.name,file:r.file,size:r.size,created:r.created,blob:await unb64(r.data)});}
    if(data.meta&&Array.isArray(data.meta.bsets)){const have=new Set((S.meta.bsets||[]).map(s=>s.id));S.meta.bsets=replace?data.meta.bsets:[...(S.meta.bsets||[]),...data.meta.bsets.filter(s=>!have.has(s.id))];}
    if(data.meta){for(const k of['jpFont','expSize','expType','fmt','loraInPrompt'])if(data.meta[k]!==undefined&&(replace||S.meta[k]===undefined))S.meta[k]=data.meta[k];}
    const freeImgs=[];
    for(const k of['parts','scenes','works']){
      for(const o of data[k]||[]){
        if(k==='parts'&&typeof o.img==='string')o.img=await unb64(o.img);
        const ou=o.updated||0;
        if(replace){await dbPut(k,o);cnt.add++;continue;}
        if(tomb[o.id]&&tomb[o.id]>=ou)continue;
        const cur=byId(k,o.id),cu=cur?(cur.updated||0):-1;
        if(cur&&cu>ou){cnt.keep++;continue;}
        const nm=x=>JSON.stringify(x.img?Object.assign({},x,{img:x.img.size||1}):x);
        if(cur&&cu===ou&&(cu>0||nm(cur)===nm(o)))continue;
        await dbPut(k,o);cur?cnt.upd++:cnt.add++;
      }
      if(!replace)for(const cur of S[k]){const t=inDel[cur.id];if(t&&t>=(cur.updated||0)){await dbDel(k,cur.id);cnt.del++;if(k==='scenes')freeImgs.push(...(cur.images||[]));}}
    }
    if(!replace)for(const id of haveFont)if(inDel[id]){await dbDel('fonts',id);if(S.meta.jpFont===id)S.meta.jpFont='';}
    if(!replace)for(const id of haveSt)if(inDel[id])await dbDel('stamps',id);
    const old=Date.now()-180*864e5;for(const id in tomb)if(tomb[id]<old)delete tomb[id];
    S.meta.deleted=tomb;await dbPut('meta',S.meta);
    for(const k in urlCache){URL.revokeObjectURL(urlCache[k]);delete urlCache[k];}
    await loadAll();for(const id of freeImgs)await deleteImageIfUnused(id);
    for(const k in imgCache)delete imgCache[k];for(const k in stampImg)delete stampImg[k];for(const k in stampCv)delete stampCv[k];await loadStamps().catch(()=>{});await loadFonts().catch(()=>{});
    if(replace){toast('読み込みました');render();return;}
    render();
    openSheet(`<h2>読み込みました</h2>
    <p class="hint" style="margin:-6px 0 12px">ファイル：${esc(file.name)}${data.exported?`（${fmtDate(Date.parse(data.exported))} に書き出したもの${data.textOnly?'・文字だけ':''}）`:''}</p>
    <div class="stat"><div><b>${cnt.add}</b><small>新しく足した</small></div><div><b>${cnt.upd}</b><small>新しい方に更新</small></div><div><b>${cnt.keep}</b><small>こちらが新しいので残した</small></div><div><b>${cnt.del}</b><small>相手で消したので消した</small></div></div>
    <p class="hint">画像：${cnt.img} 枚を足しました。数はシーン・作品・部品を合わせたものです。</p>
    <div class="row"><button class="btn wide" id="imClose">閉じる</button></div>`);
    $('#imClose').onclick=closeSheet;
  }catch(e){toast('読み込みの途中で失敗しました');}
}

/* ========== ピクトグラムで人物の向き・位置を決める ==========

   ・シーン全体：sc.pic = { pitch:カメラの高さ（度・＋で見下ろし）, ar:画面の形 }
   ・決めた構図・向き・ポーズのタグは、その人物のタグに入る（「かっこでまとめる」形では girl(…) の中）

/* 骨組みを作る道具。関節 J から先を、親の関節（pivot を書いたときはその関節）を軸に deg 度まわす。
   pl：'f' 正面から見た回転（＋で人物の左へ）、's' 横から見た回転（下を向いた手足は＋で前へ、上を向いた体は－で前へ）、't' 上から見た回転 */
function picRot(P,J,deg,pl,pivot){const pv=P[pivot||PIC_PARENT[J]||J].slice();const[ia,ib]=pl==='s'?[2,1]:pl==='t'?[0,2]:[0,1];const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  for(const n of picSub(J)){const v=P[n];if(!v)continue;const a=v[ia]-pv[ia],b=v[ib]-pv[ib];v[ia]=pv[ia]+a*c-b*s;v[ib]=pv[ib]+a*s+b*c;}}

function picGround(P,lift){let m=1e9;for(const n in P)m=Math.min(m,P[n][1]);for(const n in P)P[n][1]+=-m+(lift||0);}

  $('#dpCutEdge',sb).onclick=()=>{if(!im)return;if(cut.some(c=>c[0]<0))return toast('ふちの背景は、もう消しています');cut.push([-1,-1]);show();};
  $('#dpCutUndo',sb).onclick=()=>{const o=ops();if(!o.length)return;cut.splice(cut.length-o[o.length-1].pts.length);show();};
  $('#dpCutClr',sb).onclick=()=>{cut=[];show();};
  tl.oninput=showSoon;gp.oninput=showSoon;
  const setBlob=async b=>{try{const r=await dpNorm(b);p.img=r.blob;p.dp.bg=r.bg;p.dp.h=r.h;cut=[];im=await dpLoad(r.blob);
      const nm=dpFromName(b.name);
      if(nm&&nm.ang!=null&&!src)$('#dpAng',sb).value=nm.ang;
      if(!$('#dpName',sb).value.trim()){const k=S.parts.filter(x=>x.type==='depth').length+1;$('#dpName',sb).value=(nm&&nm.name)||('深度ポーズ '+k);}
      const same=await dpSame(r.h,p.id);$('#dpSameMsg',sb).innerHTML=same?`<div class="banner" style="margin:6px 0;border-color:var(--warn);color:var(--warn)">この画像は「${esc(same.name||'名前なし')}」として、もう登録しています。前と同じ画像をコピーしたままかもしれません。</div>`:'';
      show();}catch(_){toast('画像を読めませんでした');}};
  if(blob0)setBlob(blob0);else if(p.img)dpLoad(p.img).then(x=>{im=x;show();});else show();
  $('#dpIn',sb).onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)setBlob(f);};
  $('#dpCancel',sb).onclick=()=>closeSheet();
  {const e3=$('#dp3dEdit',sb);if(e3)e3.onclick=()=>{closeSheet();setTimeout(()=>dpOpen3D(src),60);};}
  const doSave=async next=>{if(!p.img)return toast('先に画像を貼り付けてください');
    p.name=$('#dpName',sb).value.trim()||'深度ポーズ';p.tags=$('#dpTags',sb).value.trim();p.memo=$('#dpMemo',sb).value;if(!cut.length&&!confirm('背景をまだ消していません。このまま保存しますか？（重ねたとき、背景の明るい所が残ります）'))return;
    p.dp={cat:$('#dpCat',sb).value,ang:$('#dpAng',sb).value,bg:dpBg(p),h:p.dp.h||(im?dpSig(im):''),cut:cut.map(x=>x.slice()),tol:+tl.value,gap:+gp.value,shrink:+sh.value};if(src&&src.dp&&src.dp.pose3d)p.dp.pose3d=src.dp.pose3d;
    const i=S.parts.findIndex(x=>x.id===p.id);if(i>=0)S.parts[i]=p;else S.parts.push(p);await saveNow('parts',p);closeSheet();onSave&&onSave(p);toast('「'+p.name+'」を保存しました');
    if(next)setTimeout(()=>openDepthPart(null,onSave,null,{n:(opt.n||1)+1,cat:p.dp.cat}),120);};
  $('#dpSave',sb).onclick=()=>doSave(false);
  const nx=$('#dpNext',sb);if(nx)nx.onclick=()=>doSave(true);
  const dl=$('#dpDel',sb);if(dl)dl.onclick=async()=>{if(!confirm(used?`この深度ポーズは ${used} 件のシーンで使っています。削除すると、そのシーンからも外れます。削除しますか？`:'この深度ポーズを削除しますか？'))return;
    for(const s of S.scenes)if(mapSceneIds(s,x=>x===p.id?'':x,false))await saveNow('scenes',s);
    S.parts=S.parts.filter(x=>x.id!==p.id);await dbDel('parts',p.id);markDeleted(p.id);closeSheet();onSave&&onSave(null);};
}
</script>
</body>
</html>
